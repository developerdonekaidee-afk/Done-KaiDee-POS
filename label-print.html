<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730k">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="omelette-owns-print" content="1">
<title>พิมพ์ป้ายสินค้า — KaiDee POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{--brand:#0E9C88;--brand-ink:#0A6E60;--brand-soft:#E3F5F1;--brand-softer:#EFFAF7;--ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--bg:#EEF2F0;--hair:#DCE4E1;--hair-2:#CBD5D0;--font:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px;padding:11px 16px;flex-wrap:wrap;}
  .bar .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(152deg,#14A886,#1E73B0);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .bar b{font-size:14.5px;} .bar .sub{font-size:11.5px;color:var(--ink-3);} .bar .sp{flex:1;}
  .btn{border:none;border-radius:10px;padding:9px 15px;font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn.pri{background:var(--brand);color:#fff;} .btn.gh{background:#EAF3F0;color:var(--brand-ink);}
  .wrap{max-width:1080px;margin:18px auto 70px;padding:0 16px;display:grid;grid-template-columns:320px 1fr;gap:20px;}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;}}
  .panel{background:#fff;border-radius:14px;border:1px solid var(--hair);padding:16px 18px;align-self:start;}
  .panel h2{font-size:14px;font-weight:700;margin-bottom:12px;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:12px 0 5px;}
  .in{width:100%;border:1.5px solid var(--hair-2);border-radius:9px;padding:8px 10px;font-family:var(--font);font-size:13.5px;outline:none;background:#fff;}
  .in:focus{border-color:var(--brand);}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{border:1.5px solid var(--hair-2);background:#fff;border-radius:9px;padding:7px 10px;font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;}
  .seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 0;cursor:pointer;}
  .rowline{display:flex;gap:7px;align-items:center;margin-bottom:7px;}
  .rowline .in{flex:1;} .rowline .qty{width:52px;text-align:center;} .rowline .price{width:78px;}
  .rowline .del{border:none;background:#F4E7E4;color:#C0503A;border-radius:8px;width:30px;height:30px;font-size:14px;cursor:pointer;flex:0 0 auto;}
  .hint{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:8px;}
  /* preview sheet */
  .sheet{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(20,40,30,.08);padding:10mm;display:flex;flex-wrap:wrap;align-content:flex-start;gap:var(--gap);}
  .label{border:1px dashed #c9d3ce;border-radius:2mm;padding:2mm 2.5mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:#fff;}
  .label .shop{font-size:2.3mm;color:#667;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .label .nm{font-weight:700;line-height:1.15;overflow:hidden;}
  .label .vendor{font-size:2.3mm;color:#0A6E60;line-height:1.1;}
  .label .btm{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5mm;}
  .label .price{font-weight:800;line-height:1;white-space:nowrap;}
  .label .price small{font-weight:600;}
  .label .date{font-size:2.2mm;color:#889;}
  .label svg.bc{display:block;max-width:100%;height:auto;}
  .label .code{font-family:var(--mono);font-size:2.2mm;color:#556;letter-spacing:.02em;}
  @media print{
    @page{size:A4;margin:8mm;}
    body{background:#fff;} .bar,.panel{display:none;} .wrap{display:block;margin:0;max-width:none;padding:0;}
    .sheet{box-shadow:none;border-radius:0;padding:0;gap:var(--gap);}
    .label{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .noborder .label{border:none;}
  }
</style>
<script>(function(){var m=document.querySelector('meta[name=build]'),V=m?m.content:"";try{var K="kd_build_v1",old=localStorage.getItem(K);if(V&&old!==V){localStorage.setItem(K,V);if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});}}catch(e){}if("serviceWorker" in navigator&&location.protocol==="https:"){var r=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(r)return;r=true;location.reload()});addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v="+V).then(function(g){try{g.update()}catch(e){}if(g.waiting)try{g.waiting.postMessage("skip")}catch(e){}}).catch(function(){})})}addEventListener("DOMContentLoaded",function(){try{var b=document.createElement("div");b.textContent="v "+V;b.style.cssText="position:fixed;left:5px;bottom:3px;z-index:99999;font:10px ui-monospace,monospace;color:#9aa3a8;opacity:.55;pointer-events:none";document.body.appendChild(b)}catch(e){}})})();</script>
</head>
<body>
<div class="bar">
  <div class="mk">🏷️</div>
  <div><b>พิมพ์ป้ายสินค้า</b><div class="sub" id="shopName">KaiDee POS</div></div>
  <div class="sp"></div>
  <button class="btn gh" id="btnBorder">▦ เส้นตัด: เปิด</button>
  <button class="btn pri" id="btnPrint">⬇ พิมพ์ / บันทึก PDF</button>
</div>
<div class="wrap">
  <div class="panel">
    <h2>1 · ขนาดป้าย</h2>
    <div class="seg" id="sizes"></div>
    <label class="f">คอลัมน์ต่อแถว (เว้นว่าง = อัตโนมัติ)</label>
    <input class="in" id="cols" type="number" min="1" max="8" placeholder="อัตโนมัติตามขนาด">

    <h2 style="margin-top:18px;">2 · แสดงบนป้าย</h2>
    <label class="chk"><input type="checkbox" id="cShop" checked> ชื่อร้าน</label>
    <label class="chk"><input type="checkbox" id="cBarcode" checked> บาร์โค้ด (Code128)</label>
    <label class="chk"><input type="checkbox" id="cCode" checked> ตัวเลขรหัสใต้บาร์โค้ด</label>
    <label class="chk"><input type="checkbox" id="cVendor"> ผู้ฝากขาย/ยี่ห้อ (ขายฝาก)</label>
    <label class="chk"><input type="checkbox" id="cDate"> วันที่/วันหมดอายุ</label>

    <h2 style="margin-top:18px;">3 · รายการสินค้า</h2>
    <button class="btn gh" id="btnPull" style="margin-bottom:8px;">📥 ดึงเมนูจากหน้าขาย</button>
    <div id="menuPick"></div>
    <div id="rows"></div>
    <button class="btn gh" id="btnAdd" style="margin-top:6px;">+ เพิ่มสินค้า</button>
    <div class="hint">ช่อง “จำนวน” = จำนวนป้ายที่จะพิมพ์ต่อสินค้า · รหัส/บาร์โค้ด เว้นว่างได้ · ป้ายขายฝากเปิด “ผู้ฝากขาย” เพื่อพิมพ์ยี่ห้อ/เจ้าของสินค้า</div>
  </div>
  <div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
  function qp(k){ return new URLSearchParams(location.search).get(k)||''; }
  var API=(function(){ try{ return (localStorage.getItem('kd_api_base')||'').trim().replace(/\/$/,'')||'https://kaidee-pos.oneday-pos.workers.dev'; }catch(e){ return 'https://kaidee-pos.oneday-pos.workers.dev'; } })();
  var SHOP_ID = qp('shop');
  var SHOP = qp('name')||'ร้านของคุณ';
  document.getElementById('shopName').textContent = SHOP;

  // ขนาดป้าย (มม.) — w × h + font base
  var SIZES = [
    {id:'50x30', label:'50×30 mm', w:50, h:30, nm:3.6, pr:6.5},
    {id:'40x30', label:'40×30 mm', w:40, h:30, nm:3.3, pr:6},
    {id:'32x25', label:'32×25 mm', w:32, h:25, nm:2.9, pr:5},
    {id:'60x40', label:'60×40 mm', w:60, h:40, nm:4.2, pr:8},
    {id:'a4tag', label:'ป้ายราคาใหญ่ 70×50', w:70, h:50, nm:5, pr:11},
  ];
  var GAP_MM = 2;
  var state = {
    size:'50x30', cols:'', border:true,
    show:{ shop:true, barcode:true, code:true, vendor:false, date:false },
    items:[
      {nm:'', price:'', code:'', vendor:'', date:'', qty:8}
    ]
  };
  // seed จากพารามิเตอร์ (เช่นเรียกจากเมนู)
  if(qp('item')){ state.items=[{nm:qp('item'), price:qp('price')||'', code:qp('code')||'', vendor:qp('vendor')||'', date:'', qty:+(qp('qty')||8)||8}]; }

  var sizesEl=document.getElementById('sizes');
  SIZES.forEach(function(s){ var b=document.createElement('button'); b.textContent=s.label; b.dataset.id=s.id;
    b.onclick=function(){ state.size=s.id; renderSizes(); render(); }; sizesEl.appendChild(b); });
  function renderSizes(){ [...sizesEl.children].forEach(function(b){ b.classList.toggle('on', b.dataset.id===state.size); }); }

  document.getElementById('cols').oninput=function(e){ state.cols=e.target.value; render(); };
  ['Shop:shop','Barcode:barcode','Code:code','Vendor:vendor','Date:date'].forEach(function(pair){
    var p=pair.split(':'); var el=document.getElementById('c'+p[0]);
    el.checked=state.show[p[1]];
    el.onchange=function(){ state.show[p[1]]=el.checked; render(); };
  });
  document.getElementById('btnBorder').onclick=function(){ state.border=!state.border; this.textContent='▦ เส้นตัด: '+(state.border?'เปิด':'ปิด'); render(); };
  document.getElementById('btnPrint').onclick=function(){ window.print(); };
  document.getElementById('btnAdd').onclick=function(){ state.items.push({nm:'',price:'',code:'',vendor:'',date:'',qty:8}); renderRows(); render(); };

  // ── ดึงเมนูจากหน้าขาย (worker /menu?shop=) ให้เลือกทำป้าย ──
  var menuCache=null; var pickEl=document.getElementById('menuPick');
  var btnPull=document.getElementById('btnPull');
  function pullMenu(){
    if(!SHOP_ID){ pickEl.innerHTML='<div class="hint" style="color:#C0503A">ยังไม่รู้ว่าเป็นร้านไหน — เปิดหน้านี้จากในแอป/Backoffice เพื่อดึงเมนูอัตโนมัติ</div>'; return; }
    pickEl.innerHTML='<div class="hint">กำลังดึงเมนู…</div>';
    fetch(API+'/menu?shop='+encodeURIComponent(SHOP_ID)).then(function(r){ return r.ok?r.json():[]; }).then(function(rows){
      menuCache = Array.isArray(rows)?rows:[]; renderPick();
    }).catch(function(){ pickEl.innerHTML='<div class="hint" style="color:#C0503A">ดึงเมนูไม่สำเร็จ — เชื่อมต่อ backend ไม่ได้ (กรอกเองด้านล่างได้)</div>'; });
  }
  function renderPick(){
    if(!menuCache) return;
    if(!menuCache.length){ pickEl.innerHTML='<div class="hint">ยังไม่มีเมนูในร้านนี้</div>'; return; }
    var sel={};
    var box=document.createElement('div');
    box.style.cssText='border:1.5px solid var(--hair-2);border-radius:10px;max-height:230px;overflow:auto;margin-bottom:8px;';
    menuCache.forEach(function(m,i){
      var row=document.createElement('label');
      row.className='chk'; row.style.cssText='padding:7px 10px;border-bottom:1px solid var(--hair);gap:9px;';
      row.innerHTML='<input type="checkbox"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.th||m.en||'ไม่มีชื่อ')+'</span><span class="code" style="color:#556;font-size:12px">฿'+((m.price!=null?m.price:'')||'')+'</span>';
      row.querySelector('input').onchange=function(e){ sel[i]=e.target.checked; };
      box.appendChild(row);
    });
    var bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;align-items:center;';
    bar.innerHTML='<button class="btn pri" style="font-size:12.5px;padding:7px 12px">+ เพิ่มที่เลือกลงป้าย</button><button class="btn gh" style="font-size:12.5px;padding:7px 12px">เลือกทั้งหมด</button>';
    bar.children[0].onclick=function(){
      var picked=menuCache.filter(function(_,i){ return sel[i]; });
      if(!picked.length){ picked=[]; }
      var add=picked.map(function(m){ return { nm:(m.th||m.en||''), price:(m.price!=null?String(m.price):''), code:String(m.id||m.sku||''), vendor:(m.consign?(m.vendor||''):''), date:'', qty:8 }; });
      if(add.length){
        // แทนที่แถวว่างเริ่มต้น
        if(state.items.length===1 && !(state.items[0].nm||'').trim()) state.items=[];
        state.items=state.items.concat(add); renderRows(); render();
      }
    };
    bar.children[1].onclick=function(){ box.querySelectorAll('input').forEach(function(c,i){ c.checked=true; sel[i]=true; }); };
    pickEl.innerHTML=''; pickEl.appendChild(box); pickEl.appendChild(bar);
  }
  btnPull.onclick=pullMenu;
  if(SHOP_ID) pullMenu();  // มี shop → ดึงให้เลย

  var rowsEl=document.getElementById('rows');
  function renderRows(){
    rowsEl.innerHTML='';
    state.items.forEach(function(it,i){
      var d=document.createElement('div'); d.className='rowline';
      d.innerHTML='<input class="in nmf" placeholder="ชื่อสินค้า" value="'+esc(it.nm)+'">'+
        '<input class="in price" placeholder="ราคา" value="'+esc(it.price)+'">'+
        '<input class="in qty" type="number" min="1" value="'+(it.qty||1)+'">'+
        '<button class="del">✕</button>';
      var ins=d.querySelectorAll('input');
      ins[0].oninput=function(e){ it.nm=e.target.value; render(); };
      ins[1].oninput=function(e){ it.price=e.target.value; render(); };
      ins[2].oninput=function(e){ it.qty=+e.target.value||1; render(); };
      d.querySelector('.del').onclick=function(){ state.items.splice(i,1); if(!state.items.length) state.items.push({nm:'',price:'',code:'',vendor:'',date:'',qty:8}); renderRows(); render(); };
      rowsEl.appendChild(d);
      // แถวเสริม รหัส/ผู้ฝาก/วันที่ (โชว์เมื่อเปิด)
      if(state.show.barcode||state.show.code||state.show.vendor||state.show.date){
        var d2=document.createElement('div'); d2.className='rowline';
        var html='';
        if(state.show.barcode||state.show.code) html+='<input class="in codef" placeholder="รหัส/บาร์โค้ด" value="'+esc(it.code)+'">';
        if(state.show.vendor) html+='<input class="in venf" placeholder="ผู้ฝากขาย/ยี่ห้อ" value="'+esc(it.vendor)+'">';
        if(state.show.date) html+='<input class="in datef" placeholder="วันหมดอายุ" value="'+esc(it.date)+'">';
        d2.innerHTML=html; d2.style.marginTop='-3px'; d2.style.marginBottom='11px';
        var f=d2.querySelectorAll('input'); var idx=0;
        if(state.show.barcode||state.show.code){ f[idx].oninput=(function(e){ it.code=e.target.value; render(); }); idx++; }
        if(state.show.vendor){ f[idx].oninput=(function(e){ it.vendor=e.target.value; render(); }); idx++; }
        if(state.show.date){ f[idx].oninput=(function(e){ it.date=e.target.value; render(); }); idx++; }
        rowsEl.appendChild(d2);
      }
    });
  }
  function esc(s){ return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  var sheet=document.getElementById('sheet');
  function render(){
    var S=SIZES.find(function(x){ return x.id===state.size; })||SIZES[0];
    sheet.style.setProperty('--gap', GAP_MM+'mm');
    sheet.classList.toggle('noborder', !state.border);
    // คำนวณคอลัมน์เพื่อจัด preview ให้ดูเป็นแผ่น (พิมพ์จริง browser จัดต่อ)
    var innerW = 210 - 16; // A4 กว้าง - margin
    var autoCols = Math.max(1, Math.floor((innerW+GAP_MM)/(S.w+GAP_MM)));
    sheet.innerHTML='';
    var frag=document.createDocumentFragment();
    var bcId=0;
    state.items.forEach(function(it){
      if(!(it.nm||'').trim() && !(it.price||'').trim() && !(it.code||'').trim()) return;
      var n=Math.max(1, Math.min(200, +it.qty||1));
      for(var k=0;k<n;k++){
        var lab=document.createElement('div'); lab.className='label';
        lab.style.width=S.w+'mm'; lab.style.height=S.h+'mm';
        var showBc = state.show.barcode && (it.code||'').trim();
        var html='';
        if(state.show.shop) html+='<div class="shop">'+esc(SHOP)+'</div>';
        html+='<div class="nm" style="font-size:'+S.nm+'mm">'+esc(it.nm||'—')+'</div>';
        if(state.show.vendor && (it.vendor||'').trim()) html+='<div class="vendor">ฝากขาย: '+esc(it.vendor)+'</div>';
        html+='<div class="btm"><div style="min-width:0">';
        if(showBc){ var id='bc'+(bcId++); html+='<svg class="bc" id="'+id+'"></svg>'; if(state.show.code) {} }
        else if(state.show.code && (it.code||'').trim()) html+='<div class="code">'+esc(it.code)+'</div>';
        html+='</div>';
        var pr=(it.price||'').toString().trim();
        if(pr) html+='<div class="price" style="font-size:'+S.pr+'mm">฿'+esc(pr)+'</div>';
        html+='</div>';
        if(state.show.date && (it.date||'').trim()) html+='<div class="date">EXP '+esc(it.date)+'</div>';
        lab.innerHTML=html;
        lab._bc = showBc ? { id: lab.querySelector('svg.bc').id, code: it.code } : null;
        frag.appendChild(lab);
      }
    });
    sheet.appendChild(frag);
    // เรนเดอร์บาร์โค้ด
    if(window.JsBarcode){
      sheet.querySelectorAll('svg.bc').forEach(function(svg){
        var lab=svg.closest('.label'); var code=(lab._bc&&lab._bc.code)||'';
        try{ JsBarcode(svg, code, { format:'CODE128', displayValue:state.show.code, fontSize:9, height:26, margin:0, width:1.3, font:'IBM Plex Mono' }); }catch(e){}
      });
    }
    if(!sheet.children.length) sheet.innerHTML='<div style="color:#889;font-size:14px;padding:30px">กรอกชื่อสินค้า/ราคา แล้วป้ายจะแสดงที่นี่</div>';
  }
  renderSizes(); renderRows(); render();
</script>
</body>
</html>
