 {badge:'✅',tip:'ครบวงจรขายฝาก — รับฝาก · ขาย · แบ่งเงิน · จ่ายคืน โปร่งใสทุกบาท — กด “เริ่มใหม่”',focus:null,done:true,

];

    '<div class="pi"><div><b>🧺 ตะกร้าสาน</b><div style="font-size:12px;color:var(--ink-3);margin-top:2px">เจ้าของ: ลุงมี</div></div><div style="text-align:right"><div style="font-weight:800;color:var(--brand)">฿350</div><span class="tag cons">ฝากขาย</span></div></div>'+
    '<div class="pi"><div><b>🍯 น้ำผึ้งป่า</b><div style="font-size:12px;color:var(--ink-3);margin-top:2px">สินค้าร้าน</div></div><div style="text-align:right"><div style="font-weight:800;color:var(--brand)">฿250</div></div></div>'+

function render(){

function next(){ if(step===STEPS.length-1){ step=0; } else { step++; } render(); }
function prev(){ if(step>0){ step--; render(); } }
document.getElementById('g-next').onclick=next;
