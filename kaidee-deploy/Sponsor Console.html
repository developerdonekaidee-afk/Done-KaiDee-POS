<!DOCTYPE html>
<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ศูนย์จัดการสปอนเซอร์ — KaiDee Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--brand:#0E9C88;--brand-ink:#0A6E60;--brand-soft:#E3F5F1;--brand-softer:#EFFAF7;--gold:#E8992F;--gold-soft:#FBF0DC;--purple:#7C5CE0;--purple-soft:#EEE9FB;--blue:#2F72E8;--blue-soft:#E6EEFB;--hair:#D8E0DD;--hair-2:#E9EEEC;--font:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#E7ECEA;color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}button{font-family:var(--font);cursor:pointer}
a{color:var(--brand-ink)}a:hover{color:var(--brand)}
.toolbar{position:sticky;top:0;z-index:30;background:#0E2A2A;color:#dbeee7;padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar .tt{font-weight:700;color:#fff;margin-right:auto;display:flex;align-items:center;gap:10px;font-size:15.5px}
.toolbar .tt .lg{width:28px;height:28px;background:#fff;border-radius:7px;padding:3px;object-fit:contain}
.toolbar .tt small{display:block;font-size:11px;font-weight:500;color:#8fc7bb}
.toolbar .lk{text-decoration:none}
.tbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#dbeee7;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.12)}
.demo{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#8fc7bb;font-weight:600}
.demo select{font-family:var(--font);border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#12403a;color:#fff;padding:6px 9px;font-size:12.5px;font-weight:600}
.wrap{max-width:1120px;margin:0 auto;padding:22px 22px 70px}
/* plan status */
.plan{border-radius:18px;padding:22px 24px;color:#fff;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(135deg,#16302B,#0E5C4A)}
.plan.none{background:linear-gradient(135deg,#3a3550,#5b4aa0)}
.plan .pl-i{width:56px;height:56px;border-radius:15px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}
.plan .pl-nm{font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
.plan .chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;background:rgba(255,255,255,.2)}
.plan .pl-s{font-size:13px;color:#c9 e8e0;margin-top:3px;opacity:.9}
.plan .pl-meta{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.7;opacity:.92}
.plan .pl-meta b{font-size:16px}
.plan .up{background:#fff;color:var(--brand-ink);border:none;border-radius:11px;padding:12px 20px;font-weight:700;font-size:13.5px;flex:0 0 auto}
.plan.none .up{color:var(--purple)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--hair-2);border-radius:14px;padding:15px 16px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.kpi .d{font-size:11.5px;color:var(--brand-ink);font-weight:600;margin-top:2px}
.kpi.lock{opacity:.55}
.kpi.lock .v{color:var(--ink-3)}
/* sections */
.sec-h{font-size:12.5px;font-weight:700;color:var(--brand-ink);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 3px;display:flex;align-items:center;gap:9px}
.sec-h .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;text-transform:none;letter-spacing:0}
.sec-sub{font-size:13px;color:var(--ink-3);margin-bottom:14px}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feat{background:#fff;border:1.5px solid var(--hair-2);border-radius:16px;padding:18px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.feat .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:11px}
.feat h3{font-size:15.5px;font-weight:700;margin-bottom:5px}
.feat p{font-size:12.5px;color:var(--ink-2);line-height:1.55;flex:1;margin-bottom:13px}
.feat .go{border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;width:100%;background:var(--brand);color:#fff}
.feat.locked{border-style:dashed;border-color:var(--hair)}
.feat.locked .ic,.feat.locked h3,.feat.locked p{opacity:.5}
.lockbar{border:none;border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;width:100%;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;gap:6px}
.lockbar:hover{filter:brightness(.97)}
.feat .req{position:absolute;top:13px;right:13px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--hair-2);color:var(--ink-3)}
.feat.on .req{background:var(--brand-soft);color:var(--brand-ink)}
/* addons owned */
.owned{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.ochip{background:#fff;border:1px solid var(--hair-2);border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.ochip .x{color:var(--brand)}
.foot{font-size:12px;color:var(--ink-3);margin-top:26px;line-height:1.7;text-align:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(12,28,25,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:24px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.modal h2{font-size:19px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:9px}
.modal .sub{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.modal label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:block;margin:12px 0 5px}
.modal input,.modal select,.modal textarea{width:100%;font-family:var(--font);font-size:13.5px;border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.modal textarea{resize:vertical;min-height:70px}
.mrow{display:flex;gap:10px}.mrow>*{flex:1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pl-item{display:flex;align-items:center;gap:10px;background:var(--brand-softer);border-radius:11px;padding:9px 12px;font-size:13px}
.pl-item .e{font-size:19px}.pl-item b{font-weight:700}.pl-item .pr{margin-left:auto;font-weight:700;color:var(--brand-ink)}
.pl-item .del{border:none;background:none;color:var(--ink-3);font-size:16px;cursor:pointer}
.tsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.tsel .t{border:1.5px solid var(--hair);border-radius:11px;padding:11px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;background:#fff}
.tsel .t.on{border-color:var(--brand);background:var(--brand-softer);color:var(--brand-ink)}
.upl{border:2px dashed var(--hair);border-radius:12px;padding:22px;text-align:center;color:var(--ink-3);font-size:13px;margin-top:6px}
.mbtns{display:flex;gap:10px;margin-top:20px}
.mbtns button{flex:1;border-radius:11px;padding:12px;font-size:14px;font-weight:700;border:none}
.mbtns .ok{background:var(--brand);color:#fff}.mbtns .cx{background:#EEF1F0;color:var(--ink-2)}
.note{background:var(--blue-soft);color:#1e4fa8;font-size:12px;border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.5}
@media(max-width:860px){.feats,.kpis{grid-template-columns:1fr 1fr}.plan .pl-meta{margin-left:0;text-align:left;width:100%}}
@media(max-width:560px){.feats,.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="platform-api.jsx?v=p2-20260730k"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const B=(n)=>'฿'+Number(n||0).toLocaleString('en-US');
const ENT_LS='kd_sponsor_entitlement_v1';
const SPON_BIZ=(new URLSearchParams(location.search)).get('biz')||'demo-sponsor';

// ── ทีเออร์ + ลำดับสิทธิ์ ──
const TIER_RANK={none:0,starter:1,growth:2,premium:3,enterprise:4};
const TIER_META={
  none:{nm:'ยังไม่มีแพ็ก',ic:'🔒'},
  starter:{nm:'Starter · เปิดร้าน',ic:'🛒'},
  growth:{nm:'Growth · โฆษณา',ic:'📣'},
  premium:{nm:'Premium · เด่นสุด',ic:'⭐'},
  enterprise:{nm:'Enterprise',ic:'🏢'},
};
const TIER_PRICE={starter:990,growth:2900,premium:5900};

// ── ฟีเจอร์แต่ละกลุ่ม + ทีเออร์ขั้นต่ำ ──
const GROUPS=[
  {key:'shop',h:'ร้านค้าออนไลน์',min:'starter',minLabel:'Starter+',sub:'หน้าร้านของคุณในแอป · คนทั้งระบบสั่งซื้อได้',
   feats:[
    {id:'storefront',ic:'🏪',bg:'brand',t:'หน้าร้านออนไลน์',d:'ตั้งชื่อร้าน โลโก้ ปกร้าน คำอธิบาย และป้าย “สปอนเซอร์”',min:'starter'},
    {id:'products',ic:'📦',bg:'brand',t:'สินค้า & สต๊อก',d:'ลงสินค้าไม่จำกัด ตั้งราคา รูป หมวด และจำนวนคงเหลือ',min:'starter'},
    {id:'orders',ic:'🧾',bg:'brand',t:'ออเดอร์ที่เข้ามา',d:'รับ–ยืนยันออเดอร์จากคนในระบบ ดูสถานะและยอดขาย',min:'starter'},
    {id:'delivery',ic:'🛵',bg:'brand',t:'ตั้งค่าจัดส่ง',d:'เลือกไรเดอร์เรา หรือ Lalamove · ตั้งค่าส่ง/ระยะทาง',min:'starter'},
  ]},
  {key:'ads',h:'โฆษณา & การเข้าถึง',min:'growth',minLabel:'Growth+',sub:'ดันร้านให้คนเห็นมากขึ้นทั่วทั้งแพลตฟอร์ม',
   feats:[
    {id:'banner',ic:'🖼️',bg:'blue',t:'แบนเนอร์โฆษณา',d:'แบนเนอร์หมุนเวียนในแอปตลาด อัปโหลดภาพและลิงก์ปลายทาง',min:'growth'},
    {id:'featured',ic:'🌟',bg:'gold',t:'หมวดร้านแนะนำ',d:'ปักร้านของคุณในหมวด “ร้านแนะนำ” ให้คนเจอง่าย',min:'growth'},
    {id:'target',ic:'🎯',bg:'purple',t:'เลือกกลุ่มเป้าหมาย',d:'เจาะตามตลาด/พื้นที่/ประเภทผู้ใช้ที่อยากให้เห็น',min:'growth'},
    {id:'report',ic:'📊',bg:'blue',t:'รายงานการเข้าถึง',d:'ยอดเห็น–คลิก–สั่งซื้อ ดูว่าโฆษณาคุ้มแค่ไหน',min:'growth'},
    {id:'promo1',ic:'📢',bg:'gold',t:'ยิงโปรหาคนในระบบ',d:'ประกาศ/คูปองถึงกลุ่มเป้าหมาย (Growth = 1 ครั้ง/เดือน)',min:'growth'},
    {id:'coupon',ic:'🎟️',bg:'brand',t:'สร้างคูปองส่วนลด',d:'สร้างคูปองร้านเอง (แบบ Shopee) → โชว์ในแอปลูกค้าให้กดเก็บใช้',min:'growth'},
  ]},
  {key:'pro',h:'โปรโมทขั้นสูง',min:'premium',minLabel:'Premium+',sub:'ตำแหน่งเด่นสุด + ยิงโปรไม่อั้น ทุก vertical',
   feats:[
    {id:'pin',ic:'📌',bg:'gold',t:'ปักหมุดหน้าแรก',d:'แบนเนอร์ตำแหน่งบนสุดของหน้าแรก เห็นก่อนใคร',min:'premium'},
    {id:'promoinf',ic:'🚀',bg:'purple',t:'ยิงโปรไม่จำกัด',d:'ยิงประกาศ/แคมเปญได้ไม่อั้น ทุกกลุ่มเป้าหมาย',min:'premium'},
    {id:'multi',ic:'🌐',bg:'blue',t:'ขึ้นหลายจุด',d:'แสดงพร้อมกันทั้ง ตลาด · POS · ฟิตเนส · วินแรงงาน',min:'premium'},
    {id:'deep',ic:'🔬',bg:'brand',t:'รายงานเชิงลึก + ทีมดูแล',d:'วิเคราะห์ลึก + ทีมช่วยตั้งแคมเปญให้',min:'premium'},
    {id:'festival',ic:'🎪',bg:'gold',t:'แคมเปญเทศกาลตลาด',d:'ร่วมแคมเปญเทศกาลที่แพลตฟอร์มจัด สิทธิ์เฉพาะ Premium',min:'premium'},
  ]},
];
const BG={brand:['var(--brand-soft)','var(--brand-ink)'],blue:['var(--blue-soft)','var(--blue)'],gold:['var(--gold-soft)','var(--gold)'],purple:['var(--purple-soft)','var(--purple)']};

function loadEnt(){ try{return JSON.parse(localStorage.getItem(ENT_LS))||null}catch(e){return null} }

function App(){
  const [ent,setEnt]=useState(loadEnt);
  const [modal,setModal]=useState(null);
  useEffect(()=>{ if(!window.PLAT_API) return;
    const s1=window.PLAT_API.attach({ biz:SPON_BIZ, type:'sponsor', key:'sponsor_entitlement',
      read:()=>loadEnt(), write:(b)=>{try{b?localStorage.setItem(ENT_LS,JSON.stringify(b)):localStorage.removeItem(ENT_LS)}catch(e){}}, onRemote:(b)=>setEnt(b), stamp:(b)=>(b&&b.updatedAt)||0 });
    const s2=window.PLAT_API.attach({ biz:SPON_BIZ, type:'sponsor', key:'sponsor_coupons',
      read:()=>{try{return JSON.parse(localStorage.getItem('kd_sponsor_coupons_v1'))||[]}catch(e){return []}}, write:(b)=>{try{localStorage.setItem('kd_sponsor_coupons_v1',JSON.stringify(b))}catch(e){}}, onRemote:()=>{} });
    window.__sponEntSync=s1; window.__sponCpSync=s2;
    return ()=>{ try{s1.stop();s2.stop();}catch(e){} window.__sponEntSync=null; window.__sponCpSync=null; };
  },[]);
  // เดโม: จำลองแพ็กโดยไม่ต้องซื้อ
  const tier=ent?ent.tier:'none';
  const rank=TIER_RANK[tier]||0;
  const has=(min)=>rank>=(TIER_RANK[min]||99);

  const setDemoTier=(t)=>{
    if(t==='none'){ localStorage.removeItem(ENT_LS); setEnt(null); return; }
    const e={tier:t,cycle:'mo',boughtAt:new Date().toISOString().slice(0,10),addons:(ent&&ent.addons)||[],demo:true,updatedAt:Date.now()};
    localStorage.setItem(ENT_LS,JSON.stringify(e)); setEnt(e); if(window.__sponEntSync)window.__sponEntSync.push();
  };

  const renew=ent?(()=>{const d=new Date(ent.boughtAt||Date.now());d.setDate(d.getDate()+(ent.cycle==='yr'?365:30));return d.toISOString().slice(0,10)})():null;
  const price=ent?(ent.cycle==='yr'?Math.round((TIER_PRICE[tier]||0)*10):(TIER_PRICE[tier]||0)):0;

  const open=(f)=>setModal(f);

  return (<>
    <div className="toolbar">
      <div className="tt"><img className="lg" src="assets/kaidee-logo.png" alt=""/><div>ศูนย์จัดการสปอนเซอร์<small>จัดการร้าน · โฆษณา · แคมเปญ ตามแพ็กของคุณ</small></div></div>
      <span className="demo">🎬 จำลองแพ็ก
        <select value={tier} onChange={e=>setDemoTier(e.target.value)}>
          <option value="none">ยังไม่ซื้อ</option>
          <option value="starter">Starter</option>
          <option value="growth">Growth</option>
          <option value="premium">Premium</option>
        </select>
      </span>
      <a className="lk" href="Sponsor Packages.html"><button className="tbtn">📦 แพ็ก & อัปเกรด</button></a>
      <a className="lk" href="Platform Wallet.html"><button className="tbtn">👛 กระเป๋าแพลตฟอร์ม</button></a>
    </div>
    <div className="wrap">

      {/* สถานะแพ็ก */}
      <div className={'plan'+(tier==='none'?' none':'')}>
        <div className="pl-i">{TIER_META[tier].ic}</div>
        <div>
          <div className="pl-nm">{TIER_META[tier].nm}{ent&&<span className="chip">{ent.cycle==='yr'?'รายปี':'รายเดือน'}{ent.demo?' · เดโม':''}</span>}</div>
          <div className="pl-s">{tier==='none'?'ซื้อแพ็กสปอนเซอร์เพื่อปลดล็อกหน้าจัดการ':'ปลดล็อกฟีเจอร์ตามแพ็กนี้ + ทุกแพ็กที่ต่ำกว่า'}</div>
        </div>
        {tier==='none'
          ? <a className="lk" href="Sponsor Packages.html" style={{marginLeft:'auto'}}><button className="up">เลือกแพ็ก →</button></a>
          : <>
              <div className="pl-meta">ต่ออายุ <b className="num">{B(price)}</b> {ent.cycle==='yr'?'/ปี':'/เดือน'}<br/><span style={{opacity:.8}}>ครบกำหนด {renew}</span></div>
              <a className="lk" href="Sponsor Packages.html"><button className="up">{tier==='premium'?'จัดการแพ็ก':'อัปเกรด ↑'}</button></a>
            </>}
      </div>

      {/* KPI (ปลดล็อกเมื่อ Growth+) */}
      <div className="kpis">
        {[['👀 ยอดเห็น','48,210','+12% สัปดาห์นี้','growth'],['👆 คลิก','3,842','CTR 8.0%','growth'],['🧾 ออเดอร์','617','จากโฆษณา','starter'],['💰 ยอดขาย',B(184300),'30 วันล่าสุด','starter']].map(([l,v,d,m],i)=>{
          const on=has(m);
          return <div className={'kpi'+(on?'':' lock')} key={i}><div className="l">{l}</div><div className="v num">{on?v:'—'}</div><div className="d">{on?d:'ต้องมีแพ็ก '+TIER_META[m].nm.split(' ')[0]}</div></div>;
        })}
      </div>

      {/* กลุ่มฟีเจอร์ */}
      {GROUPS.map(g=>{
        const gOn=has(g.min);
        return (<div key={g.key}>
          <div className="sec-h">{g.h}<span className="tag" style={{background:gOn?'var(--brand-soft)':'var(--hair-2)',color:gOn?'var(--brand-ink)':'var(--ink-3)'}}>{gOn?'ปลดล็อกแล้ว ✓':g.minLabel}</span></div>
          <div className="sec-sub">{g.sub}</div>
          <div className="feats">
            {g.feats.map(f=>{ const on=has(f.min); const c=BG[f.bg];
              return (<div className={'feat'+(on?' on':' locked')} key={f.id}>
                <span className="req">{on?'พร้อมใช้':TIER_META[f.min].nm.split(' ')[0]}</span>
                <div className="ic" style={{background:c[0],color:c[1]}}>{f.ic}</div>
                <h3>{f.t}</h3><p>{f.d}</p>
                {on
                  ? <button className="go" onClick={()=>open(f)}>จัดการ →</button>
                  : <button className="lockbar" onClick={()=>{location.href='Sponsor Packages.html'}}>🔒 อัปเกรดเป็น {TIER_META[f.min].nm.split(' ')[0]}</button>}
              </div>);
            })}
          </div>
        </div>);
      })}

      {/* แอดออนที่ซื้อไว้ */}
      {ent&&ent.addons&&ent.addons.length>0&&<>
        <div className="sec-h">แอดออนที่เปิดอยู่<span className="tag" style={{background:'var(--gold-soft)',color:'var(--gold)'}}>{ent.addons.length} รายการ</span></div>
        <div className="owned">{ent.addons.map((a,i)=><span className="ochip" key={i}><span className="x">✓</span>{a}</span>)}</div>
      </>}

      <p className="foot">💡 หน้านี้ปลดล็อกตาม <b>แพ็กที่ซื้อในหน้าแพ็กสปอนเซอร์</b> · ยอดค่าแพคเข้า <b>กระเป๋าแพลตฟอร์ม</b> · ฟีเจอร์ที่ยังล็อกกดเพื่ออัปเกรดได้ทันที · <a href="Sponsor Packages.html">ดูแพ็กทั้งหมด</a></p>
    </div>

    {modal&&<Manage feat={modal} onClose={()=>setModal(null)}/>}
  </>);
}

// ── modal จัดการแต่ละฟีเจอร์ (เดโมใช้งานได้จริงระดับหน้าจอ) ──
function Manage({feat,onClose}){
  const [products,setProducts]=useState([{e:'🥔',nm:'มันฝรั่งทอดถุงใหญ่',pr:59},{e:'🧂',nm:'ผงปรุงรสหมูสวรรค์',pr:35}]);
  const [np,setNp]=useState({nm:'',pr:''});
  const [target,setTarget]=useState(['ตลาดลาดสวาย']);
  const TG=['ตลาดลาดสวาย','ตลาดสี่มุมเมือง','สมาชิกฟิตเนส','ร้าน POS','วินแรงงาน','ทั้งระบบ'];
  const toggleTg=(t)=>setTarget(s=>s.includes(t)?s.filter(x=>x!==t):[...s,t]);
  const [cps,setCps]=useState(()=>{try{return JSON.parse(localStorage.getItem('kd_sponsor_coupons_v1'))||[]}catch(e){return []}});
  const [ncp,setNcp]=useState({shopId:'potato',title:'',kind:'baht',value:'',minSpend:'',cat:'snack',slots:[]});
  const CP_SHOPS=[['potato','Potato Corner'],['kruaploy','ครัวป้าพลอย'],['brew','Brew คาเฟ่'],['freshveg','สวนผักลุงมี'],['cpwholesale','CP ค้าส่ง'],['homemart','HomeMart']];
  const SHOP_CAT={potato:'snack',kruaploy:'food',brew:'cafe',freshveg:'fresh',cpwholesale:'wholesale',homemart:'home'};
  const CP_CATS=[['snack','ของกินเล่น'],['food','อาหารจานหลัก'],['cafe','เครื่องดื่ม/คาเฟ่'],['fresh','ของสด'],['wholesale','ค้าส่ง'],['home','ของใช้ในบ้าน'],['service','บริการ']];
  const CP_SLOTS=[['morning','เช้า'],['noon','กลางวัน'],['afternoon','บ่าย'],['evening','เย็น'],['night','กลางคืน']];
  const tgSlot=(s)=>setNcp(p=>({...p,slots:(p.slots||[]).includes(s)?p.slots.filter(x=>x!==s):[...(p.slots||[]),s]}));
  const saveCp=()=>{ if(!ncp.title.trim()||!ncp.value){alert('ใส่ชื่อคูปอง + มูลค่า');return;} const c={id:'cp'+Date.now(),shopId:ncp.shopId,title:ncp.title.trim(),kind:ncp.kind,value:+ncp.value||0,minSpend:+ncp.minSpend||0,cat:ncp.cat||SHOP_CAT[ncp.shopId]||'',slots:ncp.slots||[],quota:100,used:0}; const arr=[...cps,c]; setCps(arr); try{localStorage.setItem('kd_sponsor_coupons_v1',JSON.stringify(arr));}catch(e){} if(window.__sponCpSync)window.__sponCpSync.push(); setNcp({...ncp,title:'',value:'',minSpend:''}); };
  const delCp=(id)=>{ const arr=cps.filter(c=>c.id!==id); setCps(arr); try{localStorage.setItem('kd_sponsor_coupons_v1',JSON.stringify(arr));}catch(e){} if(window.__sponCpSync)window.__sponCpSync.push(); };
  const done=(msg)=>{alert('✅ '+(msg||'บันทึกแล้ว')+' (เดโม)');onClose();};

  let body=null;
  if(feat.id==='products'){
    body=<>
      <div className="plist">{products.map((p,i)=><div className="pl-item" key={i}><span className="e">{p.e}</span><b>{p.nm}</b><span className="pr num">{B(p.pr)}</span><button className="del" onClick={()=>setProducts(products.filter((_,j)=>j!==i))}>✕</button></div>)}</div>
      <label>เพิ่มสินค้าใหม่</label>
      <div className="mrow"><input placeholder="ชื่อสินค้า" value={np.nm} onChange={e=>setNp({...np,nm:e.target.value})}/><input placeholder="ราคา" type="number" value={np.pr} onChange={e=>setNp({...np,pr:e.target.value})}/></div>
      <button className="lockbar" style={{marginTop:10,background:'var(--brand-softer)',color:'var(--brand-ink)'}} onClick={()=>{if(np.nm){setProducts([...products,{e:'🛒',nm:np.nm,pr:+np.pr||0}]);setNp({nm:'',pr:''})}}}>+ เพิ่มลงร้าน</button>
    </>;
  } else if(feat.id==='coupon'){
    body=<>
      <div className="note">🎟️ สร้างคูปองแบบ Shopee — สปอนออกส่วนลดเอง (หักที่ราคาขายตรง ไม่ผ่านแพลตฟอร์ม) · คูปองโผล่ในแอปลูกค้าให้กดเก็บใช้ทันที</div>
      <label>คูปองที่มีอยู่</label>
      <div className="plist">{cps.length===0?<div style={{color:'var(--ink-3)',fontSize:13}}>ยังไม่มีคูปอง</div>:cps.map(c=><div className="pl-item" key={c.id}><span className="e">🎟️</span><b>{c.title}</b><span className="pr num">{c.kind==='pct'?c.value+'%':B(c.value)}</span><button className="del" onClick={()=>delCp(c.id)}>✕</button></div>)}</div>
      <label>สร้างคูปองใหม่ (เลือกร้าน)</label>
      <select value={ncp.shopId} onChange={e=>setNcp({...ncp,shopId:e.target.value,cat:SHOP_CAT[e.target.value]||ncp.cat})}>{CP_SHOPS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
      <label>ชื่อคูปอง</label><input placeholder="เช่น ลด ฿30 เมื่อครบ ฿300" value={ncp.title} onChange={e=>setNcp({...ncp,title:e.target.value})}/>
      <div className="mrow"><div><label>ชนิด</label><select value={ncp.kind} onChange={e=>setNcp({...ncp,kind:e.target.value})}><option value="baht">ลดเป็นบาท</option><option value="pct">ลดเป็น %</option></select></div><div><label>{ncp.kind==='pct'?'% ที่ลด':'บาทที่ลด'}</label><input type="number" value={ncp.value} onChange={e=>setNcp({...ncp,value:e.target.value})}/></div></div>
      <label>ยอดขั้นต่ำ (บาท)</label><input type="number" value={ncp.minSpend} onChange={e=>setNcp({...ncp,minSpend:e.target.value})}/>
      <label>หมวดสินค้า (ใช้จับคู่ลูกค้า · ร้านที่ขายหมวดเดียวกันจะไม่เห็นคูปองนี้)</label>
      <select value={ncp.cat} onChange={e=>setNcp({...ncp,cat:e.target.value})}>{CP_CATS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>
      <label>ช่วงเวลาที่อยากให้โชว์ (ไม่เลือก = ทุกช่วง)</label>
      <div className="tsel">{CP_SLOTS.map(([v,l])=><div key={v} className={'t'+((ncp.slots||[]).includes(v)?' on':'')} onClick={()=>tgSlot(v)}>{l}</div>)}</div>
      <div className="note">🎯 ระบบจับคู่ให้อัตโนมัติจากหมวดที่ลูกค้าสั่งบ่อย · ยอดบิลใกล้เคียงขั้นต่ำ · ช่วงเวลาที่ตั้งไว้ (ประมวลผลในเครื่องลูกค้า ไม่ส่งข้อมูลรายคนออก) — แพ็กที่สูงกว่าได้น้ำหนักมากกว่า แต่ไม่ใช่ตัวตัดสินเดียว</div>
      <button className="lockbar" style={{marginTop:12,background:'var(--brand-softer)',color:'var(--brand-ink)'}} onClick={saveCp}>+ สร้างคูปอง (โชว์ในแอปลูกค้า)</button>
    </>;
  } else if(feat.id==='storefront'){
    body=<><label>ชื่อร้าน</label><input defaultValue="Potato Corner Official"/><label>คำอธิบายร้าน</label><textarea defaultValue="ของกินเล่นเจ้าดัง ส่งตรงถึงทุกตลาดในเครือ"/><label>โลโก้ / ปกร้าน</label><div className="upl">📷 ลากรูปมาวาง หรือกดเพื่ออัปโหลด</div></>;
  } else if(feat.id==='orders'){
    body=<><div className="plist">{[['#1042','เจ๊แดง · 2 ชิ้น',118,'รอยืนยัน'],['#1041','ร้านป้านิด · 5 ชิ้น',295,'กำลังส่ง'],['#1039','ยิม Iron House · 1 ชิ้น',59,'สำเร็จ']].map((o,i)=><div className="pl-item" key={i}><b>{o[0]}</b><span style={{color:'var(--ink-3)',fontSize:12}}>{o[1]}</span><span className="pr num">{B(o[2])}</span><span style={{fontSize:11,fontWeight:700,color:'var(--brand-ink)'}}>{o[3]}</span></div>)}</div><div className="note">รับออเดอร์ → เลือกจัดส่ง → คนในระบบติดตามสถานะได้ในแอป</div></>;
  } else if(feat.id==='delivery'){
    body=<><label>ผู้ให้บริการจัดส่ง</label><div className="tsel"><div className="t on">🛵 ไรเดอร์เรา</div><div className="t">📦 Lalamove</div></div><label>ค่าส่งเริ่มต้น (บาท)</label><input type="number" defaultValue="30"/><label>ระยะฟรีค่าส่ง (กม.)</label><input type="number" defaultValue="3"/></>;
  } else if(feat.id==='banner'||feat.id==='pin'){
    body=<><label>ภาพแบนเนอร์ (1200×400)</label><div className="upl">🖼️ อัปโหลดภาพแบนเนอร์</div><label>ลิงก์ปลายทาง</label><input defaultValue="เปิดหน้าร้านของฉัน"/>{feat.id==='pin'&&<div className="note">📌 Premium: ปักตำแหน่งบนสุดหน้าแรก เห็นก่อนแบนเนอร์อื่น</div>}</>;
  } else if(feat.id==='target'||feat.id==='multi'){
    body=<><label>เลือกกลุ่มเป้าหมาย / จุดแสดง</label><div className="tsel">{TG.map(t=><div key={t} className={'t'+(target.includes(t)?' on':'')} onClick={()=>toggleTg(t)}>{t}</div>)}</div><div className="note">เลือกแล้ว {target.length} จุด · โฆษณาจะแสดงเฉพาะกลุ่มที่เลือก</div></>;
  } else if(feat.id==='featured'){
    body=<><label>หมวดที่อยากแนะนำ</label><select defaultValue="อาหาร & เครื่องดื่ม"><option>อาหาร & เครื่องดื่ม</option><option>ของใช้ในบ้าน</option><option>วัตถุดิบค้าส่ง</option></select><div className="note">🌟 ร้านของคุณจะขึ้นในแถบ “ร้านแนะนำ” ของหมวดที่เลือก</div></>;
  } else if(feat.id==='promo1'||feat.id==='promoinf'){
    body=<><label>หัวข้อโปรโมชัน</label><input defaultValue="ลด 20% เฉพาะสัปดาห์นี้"/><label>ข้อความ</label><textarea defaultValue="สั่งครบ ฿100 รับส่วนลดทันที ส่งฟรีในตลาด!"/><label>ยิงถึงกลุ่ม</label><div className="tsel">{TG.slice(0,4).map(t=><div key={t} className={'t'+(target.includes(t)?' on':'')} onClick={()=>toggleTg(t)}>{t}</div>)}</div>{feat.id==='promo1'&&<div className="note">Growth: ยิงได้ 1 ครั้ง/เดือน · อยากยิงเพิ่มซื้อแอดออน หรืออัปเป็น Premium</div>}</>;
  } else if(feat.id==='report'||feat.id==='deep'){
    body=<><div className="plist">{[['ยอดเห็น (Impressions)','48,210'],['คลิก','3,842'],['อัตราคลิก (CTR)','8.0%'],['สั่งซื้อจากโฆษณา','617'],['ยอดขายจากโฆษณา',B(184300)]].map((r,i)=><div className="pl-item" key={i}><b>{r[0]}</b><span className="pr num">{r[1]}</span></div>)}</div>{feat.id==='deep'&&<div className="note">🔬 Premium: ทีมดูแลจะช่วยอ่านรายงานและปรับแคมเปญให้ทุกเดือน</div>}</>;
  } else if(feat.id==='festival'){
    body=<><label>แคมเปญเทศกาลที่เปิดรับ</label><div className="tsel"><div className="t on">🎪 ตลาดนัดปีใหม่</div><div className="t">🧧 ตรุษจีน</div><div className="t">💦 สงกรานต์</div><div className="t">🎃 ปลายปี</div></div><div className="note">สิทธิ์ร่วมแคมเปญที่แพลตฟอร์มจัด เฉพาะสปอนเซอร์ Premium</div></>;
  } else { body=<div className="note">หน้าจัดการ (เดโม)</div>; }

  return (<div className="ov" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <h2>{feat.ic} {feat.t}</h2><div className="sub">{feat.d}</div>
      {body}
      <div className="mbtns"><button className="cx" onClick={onClose}>ปิด</button><button className="ok" onClick={()=>done()}>บันทึก</button></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</template>
</body>
