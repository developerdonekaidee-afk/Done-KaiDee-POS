<script type="text/babel">
const { useState } = React;

// ผู้ซื้อ = ร้านที่ใช้ POS ของเรา อยู่ในตลาด
const ME={market:'ตลาดธนบุรี',zone:'C',stall:'A-12'};

const MODEDEF={
  inmarket:{e:'🛵',t:'ส่งถึงแผงในตลาด',s:'ไรเดอร์วินในตลาดรับของข้ามโซนมาส่งที่แผงคุณ',rec:true},

const SPONSORS=[

  {id:'cpwholesale',name:'CP ค้าส่ง',emoji:'📦',type:'wholesale',city:'กรุงเทพฯ',zone:'E',walk:12,rating:4.9,disc:15,

  {id:'homemart',name:'HomeMart ของใช้',emoji:'🧺',type:'home',city:'นนทบุรี',rating:4.7,disc:20,
    products:[{e:'🧴',nm:'น้ำยาซักผ้า 3.5kg',pr:310},{e:'🧽',nm:'ฟองน้ำล้างจาน',pr:75},{e:'🧹',nm:'ไม้กวาดพื้น',pr:129},{e:'💡',nm:'หลอด LED แพ็ก 4',pr:199}]},

const CP_LS='kd_sponsor_coupons_v1';
function seedCoupons(){ return [
  {id:'c1',shopId:'cpwholesale',title:'ลด ฿30 เมื่อครบ ฿300',kind:'baht',value:30,minSpend:300,quota:100,used:12},
  {id:'c2',shopId:'homemart',title:'ลด 15% ครบ ฿200',kind:'pct',value:15,minSpend:200,quota:50,used:8},
  {id:'c3',shopId:'potato',title:'ลด ฿10 ครบ ฿100',kind:'baht',value:10,minSpend:100,quota:200,used:33},
]; }
function loadCoupons(){ try{ const a=JSON.parse(localStorage.getItem(CP_LS)); if(Array.isArray(a)) return a; }catch(e){} const s=seedCoupons(); try{ localStorage.setItem(CP_LS,JSON.stringify(s)); }catch(e){} return s; }

function Root(){
  const [screen,setScreen]=useState('browse'); // browse | shop | cart | checkout | done
  const [bmode,setBmode]=useState('near');     // near (ใกล้ฉัน/ส่งเร็ว) | ship (ช้อปทั่วไทย)
  const [filter,setFilter]=useState('all');

  React.useEffect(()=>{ if(!window.PLAT_API) return;
    const biz=(new URLSearchParams(location.search)).get('biz')||'demo-sponsor';
    const sync=window.PLAT_API.attach({ biz, type:'sponsor', key:'sponsor_coupons',
      read:()=>loadCoupons(), write:(b)=>{try{localStorage.setItem(CP_LS,JSON.stringify(b||[]))}catch(e){}}, onRemote:(b)=>setCoupons(b||[]) });
    return ()=>{ try{sync.stop();}catch(e){} };
  },[]);
  const [claimed,setClaimed]=useState(null);   // id คูปองที่กดใช้
  const [shopId,setShopId]=useState(null);
  const [cart,setCart]=useState({});
  const [mode,setMode]=useState('inmarket');
  const [rider,setRider]=useState('win'); // win | lalamove (นอกตลาด)
  const [toast,setToast]=useState('');
  const flash=(m)=>{setToast(m);setTimeout(()=>setToast(''),1400);};
  const shop=SPONSORS.find(s=>s.id===shopId);
  const openShop=(id)=>{ setShopId(id); setCart({}); setClaimed(null); const s=SPONSORS.find(x=>x.id===id); setMode(TYPES[s.type].modes[0]); setScreen('shop'); };

  const add=(k)=>{ setCart(c=>({...c,[k]:(c[k]||0)+1})); flash('เพิ่มลงตะกร้า'); };

  const items=shop?shop.products.map((p,i)=>({...p,k:String(i),q:cart[String(i)]||0})).filter(p=>p.q>0):[];
  const count=items.reduce((s,i)=>s+i.q,0);
  const sub=items.reduce((s,i)=>s+i.pr*i.q,0);
  const fee=mode==='inmarket'?(rider==='lalamove'?45:20):mode==='transport'?80:mode==='ship'?40:0;

  const appliedCp=shopCoupons.find(c=>c.id===claimed);
  const cpOk=appliedCp&&sub>=appliedCp.minSpend;
  const cpDisc=cpOk?(appliedCp.kind==='pct'?Math.round(sub*appliedCp.value/100):appliedCp.value):0;

  );
  const LocBar=()=><div className="loc">📍 คุณอยู่ <b>{ME.market}</b> · โซน <b>{ME.zone}</b> · แผง <b>{ME.stall}</b></div>;

  /* ── ค้นร้าน: 2 โหมด ใกล้ฉัน / ช้อปทั่วไทย + ปักหน้าแรกตามทีเออร์ ── */
  if(screen==='browse'){
    const near=bmode==='near';
    const FEAT={potato:2,brew:1,homemart:2,cpwholesale:1};   // 2=ปักหน้าแรก(Premium) 1=แนะนำ(Growth) 0=ปกติ
    const cats=near?[['all','ทั้งหมด'],['food','🍜 ร้านอาหาร'],['cafe','☕ คาเฟ่'],['fresh','🥬 ตลาดสด']]:[['all','ทั้งหมด'],['wholesale','📦 ค้าส่ง'],['home','🧺 ของใช้']];
    const list=SPONSORS.filter(s=>TYPES[s.type].scope===bmode).filter(s=>filter==='all'||s.type===filter)
      .map(s=>({...s,feat:FEAT[s.id]||0}))
      .sort((a,b)=> (b.feat-a.feat) || (near?((a.km||9)-(b.km||9)):(coupons.filter(c=>c.shopId===b.id).length-coupons.filter(c=>c.shopId===a.id).length)));
    return <div className="screen">
      <Header title="ร้านสปอนเซอร์" badge={near?<><span className="badge">ใกล้ฉัน</span> ส่งเร็วในพื้นที่</>:<><span className="badge">ทั่วไทย</span> ราคา+ส่วนลด</>}/>
      {near&&<LocBar/>}
      <div className="body">
        <div className="seg2">
          <div className={'s'+(near?' on':'')} onClick={()=>{setBmode('near');setFilter('all');}}>🛵 ใกล้ฉัน · ส่งเร็ว</div>
          <div className={'s'+(!near?' on':'')} onClick={()=>{setBmode('ship');setFilter('all');}}>🛍️ ช้อปทั่วไทย</div>
        </div>
        <div className="chips">{cats.map(([k,l])=><button key={k} className={'chip'+(filter===k?' on':'')} onClick={()=>setFilter(k)}>{l}</button>)}</div>
        {near
          ? <div className="spon">📍 <b>จับพื้นที่แบบไลน์แมน</b> — เรียงร้านใกล้คุณก่อน · ร้าน <b>⭐ แนะนำ</b> = สปอนซื้อแพ็กปักหน้าแรก (เห็นก่อน = ขายได้มากกว่า แบบ Grab)</div>
          : <div className="spon" style={{borderColor:'var(--brand)',background:'var(--brand-soft)',color:'var(--brand-ink)'}}>🎟️ <b>ช้อปทั่วไทยแบบ Shopee</b> — เน้นราคา+<b>คูปองที่ร้านสปอนสร้างเอง</b> กดเก็บใช้ได้เลย · ร้าน ⭐ แนะนำ = ซื้อสิทธิ์ปักหน้าแรก</div>}
        {list.map(s=>{const ty=TYPES[s.type];const far=near&&s.zone!==ME.zone;const nc=coupons.filter(c=>c.shopId===s.id).length;return(
          <div className="sc" key={s.id} onClick={()=>openShop(s.id)}>
            <div className="ic" style={{background:ty.bg}}>{s.emoji}</div>
            <div style={{flex:1,minWidth:0}}>
              <div className="nm">{s.name}<span className="tb" style={{background:ty.bg,color:ty.c}}>{ty.th}</span>{s.feat>0&&<span className="tb" style={{background:'var(--gold-soft)',color:'var(--gold)'}}>{s.feat===2?'⭐ ปักหน้าแรก':'⭐ แนะนำ'}</span>}</div>
              {near
                ? <div className="meta">⭐ {s.rating} · โซน {s.zone} · เดิน ~{s.walk} น. · {s.km} กม.</div>
                : <div className="meta">⭐ {s.rating} · {s.city} · ส่งทั่วไทย</div>}
              {near&&far&&<div className="far">🛵 คนละโซน — กดสั่งส่งถึงแผงได้</div>}
              {nc>0&&<div className="far" style={{color:'var(--brand)'}}>🎟️ มีคูปองส่วนลด {nc} ใบ — กดเก็บใช้</div>}
            </div>
            <span className="go">›</span>
          </div>);})}
      </div>
    </div>;
  }

  const ty=shop?TYPES[shop.type]:null;

  /* ── หน้าร้าน ── */
  if(screen==='shop') return <div className="screen">
    <Header color={ty.c} onBack={()=>setScreen('browse')} title={shop.name} badge={isShip?<><span className="badge">{ty.th}</span> {shop.city} · ส่งทั่วไทย</>:<><span className="badge">{ty.th}</span> โซน {shop.zone} · เดิน ~{shop.walk} น.</>}/>
    {!isShip&&<LocBar/>}
    <div className="body">
      {!isShip&&shop.zone!==ME.zone&&<div className="spon">🛵 ร้านนี้อยู่ <b>โซน {shop.zone}</b> คุณอยู่ <b>โซน {ME.zone}</b> — สั่งแล้วเลือก “ส่งถึงแผงในตลาด” ไรเดอร์วินยกมาให้ ไม่ต้องปิดร้านเดินไปเอง</div>}
      {shopCoupons.length>0&&<><div className="lbl">🎟️ คูปองร้านนี้ (สปอนสร้างเอง · กดเก็บใช้)</div>
        <div className="chips">{shopCoupons.map(c=><button key={c.id} className={'chip'+(claimed===c.id?' on':'')} onClick={()=>{setClaimed(claimed===c.id?null:c.id);flash(claimed===c.id?'เอาคูปองออก':'เก็บคูปองแล้ว');}}>{claimed===c.id?'✓ ':'🎟️ '}{c.title}</button>)}</div></>}
      <div className="lbl">{isShip?'สินค้า':'เมนู'}</div>
      <div className="grid">{shop.products.map((p,i)=>{const k=String(i);const q=cart[k]||0;return(
        <div className="pd" key={k}><div className="im" style={{background:ty.bg}}>{p.e}</div>
          <div className="tx"><div className="nm">{p.nm}</div><div className="pr" style={{color:ty.c}}>{B(p.pr)}</div></div>
          {q===0?<button className="add" style={{background:ty.bg,color:ty.c}} onClick={()=>add(k)}>+ เพิ่ม</button>
            :<div className="qbtns"><button style={{background:ty.bg,color:ty.c}} onClick={()=>dec(k)}>−</button><b>{q}</b><button style={{background:ty.bg,color:ty.c}} onClick={()=>add(k)}>+</button></div>}
        </div>);})}</div>
    </div>
    {count>0&&<div className="foot"><button className="btn" style={{background:ty.c}} onClick={()=>setScreen('cart')}><span className="c">{count}</span> ดูตะกร้า · {B(sub)}</button></div>}
    {toast&&<div className="toast">{toast}</div>}
  </div>;

  if(screen==='cart') return <div className="screen">
    <Header color={ty.c} title="ตะกร้าสินค้า" badge={count+' รายการ · '+shop.name} onBack={()=>setScreen('shop')}/>
    <div className="body">
      {items.length===0?<div className="empty">ตะกร้าว่าง</div>:<>
      <div className="card">{items.map(i=><div className="ci" key={i.k}><span className="e">{i.e}</span><div><div className="nm">{i.nm}</div><div className="u">{B(i.pr)} × {i.q}</div></div><span className="pr" style={{color:ty.c}}>{B(i.pr*i.q)}</span><button className="rm" onClick={()=>setCart(c=>{const n={...c};delete n[i.k];return n;})}>✕</button></div>)}</div>
      <div className="card"><div className="sum tot"><span>รวมค่าสินค้า</span><span>{B(sub)}</span></div></div></>}
    </div>
    {items.length>0&&<div className="foot"><button className="btn" style={{background:ty.c}} onClick={()=>setScreen('checkout')}>เลือกวิธีรับของ →</button></div>}
  </div>;

  if(screen==='checkout') return <div className="screen">
    <Header color={ty.c} title="วิธีรับของ & จ่ายเงิน" onBack={()=>setScreen('cart')}/>
    <div className="body">
      <div className="lbl">โหมดรับของ <span style={{fontWeight:500,color:'var(--ink-3)'}}>· ตามประเภทร้าน ({ty.th})</span></div>
      <div className="modes">{ty.modes.map(mk=>{const m=MODEDEF[mk];return <div key={mk} className={'mode'+(mode===mk?' on':'')} onClick={()=>setMode(mk)}><span className="me">{m.e}</span><div style={{flex:1}}><div className="mt">{m.t}{m.rec&&<span className="rec">แนะนำ</span>}</div><div className="ms">{m.s}</div></div><span className="r"></span></div>;})}</div>

      {mode==='inmarket'&&<div className="card" style={{display:'flex',flexDirection:'column',gap:11}}>
        <div className="field"><label>ส่งถึง (แผงของคุณ)</label><input defaultValue={ME.market+' · โซน '+ME.zone+' · แผง '+ME.stall}/></div>
        <div className="field"><label>ไรเดอร์</label><div className="seg2"><div className={'s'+(rider==='win'?' on':'')} onClick={()=>setRider('win')}>🛵 วินในตลาด · {B(20)}</div><div className={'s'+(rider==='lalamove'?' on':'')} onClick={()=>setRider('lalamove')}>📦 Lalamove · {B(45)}</div></div></div>
        <div className="split">🛵 ส่งข้ามโซน {shop.zone}→{ME.zone} ในตลาดเดียวกัน · ไรเดอร์วินยกมาถึงแผง ไม่ต้องปิดร้าน</div>
      </div>}
      {mode==='pickup'&&<div className="card"><div className="split">🏃 ไปรับเองที่ร้าน {shop.name} (โซน {shop.zone} · เดิน ~{shop.walk} นาที) — ไม่มีค่าส่ง</div></div>}
      {mode==='preorder'&&<div className="card" style={{display:'flex',flexDirection:'column',gap:11}}>
        <div className="field"><label>วันที่รับ</label><input type="date"/></div>
        <div className="field"><label>ช่วงเวลา</label><select defaultValue="เช้า 07:00–10:00"><option>เช้า 07:00–10:00</option><option>สาย 10:00–13:00</option><option>บ่าย 14:00–17:00</option></select></div>
        <div className="split">📦 จองล่วงหน้า เหมาะกับของสด/ของเยอะ — ร้านเตรียมไว้ตามเวลาที่นัด</div>
      </div>}
      {mode==='transport'&&<div className="card" style={{display:'flex',flexDirection:'column',gap:11}}>
        <div className="field"><label>บริษัทขนส่ง</label><select defaultValue="รถกระบะรับจ้างในตลาด"><option>รถกระบะรับจ้างในตลาด</option><option>Kerry / เคอรี่</option><option>Flash Express</option></select></div>
        <div className="field"><label>วันที่ให้ไปรับที่ร้าน</label><input type="date"/></div>
        <div className="split">🚚 ของชิ้นใหญ่/ยกลัง · ค่าขนส่งประเมิน {B(80)} (เก็บปลายทางได้)</div>
      </div>}
      {mode==='ship'&&<div className="card" style={{display:'flex',flexDirection:'column',gap:11}}>
        <div className="field"><label>ที่อยู่จัดส่ง</label><input defaultValue="123/45 ถ.สุขุมวิท แขวง... เขต... กทม. 10xxx"/></div>
        <div className="field"><label>ขนส่ง</label><select defaultValue="Flash Express"><option>Flash Express</option><option>Kerry / เคอรี่</option><option>J&amp;T Express</option><option>ไปรษณีย์ไทย</option></select></div>
        <div className="split">📮 ส่งทั่วไทยแบบ Shopee · สปอนเซอร์แพ็ก+ส่งเอง เงินค่าสินค้าวิ่งตรงหาสปอน</div>
      </div>}

      {shopCoupons.length>0&&<><div className="lbl">🎟️ คูปองส่วนลด (สปอนสร้างเอง)</div>
      <div className="card" style={{display:'flex',flexDirection:'column',gap:8}}>
        {shopCoupons.map(c=>{const ok=sub>=c.minSpend;const on=claimed===c.id;return(
          <div key={c.id} onClick={()=>ok&&setClaimed(on?null:c.id)} style={{display:'flex',alignItems:'center',gap:10,border:on?'2px solid var(--brand)':'1.5px solid var(--line)',borderRadius:11,padding:'10px 12px',opacity:ok?1:.5,cursor:ok?'pointer':'default'}}>
            <span style={{fontSize:18}}>🎟️</span><div style={{flex:1}}><b style={{fontSize:13}}>{c.title}</b><div style={{fontSize:11,color:'var(--ink-3)'}}>{ok?'ใช้ได้':'ซื้อครบ '+B(c.minSpend)+' ก่อน'}</div></div>
            <span style={{fontSize:12,fontWeight:700,color:on?'var(--brand)':'var(--ink-3)'}}>{on?'✓ ใช้อยู่':'กดใช้'}</span></div>);})}
        <div className="split">คูปองนี้ <b>สปอนเซอร์ออกเอง</b> — หักที่ราคาขายของสปอนตรง ไม่ผ่านแพลตฟอร์ม (แพลตฟอร์มเก็บแค่ค่าแพค)</div>
      </div></>}

      <div className="lbl">สรุปยอด</div>
      <div className="card">
        <div className="sum"><span className="g">ค่าสินค้า</span><span>{B(sub)}</span></div>
        {cpDisc>0&&<div className="sum"><span className="g">🎟️ {appliedCp.title}</span><span style={{color:'var(--brand)'}}>−{B(cpDisc)}</span></div>}
        {fee>0&&<div className="sum"><span className="g">{mode==='inmarket'?('ค่าส่ง ('+(rider==='lalamove'?'Lalamove':'วินในตลาด')+')'):mode==='ship'?'ค่าจัดส่ง (ขนส่ง)':'ค่าขนส่ง (ประเมิน)'}</span><span>{B(fee)}</span></div>}
        {fee===0&&<div className="sum"><span className="g">ค่าส่ง</span><span>ฟรี</span></div>}
        <div className="sum tot"><span>รวมจ่าย</span><span>{B(total)}</span></div>
      </div>
      <div className="split">💸 <b>แยกเงินอัตโนมัติ:</b> ค่าสินค้า (หลังหักส่วนลด) → ร้าน {shop.name} ตรง{fee>0&&mode==='inmarket'?(' · ค่าส่ง '+B(fee)+' → ไรเดอร์วินตรง'):''} — ไม่ผ่านกระเป๋ากลาง (กันเกณฑ์ e-money ธปท.)</div>
    </div>
    <div className="foot"><button className="btn" style={{background:ty.c}} onClick={()=>setScreen('done')}>ยืนยันสั่งซื้อ · จ่าย {B(total)}</button></div>
  </div>;

  // done
  const m=MODEDEF[mode];
  const steps=mode==='inmarket'?[['ร้านรับออเดอร์',1],['ร้านแพ็กของ',1],['ไรเดอร์วินรับของ โซน '+shop.zone,0],['ยกข้ามมาโซน '+ME.zone,0],['ถึงแผง '+ME.stall,0]]
    :mode==='pickup'?[['ร้านรับออเดอร์',1],['ร้านเตรียมของ',1],['พร้อมให้รับ',0],['ไปรับที่ร้าน',0]]
    :mode==='preorder'?[['รับออเดอร์',1],['ยืนยันวันนัด',1],['ร้านเตรียมของ',0],['รับ/ส่งตามนัด',0]]
    :mode==='ship'?[['สปอนเซอร์รับออเดอร์',1],['แพ็กสินค้า',1],['ส่งเข้าขนส่ง',0],['กำลังจัดส่ง',0],['ถึงบ้านคุณ',0]]
    :[['รับออเดอร์',1],['ร้านแพ็กของ',1],['นัดขนส่ง',0],['ขนส่งไปรับที่ร้าน',0],['ส่งปลายทาง',0]];
  return <div className="screen">
    <Header color={ty.c} title="สั่งซื้อสำเร็จ"/>
    <div className="body"><div className="status">
      <div className="big">✅</div>
      <div className="t">สั่งซื้อสำเร็จ!</div>
      <div className="s">จ่าย {B(total)} · {m.e} {m.t}<br/>{shop.name} → {mode==='inmarket'?('แผง '+ME.stall+' โซน '+ME.zone):'ตามที่เลือก'}<br/>เลขออเดอร์ #SP{Math.floor(1000+Math.random()*9000)}</div>
      <div className="track">{steps.map((s,i)=><div key={i} className={'tk'+(s[1]?'':' off')}><div className="dot" style={s[1]?{background:ty.c}:null}>{s[1]?'✓':i+1}</div><div><div className="tt">{s[0]}</div></div></div>)}</div>
    </div></div>
    <div className="foot"><button className="btn" style={{background:ty.c}} onClick={()=>{setCart({});setScreen('browse');}}>↩ กลับไปดูร้านอื่น</button></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('mount')).render(<div className="phone"><Root/></div>);
</script>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0E7C4E"/><text x="50" y="46" font-size="30" text-anchor="middle">🛒</text><text x="50" y="74" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#fff">Shop</text></svg>
</template>
</body>
</html>
