<!DOCTYPE html>
<html lang="th">
<head>
<script src="gate.js?v=p2-20260730k"></script>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730k">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตลาดของฉัน — Market OS (มือถือ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0E9C88;--brand-ink:#0A6E60;--brand-soft:#E3F5F1;--brand-softer:#EFFAF7;
    --hero:linear-gradient(152deg,#14A886 0%,#1E73B0 100%);
    --gold:#E8992F;--gold-soft:#FDF0E2;--green:#1E9E6A;--green-soft:#E4F5EC;
    --yellow:#C88A12;--yellow-soft:#FCF3DE;--red:#D8452F;--red-soft:#FBEAE6;--blue-ink:#155a8c;
    --ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--bg:#F4F7F6;--card:#fff;
    --hair:#E9EEEC;--hair-2:#DCE4E1;
    --font:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:#dfe6e3;display:flex;justify-content:center;}
  .num{font-variant-numeric:tabular-nums;}.mono{font-family:var(--mono);}
  a{color:var(--brand-ink);text-decoration:none;}a:hover{color:var(--brand);}
  /* phone frame on desktop */
  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 0 1px rgba(20,40,30,.06),0 30px 80px rgba(20,40,30,.18);}
  @media(min-width:460px){.phone{margin:24px 0;min-height:calc(100vh - 48px);border-radius:34px;overflow:hidden;}}
  .hd{background:var(--hero);color:#fff;padding:26px 20px 22px;}
  .hd .greet{font-size:13px;color:#d6f3ec;font-weight:500;}
  .hd h1{font-size:22px;font-weight:700;margin:2px 0 0;}
  .hd .per{font-size:12.5px;color:#c7eee3;margin-top:4px;}
  .mkchips{display:flex;gap:7px;overflow-x:auto;padding:14px 20px 2px;}
  .mkchips::-webkit-scrollbar{display:none;}
  .mkchip{flex:0 0 auto;border:1px solid var(--hair-2);background:#fff;color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;font-family:var(--font);}
  .mkchip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .wrap{padding:16px 16px 40px;}
  .hero-k{background:#fff;border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(20,40,30,.05),0 6px 20px rgba(20,40,30,.06);margin-bottom:14px;}
  .hero-k .row{display:flex;justify-content:space-between;align-items:flex-end;}
  .hero-k .big{font-size:38px;font-weight:700;line-height:1;}
  .hero-k .lbl{font-size:12.5px;color:var(--ink-3);font-weight:600;}
  .hero-k .occbadge{font-size:12.5px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);padding:4px 10px;border-radius:999px;}
  .bar{height:9px;border-radius:6px;background:var(--hair);overflow:hidden;margin-top:14px;display:flex;}
  .bar i{display:block;height:100%;}
  .barlg{display:flex;gap:14px;margin-top:9px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;}
  .barlg b{color:var(--ink);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;}
  .kp2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .kp{background:#fff;border-radius:15px;padding:13px 14px;box-shadow:0 1px 2px rgba(20,40,30,.05);}
  .kp .v{font-size:20px;font-weight:700;line-height:1.1;}
  .kp .l{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-weight:600;}
  .kp .f{font-size:11px;color:var(--ink-3);margin-top:2px;}
  .sect{font-size:13px;font-weight:700;color:var(--ink);margin:4px 2px 9px;display:flex;align-items:center;gap:7px;}
  .sect .cnt{font-size:11.5px;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:1px 7px;min-width:19px;text-align:center;}
  .sect .cnt.b{background:var(--gold);}.sect .cnt.n{background:var(--brand);}
  .list{background:#fff;border-radius:15px;box-shadow:0 1px 2px rgba(20,40,30,.05);overflow:hidden;margin-bottom:16px;}
  .li{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--hair);}
  .li:last-child{border-bottom:none;}
  .li .ic{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .li .b{flex:1;min-width:0;}
  .li .t{font-size:13.5px;font-weight:600;line-height:1.25;}
  .li .s{font-size:11.5px;color:var(--ink-3);margin-top:1px;}
  .li .amt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;}
  .li .amt.r{color:var(--red);}.li .amt.g{color:var(--green);}
  .empty{padding:16px 14px;font-size:12.5px;color:var(--ink-3);text-align:center;}
  .cta{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;border:none;border-radius:13px;padding:14px;font-size:14px;font-weight:700;font-family:var(--font);margin-top:4px;}
  .cta.gh{background:#fff;color:var(--brand-ink);border:1px solid var(--hair-2);margin-top:9px;}
  .foot{font-size:11px;color:var(--ink-3);text-align:center;margin-top:16px;line-height:1.6;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="market-data.jsx?v=p2-20260730k"></script>
<script type="text/babel" src="kd-wallet.jsx?v=p2-20260730k"></script>
<script type="text/babel" src="kd-sponsor-feed.jsx?v=p2-20260730k"></script>
<script type="text/babel" src="platform-api.jsx?v=p2-20260730k"></script>
<script type="text/babel">
const {useState}=React;
const {B,monthTH,thDate,thDateTime,calcRent,billCfg,daysTo,periodKey,MARKET_TYPES}=MK;
const P0=periodKey(0);

function catIc(cat){ const g=MK.catGroup(cat); return g?g.icon:'🏪'; }

function Dash(){
  const [,bump]=useState(0);
  React.useEffect(()=>{ if(!window.PLAT_API) return;
    const p=new URLSearchParams(location.search);
    const biz=p.get('market')||(MK.load().markets[0]||{}).id||'demo-market';
    const sync=window.PLAT_API.attach({ biz, type:'market', key:'market',
      read:()=>MK.load(), write:(b)=>MK.save(b), onRemote:()=>bump(x=>x+1), stamp:(b)=>(b&&b.updatedAt)||0 });
    return ()=>{ try{sync.stop();}catch(e){} };
  },[]);
  const data=MK.load();
  const markets=data.markets||[];
  const [mid,setMid]=useState(markets[0]&&markets[0].id);
  const market=markets.find(m=>m.id===mid)||markets[0];
  if(!market) return <div className="wrap"><div className="empty">ยังไม่มีข้อมูลตลาด</div></div>;
  const stalls=(data.stalls||[]).filter(s=>s.marketId===market.id);
  const bills=(data.bills||[]).filter(b=>b.marketId===market.id&&b.period===P0);
  const apps=(data.applications||[]).filter(a=>a.marketId===market.id);
  const bc=billCfg(market);

  const occ=stalls.filter(s=>s.status==='occupied').length, total=stalls.length, vac=total-occ;
  const billed=bills.reduce((a,b)=>a+b.total,0);
  const paid=bills.filter(b=>b.status==='paid');
  const collected=paid.reduce((a,b)=>a+b.total,0);
  const overdueB=bills.filter(b=>b.status==='overdue');
  const pendingB=bills.filter(b=>b.status==='pending');
  const outstanding=billed-collected;
  const pct=billed?Math.round(collected/billed*100):0;
  const pendApps=apps.filter(a=>a.status==='pending');
  const bookApps=apps.filter(a=>a.status==='booked');
  const leadApps=apps.filter(a=>a.status==='lead');
  const feed=[...paid].sort((a,b)=>b.paidAt-a.paidAt).slice(0,6);
  const overStalls=overdueB.map(b=>({b,s:stalls.find(x=>x.id===b.stallId)})).filter(x=>x.s);

  const go=(hash)=>{ location.href='Market Backoffice.html'; };

  return (<div>
    <div className="hd">
      <div className="greet">สวัสดีครับ เจ้าของตลาด 👋</div>
      <h1>{market.name}</h1>
      <div className="per">{MARKET_TYPES[market.mtype]||'ตลาด'} · รอบ {monthTH(P0)}</div>
    </div>
    {markets.length>1&&<div className="mkchips">{markets.map(m=>(
      <button key={m.id} className={'mkchip'+(m.id===market.id?' on':'')} onClick={()=>setMid(m.id)}>{m.name}</button>))}</div>}
    <div className="wrap">
      <div className="hero-k">
        <div className="row">
          <div><div className="lbl">พื้นที่มีผู้เช่า</div><div className="big">{occ}<span style={{fontSize:20,color:'var(--ink-3)',fontWeight:600}}>/{total}</span></div></div>
          <div className="occbadge">เช่าเต็ม {total?Math.round(occ/total*100):0}%</div>
        </div>
        <div className="bar"><i style={{width:pct+'%',background:'var(--green)'}}/><i style={{width:(billed?Math.round((outstanding)/billed*100):0)+'%',background:'var(--red-soft)'}}/></div>
        <div className="barlg">
          <span><span className="dot" style={{background:'var(--green)'}}/>เก็บได้ <b>{B(collected)}</b></span>
          <span><span className="dot" style={{background:'var(--red)'}}/>ค้าง <b>{B(outstanding)}</b></span>
          <span style={{marginLeft:'auto'}}>เรียกเก็บรอบนี้ <b>{B(billed)}</b></span>
        </div>
      </div>
      <div className="kp2">
        <div className="kp"><div className="v">{pct}%</div><div className="l">อัตราเก็บเงิน</div><div className="f">{paid.length}/{bills.length} บิลจ่ายแล้ว</div></div>
        <div className="kp"><div className="v" style={{color:outstanding?'var(--red)':'var(--ink)'}}>{overdueB.length}</div><div className="l">ค้างเกินกำหนด</div><div className="f">รอชำระ {pendingB.length} บิล</div></div>
        <div className="kp"><div className="v" style={{color:vac?'var(--gold)':'var(--green)'}}>{vac}</div><div className="l">แผงว่าง</div><div className="f">พร้อมปล่อยเช่า</div></div>
        <div className="kp"><div className="v">{pendApps.length+bookApps.length}</div><div className="l">รอจัดการ</div><div className="f">สมัคร {pendApps.length} · จอง {bookApps.length}</div></div>
      </div>

      {window.KDSponsorFeed&&<div style={{margin:'14px 0'}}><window.KDSponsorFeed mod="market" limit={4} title="🎁 ดีลใกล้ตลาดคุณ"/></div>}

      {(pendApps.length>0||bookApps.length>0||leadApps.length>0)&&<>
        <div className="sect">📥 คำขอ &amp; การจอง <span className="cnt b">{pendApps.length+bookApps.length+leadApps.length}</span></div>
        <div className="list">
          {bookApps.map(a=>(<div className="li" key={a.id}><div className="ic" style={{background:'var(--gold-soft)'}}>🔔</div><div className="b"><div className="t">{a.name} · จองรอยืนยัน</div><div className="s">{a.phone} · แผง {a.stallCode||'—'}{a.amount?' · มัดจำ '+B(a.amount):''}</div></div></div>))}
          {pendApps.map(a=>(<div className="li" key={a.id}><div className="ic" style={{background:'var(--brand-soft)'}}>{catIc(a.cat)}</div><div className="b"><div className="t">{a.name} · ใบสมัครใหม่</div><div className="s">{a.phone} · {a.cat||'—'} · {a.model==='gp'?'คิด GP':'เหมาจ่าย'}</div></div></div>))}
          {leadApps.map(a=>(<div className="li" key={a.id}><div className="ic" style={{background:'#eef1f4'}}>👤</div><div className="b"><div className="t">{a.name} · ผู้สนใจ (lead)</div><div className="s">{a.phone} · {a.cat||'—'}</div></div></div>))}
        </div>
      </>}

      <div className="sect">⚠️ ค้างชำระเกินกำหนด {overStalls.length>0&&<span className="cnt">{overStalls.length}</span>}</div>
      <div className="list">
        {overStalls.length?overStalls.map(({b,s})=>(<div className="li" key={b.id}>
          <div className="ic" style={{background:'var(--red-soft)'}}>🏪</div>
          <div className="b"><div className="t">{s.code} · {s.vendor}</div><div className="s">ครบกำหนด {b.due?thDate(b.due):('วันที่ '+bc.dueDay)}{s.locked?' · 🔒 ล็อกสิทธิ์แล้ว':''}</div></div>
          <div className="amt r">{B(b.total)}</div></div>)):<div className="empty">✓ ไม่มีร้านค้างเกินกำหนด</div>}
      </div>

      <div className="sect">💸 ยอดเข้าล่าสุด</div>
      <div className="list">
        {feed.length?feed.map(b=>{ const s=stalls.find(x=>x.id===b.stallId); return (<div className="li" key={b.id}>
          <div className="ic" style={{background:'var(--green-soft)'}}>✓</div>
          <div className="b"><div className="t">{s?s.code+' · '+s.vendor:'บิล '+b.ref}</div><div className="s">{b.method==='promptpay'?'PromptPay':'โอน'} · {b.paidAt?thDateTime(b.paidAt):''}</div></div>
          <div className="amt g">{B(b.total)}</div></div>); }):<div className="empty">ยังไม่มียอดเข้ารอบนี้</div>}
      </div>

      <button className="cta" onClick={()=>go()}>เปิดโปรแกรมเต็ม (ออกบิล · จัดแผง · บัญชี)</button>
      <a className="cta gh" href="Vendor Signup.html">รับสมัครร้านค้า / แชร์ลิงก์จอง</a>
      <div className="foot">Market OS · แดชบอร์ดมือถือ<br/>ข้อมูลซิงค์กับโปรแกรมตลาดบนเว็บ (เครื่องเดียวกัน)</div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<div className="phone"><Dash/></div>);
</script>
</body>
</html>
