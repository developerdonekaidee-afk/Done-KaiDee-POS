/* status helpers */
function planInfo(s){
  const d = daysBetween(s.expiry, today);
  if(s.status==='suspended') return {badge:'b-susp',label:'ระงับ',days:d};
  if(s.plan==='paid') return {badge:'b-paid',label:'จ่ายแล้ว',days:d};
  if(d<0) return {badge:'b-expired',label:'หมดอายุ',days:d};
  return {badge:'b-trial',label:'ทดลอง',days:d};
}

function mapApiShop(r){
  return { id:r.id, name:r.name||r.id, emoji:r.emoji||'🍽️', logo:r.logo||null, cat:r.cat||'—',
    plan:r.plan||'trial', status:r.status||'active',
    expiry:r.expiry||new Date(Date.now()+30*864e5).toISOString(),
    mrr:r.plan==='paid'?199:0, joined:(r.createdAt?new Date(r.createdAt):new Date()).toISOString().slice(0,10),
    orders:0, gmv:0, last:'-',
    owner:{line:r.ownerLine||'', name:r.ownerName||'', phone:r.phone||''}, pays:[] };
}

// รายสัปดาห์ (7 สัปดาห์ล่าสุด) นับจากวันสมัครจริงของแต่ละร้าน
function weeklySignups(shops){
  const wk = d => { const x=new Date(d); if(isNaN(x)) return NaN; const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x.getTime(); };
  const cur = wk(new Date());
  const weeks=[]; for(let i=6;i>=0;i--) weeks.push(cur - i*7*864e5);
  const counts = weeks.map(()=>0);
  shops.forEach(s=>{ const w=wk(s.joined); const idx=weeks.indexOf(w); if(idx>=0) counts[idx]++; });
  const labels = weeks.map((w,i)=>{ if(i===6) return 'สัปดาห์นี้'; const d=new Date(w); return d.getDate()+' '+d.toLocaleDateString('th-TH',{month:'short'}); });
  return {counts,labels};
}
function Overview({db,onOpen,go}){
  const s=db.shops;
  const trial=s.filter(x=>planInfo(x).label==='ทดลอง').length;
  const paid=s.filter(x=>x.plan==='paid'&&x.status!=='suspended').length;
  const expired=s.filter(x=>planInfo(x).label==='หมดอายุ').length;
  const susp=s.filter(x=>x.status==='suspended').length;
  const mrr=s.reduce((a,x)=>a+(x.status!=='suspended'?x.mrr:0),0);
  const ym=new Date().toISOString().slice(0,7);
  const newThisMonth=s.filter(x=>String(x.joined||'').slice(0,7)===ym).length;
  const paidNewThisMonth=s.filter(x=>x.plan==='paid'&&String(x.joined||'').slice(0,7)===ym).length;
  const expSoon=s.filter(x=>{const p=planInfo(x);return (p.label==='ทดลอง'||p.label==='จ่ายแล้ว')&&p.days>=0&&p.days<=7;}).sort((a,b)=>planInfo(a).days-planInfo(b).days);
  const trialSoon=expSoon.filter(x=>planInfo(x).label==='ทดลอง').length;
  const {counts,labels}=weeklySignups(s);
  const mx=Math.max(1,...counts);
  return (<div>
    <div className="kpis">
      <Kpi lbl="ร้านทั้งหมด" val={s.length} delta={newThisMonth>0?`+${newThisMonth} เดือนนี้`:'ยังไม่มีสมัครใหม่เดือนนี้'} up={newThisMonth>0} ic="🏪"/>

function Kpi({lbl,val,delta,up,down,ic,dcolor}){
  return (<div className="card kpi"><div className="lbl">{ic} {lbl}</div><div className="val num">{val}</div>

}

function kdToast(msg){ let el=document.getElementById('kd-toast');
  if(!el){ el=document.createElement('div'); el.id='kd-toast'; el.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none'; document.body.appendChild(el); }
  const b=document.createElement('div'); b.textContent=msg;
  b.style.cssText='background:#12211E;color:#fff;font-weight:600;font-size:13.5px;line-height:1.5;padding:11px 16px;border-radius:12px;max-width:88vw;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.22)';
  el.appendChild(b); setTimeout(()=>b.remove(),4600); }
function AskSheet({title,body,fields,confirmWord,okText,danger,onCancel,onOk}){

  const ready=(!confirmWord||w.trim().toUpperCase()===String(confirmWord).toUpperCase())&&fs.every(f=>f.req===false||String(v[f.key]==null?'':v[f.key]).trim()!=='');
  const lb={fontSize:12.5,fontWeight:700,color:'var(--ink-2)',display:'block',marginBottom:4};
  const inp={width:'100%',padding:'11px 12px',minHeight:44};

      {body&&<div style={{fontSize:13,color:'var(--ink-2)',lineHeight:1.55,whiteSpace:'pre-line',marginBottom:13}}>{body}</div>}
      {fs.map(f=>(<div key={f.key} style={{marginBottom:11}}>
        <label style={lb}>{f.label}</label>
        <input className="in" type={f.type||'text'} min={f.type==='number'?'0':undefined} value={v[f.key]} placeholder={f.placeholder||''} onChange={e=>setV(s=>({...s,[f.key]:e.target.value}))} style={inp}/>
      </div>))}
      {confirmWord&&<div style={{marginBottom:11}}>
        <label style={lb}>พิมพ์ {confirmWord} เพื่อยืนยัน</label>
        <input className="in" value={w} onChange={e=>setW(e.target.value)} placeholder={confirmWord} style={inp}/>

        <button className={danger?'btn danger':'btn pri'} style={{flex:1,minHeight:44,opacity:ready?1:.45,pointerEvents:ready?'auto':'none'}} onClick={()=>onOk(v)}>{okText||'ยืนยัน'}</button>
      </div>
    </div>
  </div>);
}

        <div style={{fontWeight:700,fontSize:14,marginBottom:3,color:'var(--danger)'}}>ลบร้านถาวร</div>
        <div style={{fontSize:12.5,color:'var(--ink-2)',marginBottom:11,lineHeight:1.5}}>ลบร้านนี้ออกจากระบบพร้อมข้อมูลทั้งหมด — ใช้เมื่อร้านเลิก/สมัครทดสอบแล้วไม่ใช้จริง (กู้คืนไม่ได้)</div>

          body={(askReset.wipeMenu?`ออเดอร์ · สมาชิก · เมนู ของร้าน “${shop.name}” จะถูกลบกลับเป็นค่าเริ่มต้น`:`ออเดอร์ · สมาชิก · ตัวนับคิว ของร้าน “${shop.name}” จะถูกลบ (เก็บเมนูไว้)`)+'\n⚠️ ลบแล้วกู้คืนไม่ได้ — พิมพ์ชื่อร้านให้ตรงเพื่อยืนยัน'}
          confirmWord={shop.name} onCancel={()=>setAskReset(null)} onOk={()=>doReset(askReset.wipeMenu)}/>}
        {askDel && <div style={{marginTop:12,border:'1px solid var(--danger)',borderRadius:12,padding:14,background:'var(--danger-soft)'}}>
          <div style={{fontWeight:700,fontSize:13.5,color:'var(--danger)',marginBottom:6}}>ยืนยันลบร้าน “{shop.name}” ถาวร</div>
          <div style={{fontSize:12.5,color:'var(--ink-2)',lineHeight:1.55,marginBottom:10}}>เมนู · ออเดอร์ · สมาชิก · สต๊อก ทั้งหมดจะถูกลบ กู้คืนไม่ได้ — พิมพ์ชื่อร้านให้ตรงเพื่อยืนยัน</div>
          <input className="in" value={delTxt} onChange={e=>setDelTxt(e.target.value)} placeholder={shop.name} style={{width:'100%',padding:'10px 12px'}}/>

            <button className="btn sm" onClick={()=>setAskDel(false)}>ยกเลิก</button>
            <button className="btn danger sm" onClick={confirmDelete} style={{opacity:delTxt.trim()===shop.name.trim()?1:.45,pointerEvents:delTxt.trim()===shop.name.trim()?'auto':'none'}}>ลบถาวร</button>
          </div>
        </div>}
      </div>
    </div>
  </div></div>);
}
function Row({k,v,last}){ return (<div style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:last?'none':'1px solid var(--hair)'}}><span style={{fontSize:13,color:'var(--ink-3)'}}>{k}</span><span style={{fontSize:13.5,fontWeight:600}}>{v}</span></div>); }

/* ══ BILLING ══ */
function Billing({db}){
  const paid=db.shops.filter(s=>s.plan==='paid'&&s.status!=='suspended');
  const mrr=paid.reduce((a,s)=>a+s.mrr,0);
  const all=[]; db.shops.forEach(s=>s.pays.forEach(pm=>all.push({...pm,shop:s.name,emoji:s.emoji})));
  all.sort((a,b)=>new Date(b.d)-new Date(a.d));
  const thisMonth=all.filter(x=>x.d.startsWith('2026-07')).reduce((a,x)=>a+x.amt,0);
  return (<div>
    <div className="kpis" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
      <Kpi lbl="รายได้ต่อเดือน (MRR)" val={money(mrr)} delta={`${paid.length} ร้านจ่ายอยู่`} ic="💳"/>
      <Kpi lbl="เก็บได้เดือนนี้" val={money(thisMonth)} delta={`${all.filter(x=>x.d.startsWith('2026-07')).length} บิล`} ic="🧾"/>
      <Kpi lbl="สมาชิกจ่ายเงิน" val={paid.length} delta={`จากทั้งหมด ${db.shops.length} ร้าน`} ic="✓"/>
      <Kpi lbl="ค้างชำระ" val={db.shops.filter(s=>planInfo(s).label==='หมดอายุ').length} delta="ตามทวง" down ic="⚠️"/>
    </div>
    <div className="card" style={{overflow:'hidden',marginTop:16}}>
      <div style={{padding:'16px 18px',fontWeight:700,fontSize:15.5,borderBottom:'1px solid var(--hair)'}}>ประวัติการชำระเงินล่าสุด</div>
      <table><thead><tr><th>ร้านค้า</th><th>จำนวน</th><th>ช่องทาง</th><th>วันที่</th><th>สถานะ</th></tr></thead><tbody>
        {all.slice(0,14).map((x,i)=>(<tr key={i}><td><div style={{display:'flex',alignItems:'center',gap:10}}><div className="shopmk" style={{width:30,height:30,fontSize:15}}>{x.emoji}</div>{x.shop}</div></td>
          <td className="num" style={{fontWeight:600}}>{money(x.amt)}</td><td style={{color:'var(--ink-2)',fontSize:13}}>{x.via}</td>
          <td className="num" style={{fontSize:13}}>{fmtDate(x.d)}</td><td><span className="badge b-paid">✓ สำเร็จ</span></td></tr>))}
      </tbody></table>
    </div>
  </div>);
}

/* ══ WALLETS (กระเป๋าเงินทุกโมดูล · ยอด+ประวัติอ่านจาก backend D1) ══ */
const KDW_PLAT_KEY='kd_platform_wallet_v1';
const KDW_MODS={pos:['🏪','ร้านค้า POS'],fitness:['🏋️','ฟิตเนส'],market:['🏪','ตลาด'],labor:['🛵','วิน'],sponsor:['🎁','สปอนเซอร์'],app:['📱','อื่นๆ']};
function kdwApiBase(){ try{ return (window.KD_API_BASE||localStorage.getItem('kd_api_base')||'').replace(/\/+$/,''); }catch(e){ return ''; } }
async function kdwApi(path,opt){ const b=kdwApiBase(); if(!b) return {__offline:true};
  const o=opt||{}; const h={'Content-Type':'application/json'};
  try{ const t=sessionStorage.getItem('kd_admin_tok')||localStorage.getItem('kd_admin_tok'); if(t) h['X-Admin-Token']=t; }catch(e){}
  const r=await fetch(b+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
  let j=null; try{ j=await r.json(); }catch(e){}
  return r.ok?(j||{}):{__err:true,status:r.status,...(j||{})}; }
function Wallets(){
  const [rows,setRows]=useState([]); const [queue,setQueue]=useState([]); const [q,setQ]=useState('');
  const [open,setOpen]=useState(null); const [txns,setTxns]=useState([]);
  const [acct,setAcct]=useState({promptpay:'',bank:'',acctNo:'',acctName:''});
  const [vf,setVf]=useState({slipAuto:true,provider:'',lineSlip:false,ready:{}});
  const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  const live=!!kdwApiBase();
  const load=async()=>{ setBusy(true);
    const [w,qu,ac,v]=await Promise.all([kdwApi('/wallet'),kdwApi('/wallet-topups?status=pending'),kdwApi('/wallet-account'),kdwApi('/wallet-verify')]);
    if(Array.isArray(w)) setRows(w.map(r=>{ const [mod,id]=String(r.biz_id||'').split(':');
      return {key:r.biz_id,mod:mod||'app',id:id||'main',balance:Number(r.balance)||0,auto:r.auto!==0,updatedAt:r.updated_at||0,
        pp:r.pp||'',bank:r.bank||'',acctNo:r.acct_no||''}; }));
    if(Array.isArray(qu)) setQueue(qu);
    if(ac&&!ac.__err&&!ac.__offline) setAcct({promptpay:ac.promptpay||'',bank:ac.bank||'',acctNo:ac.acctNo||'',acctName:ac.acctName||''});
    if(v&&!v.__err&&!v.__offline) setVf({slipAuto:v.slipAuto!==false,provider:v.provider||'',lineSlip:!!v.lineSlip,ready:v.ready||{}});
    setBusy(false); };
  useEffect(()=>{ load(); },[]);
  const showTxns=async(k)=>{ if(open===k){ setOpen(null); setTxns([]); return; }
    setOpen(k); const r=await kdwApi('/wallet/'+encodeURIComponent(k)+'/txns?limit=60'); setTxns(Array.isArray(r)?r:[]); };
  const [askRej,setAskRej]=useState(null); const [askAdj,setAskAdj]=useState(null);
  const approve=async(t,ok,reason)=>{
    if(!ok&&!reason){ setAskRej(t); return; }
    setBusy(true);
    const r=await kdwApi('/wallet-txns/'+t.id,{method:'PATCH',body:ok?{status:'confirmed',by:'admin'}:{status:'rejected',by:'admin',reason}});
    setBusy(false);
    setMsg(r.__err?('ทำรายการไม่สำเร็จ: '+(r.error||r.status)):(ok?('อนุมัติแล้ว · ยอดใหม่ '+money(r.balance)):'ปฏิเสธคำขอแล้ว · แจ้งร้านทาง LINE ให้อัตโนมัติ'));
    load(); };
  const adjust=(r,kind)=>setAskAdj({row:r,kind});
  const doAdjust=async(r,kind,raw,noteRaw)=>{
    const v=Math.round((Number(raw)||0)*100)/100;
    if(!(v>0)){ setMsg('ระบุจำนวนเงินมากกว่า 0'); return; }
    if(kind!=='topup'&&v>r.balance){ setMsg('ปรับลดเกินยอดคงเหลือไม่ได้'); return; }
    setAskAdj(null); const note=(noteRaw||'').trim()||'ปรับโดยแอดมิน';
    setBusy(true); const res=await kdwApi('/wallet/'+encodeURIComponent(r.key)+'/adjust',{method:'POST',body:{amount:kind==='topup'?v:-v,note:note+' · Back Office',by:'admin'}});
    setBusy(false); setMsg(res.__err?('ไม่สำเร็จ: '+(res.error||res.status)):('บันทึกแล้ว · ยอดใหม่ '+money(res.balance))); load(); };
  const toggleAuto=async(r)=>{ await kdwApi('/wallet/'+encodeURIComponent(r.key)+'/auto',{method:'POST',body:{on:!r.auto}}); load(); };
  const saveAcct=async()=>{ setBusy(true); const r=await kdwApi('/wallet-account',{method:'PUT',body:acct}); setBusy(false);
    setMsg(r.__err?('บันทึกบัญชีไม่สำเร็จ: '+(r.error||r.status)):'บันทึกบัญชีรับเงินของระบบแล้ว · ทุกโมดูลจะโชว์บัญชีนี้ตอนเติมเงิน'); };
  const saveVf=async(patch)=>{ const nv={...vf,...patch}; setVf(nv);
    const r=await kdwApi('/wallet-verify',{method:'PUT',body:{slipAuto:nv.slipAuto,provider:nv.provider,lineSlip:nv.lineSlip}});
    setMsg(r.__err?'บันทึกการตั้งค่าไม่สำเร็จ':'บันทึกการตั้งค่าแล้ว'); };
  const plat=(()=>{ try{ return JSON.parse(localStorage.getItem(KDW_PLAT_KEY))||{ledger:[]}; }catch(e){ return {ledger:[]}; } })();
  const platLed=plat.ledger||[];
  const rev30=platLed.filter(x=>x.date&&(Date.now()-new Date(x.date))<30*864e5).reduce((a,x)=>a+(Number(x.amt)||0),0);
  const list=rows.filter(r=>!q||(r.key+' '+((KDW_MODS[r.mod]||[])[1]||'')).toLowerCase().includes(q.toLowerCase()));
  const totBal=rows.reduce((a,r)=>a+r.balance,0);
  const pendAmt=queue.reduce((a,t)=>a+(Number(t.amount)||0),0);
  return (<div>
    {!live && <div className="card" style={{padding:'14px 18px',marginBottom:14,background:'var(--danger-soft)',color:'var(--danger)',fontSize:13.5,fontWeight:600}}>ยังไม่ได้ตั้งที่อยู่ backend (kd_api_base) — หน้านี้ต้องต่อเซิร์ฟเวอร์เพื่ออ่านยอดกระเป๋าจริง</div>}
    {msg && <div className="card" style={{padding:'12px 18px',marginBottom:14,fontSize:13.5,fontWeight:600}}>{msg} <button onClick={()=>setMsg('')} style={{border:'none',background:'none',color:'var(--ink-3)',cursor:'pointer',fontSize:12.5,fontFamily:'inherit'}}>ปิด</button></div>}
    {askRej && <AskSheet danger okText="ปฏิเสธคำขอ" title="ไม่อนุมัติคำขอเติมเงิน" body={'ร้านจะเห็นเหตุผลนี้ในประวัติและได้รับแจ้งทาง LINE'}
      fields={[{key:'reason',label:'เหตุผลที่ไม่อนุมัติ',value:'ยอดในสลิปไม่ตรง / ไม่พบเงินเข้าบัญชี'}]}
      onCancel={()=>setAskRej(null)} onOk={v=>{ const t=askRej; setAskRej(null); approve(t,false,v.reason); }}/>}
    {askAdj && <AskSheet okText={askAdj.kind==='topup'?'เติมเงิน':'ปรับลดยอด'} danger={askAdj.kind!=='topup'}
      title={(askAdj.kind==='topup'?'เติมเงินเข้ากระเป๋า ':'ปรับลดกระเป๋า ')+askAdj.row.key}
      body={'ยอดคงเหลือปัจจุบัน '+money(askAdj.row.balance)+' · รายการนี้บันทึกถาวรในประวัติ'}
      fields={[{key:'amt',label:'จำนวนเงิน (บาท)',type:'number',placeholder:'0'},{key:'note',label:'หมายเหตุ',req:false,value:askAdj.kind==='topup'?'แอดมินเติมเงินให้ (ตรวจยอดเข้าบัญชีแล้ว)':'แอดมินปรับลดยอด'}]}
      onCancel={()=>setAskAdj(null)} onOk={v=>doAdjust(askAdj.row,askAdj.kind,v.amt,v.note)}/>}
    <div className="kpis" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
      <Kpi lbl="ยอดเงินค้างในกระเป๋าทั้งหมด" val={money(totBal)} delta={rows.length+' กระเป๋า'} ic="👛"/>
      <Kpi lbl="คำขอเติมเงินรอตรวจ" val={queue.length} delta={money(pendAmt)} ic="⏳"/>
      <Kpi lbl="รายได้ค่าบริการ 30 วัน" val={money(rev30)} delta={platLed.length+' รายการ (สำเนาในเครื่อง)'} up ic="📈"/>
      <Kpi lbl="เปิดตัดอัตโนมัติ" val={rows.filter(r=>r.auto).length+'/'+rows.length} delta="ต่ออายุเองเมื่อครบรอบ" ic="🔁"/>
    </div>

    {/* คิวอนุมัติเติมเงิน */}
    <div className="card" style={{overflow:'hidden',marginTop:16}}>
      <div style={{padding:'14px 18px',display:'flex',alignItems:'center',gap:12,borderBottom:'1px solid var(--hair)'}}>
        <div style={{fontWeight:700,fontSize:15.5,flex:1}}>คำขอเติมเงินรอตรวจสอบ</div>
        <button onClick={load} className="badge b-trial" style={{border:'none',cursor:'pointer'}}>{busy?'กำลังโหลด…':'รีเฟรช'}</button>
      </div>
      {queue.length?<table><thead><tr><th>เวลา</th><th>กระเป๋า</th><th>ยอดที่แจ้ง</th><th>เลขอ้างอิง</th><th>สลิป</th><th>ตรวจ</th></tr></thead><tbody>
        {queue.map(t=>(<tr key={t.id}>
          <td className="num" style={{fontSize:13}}>{t.ts?new Date(t.ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-'}</td>

          <td><div style={{display:'flex',gap:6}}>

            <button onClick={()=>approve(t,false)} className="badge b-expired" style={{border:'none',cursor:'pointer'}}>✕ ไม่พบเงิน</button>

    </div>

    {/* บัญชีรับเงินของระบบ + ช่องทางตรวจเงินเข้า */}

      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>

      <div style={{height:1,background:'var(--hair)',margin:'16px 0'}}/>
      <div style={{fontWeight:700,fontSize:15,marginBottom:8}}>ช่องทางตรวจว่าเงินเข้าจริง</div>
      <div style={{display:'flex',flexDirection:'column',gap:9}}>

/* ══ DELETION LOG (หลักฐานการลบร้านถาวร · PDPA/consent) ══ */
function DeletionLog(){
  const [logs,setLogs] = useState([]);
  const [err,setErr] = useState('');
  const load = ()=>{ const tok=sessionStorage.getItem('kd_admin_tok')||''; fetch(KD_API_BASE+'/deletion-log'+(tok?('?token='+encodeURIComponent(tok)):''),{headers:tok?{'X-Admin-Token':tok}:{}}).then(r=>r.ok?r.json():{logs:[]}).then(j=>{ if(j&&Array.isArray(j.logs)) setLogs(j.logs); else if(j&&j.error) setErr(j.error); }).catch(()=>setErr('เชื่อม backend ไม่ได้ (ลอง login ออนไลน์)')); };
  useEffect(()=>{ load(); const t=setInterval(load,15000); return ()=>clearInterval(t); },[]);
  const dt = (ms)=> ms? new Date(+ms).toLocaleString('th-TH',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  return (<div>
    <div className="kpis" style={{gridTemplateColumns:'repeat(2,1fr)'}}>
      <Kpi lbl="ร้านที่ลบถาวร (สะสม)" val={logs.length} delta="ผู้ใช้ยืนยัน consent เอง" down ic="🗑️"/>
      <Kpi lbl="แพ็กเก่าเป็นโมฆะ" val={logs.filter(l=>l.package_void).length} delta="ไม่คืนเงิน" ic="❌"/>
    </div>
    {err && <div className="card" style={{padding:'14px 18px',marginTop:16,color:'var(--danger)',fontSize:13.5}}>{err}</div>}
    <div className="card" style={{overflow:'hidden',marginTop:16}}>
      <div style={{padding:'16px 18px',fontWeight:700,fontSize:15.5,borderBottom:'1px solid var(--hair)'}}>ประวัติการลบร้าน ({logs.length}) — หลักฐานการยินยอมถาวร</div>
      {logs.length===0 && !err && <div style={{padding:'30px',textAlign:'center',color:'var(--ink-3)',fontSize:13.5}}>ยังไม่มีการลบร้าน · เมื่อเจ้าของร้านกด “ลบร้าน · สมัครใหม่” จะบันทึกเข้าที่นี่</div>}
      {logs.map((l,i)=>(<div key={l.id||i} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 18px',borderBottom:'1px solid var(--hair)'}}>
        <div className="shopmk">🗑️</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700}}>{l.shop_name||l.shop_id||'-'}</div>
          <div style={{fontSize:12.5,color:'var(--ink-3)'}} className="mono">{l.shop_id}{l.owner_name?(' · '+l.owner_name):''}{l.owner_line?(' · LINE '+String(l.owner_line).slice(0,10)+'…'):''}</div>
          <div style={{fontSize:12,color:'var(--ink-3)',marginTop:2}}>ลบเมื่อ {dt(l.at)}{l.code?(' · รหัสยืนยัน '+l.code):''}</div>
        </div>
        {l.package_void ? <span className="badge b-expired">❌ แพ็กโมฆะ</span> : <span className="badge b-trial">–</span>}
      </div>))}
    </div>
  </div>);
}

    {askReset && <AskSheet danger okText="คืนค่าเริ่มต้น" title="คืนค่าต้นแบบเริ่มต้นทั้งหมด" body="เอกสารที่แก้เองจะหายทั้งหมด แทนด้วยชุดต้นแบบของระบบ"
      onCancel={()=>setAskReset(false)} onOk={()=>{ setAskReset(false); setList(KD.reset()); setMsg('คืนค่าเริ่มต้นแล้ว'); }}/>}
    <div className="card" style={{padding:'16px 20px',marginBottom:16,background:'var(--blue-soft)',border:'none',display:'flex',gap:12,alignItems:'flex-start'}}>
      <span style={{fontSize:22}}>📄</span>

    </div>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14,alignItems:'center'}}>
      <span style={{fontSize:12.5,color:'var(--ink-3)',fontWeight:600}}>ตัวแปรที่ใช้ได้:</span>
      {CHIPS.map(c=><span key={c} className="mono badge b-paid" style={{fontSize:11.5}}>{c}</span>)}
    </div>
    {list.map((t,i)=>(<div key={t.id} className="card" style={{padding:'16px 18px',marginBottom:14}}>
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:10}}>

        <input className="in" value={t.cat} onChange={e=>upd(i,'cat',e.target.value)} placeholder="หมวด" style={{width:130}}/>

    </div>))}

  </div>);
}

function SystemReset(){
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState('');
  const [ask,setAsk]=useState(false);
  const wipe=async()=>{
    setAsk(false);
    setBusy(true); setMsg('กำลังลบ…');
    const tok=sessionStorage.getItem('kd_admin_tok')||'';
    try{
      const r=await fetch(KD_API_BASE+'/shops'); const rows=r.ok?await r.json():[];
      let n=0; for(const s of (Array.isArray(rows)?rows:[])){
        try{ const d=await fetch(KD_API_BASE+'/shops/'+s.id,{method:'DELETE',headers:{'content-type':'application/json','X-Admin-Token':tok},body:JSON.stringify({token:tok})}); if(d.ok) n++; }catch(e){} }

      setTimeout(()=>location.reload(),1400);
    }catch(e){ setBusy(false); setMsg('ล้างไม่สำเร็จ — backend ไม่ตอบ'); }
  };

/* ══ PAY REQUESTS (คำขอชำระเงิน manual) ══ */
function PayRequests({db,update,onPending}){
  const [reqs,setReqs] = useState(loadPayReqs);
  const [big,setBig] = useState(null);
  useEffect(()=>{ if(onPending) onPending(reqs.filter(r=>r.status==='pending').length); },[reqs]);
  useEffect(()=>{ (async()=>{ try{ const r=await fetch(KD_API_BASE+'/pay-requests'); if(!r.ok) return; const rows=await r.json();
    if(Array.isArray(rows)&&rows.length){ const mapped=rows.map(x=>({ id:x.id, shopId:x.shop_id, shopName:x.shop_name, amount:x.amount, months:x.months, slip:x.slip, note:x.note, kind:x.kind, addon:x.addon, status:x.status, created_at:x.created_at }));
      setReqs(prev=>{ const m=new Map(prev.map(x=>[x.id,x])); mapped.forEach(x=>m.set(x.id,{...m.get(x.id),...x})); return Array.from(m.values()).sort((a,b)=>(b.created_at||0)-(a.created_at||0)); }); } }catch(e){} })(); },[]);
  const pending = reqs.filter(r=>r.status==='pending');
  const handled = reqs.filter(r=>r.status!=='pending');
  const persist = (next)=>{ savePayReqs(next); setReqs(next); };
  const extendShop = (r)=> update(d=>{ const s=d.shops.find(x=>x.id===r.shopId||x.name===r.shopName);
    if(s){ const base=Math.max(Date.now(), new Date(s.expiry).getTime()||0); const e=new Date(base+(r.months||1)*30*864e5);
      s.plan='paid'; s.status='active'; s.expiry=e.toISOString(); s.mrr=199;
      s.pays.unshift({d:new Date().toISOString().slice(0,10),amt:r.amount,via:'พร้อมเพย์ (แจ้งชำระ)'}); } return d; });
  const confirm = (r)=>{ persist(reqs.map(x=>x.id===r.id?{...x,status:'confirmed',handled_at:Date.now()}:x)); (r.kind==='addon'&&r.addon)?addonShop(r):extendShop(r);
    fetch(KD_API_BASE+'/pay-requests/'+r.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:'confirmed'})}).catch(()=>{}); syncLicenseApprove(r); };
  const reject = (r)=>{ persist(reqs.map(x=>x.id===r.id?{...x,status:'rejected',handled_at:Date.now()}:x));
    fetch(KD_API_BASE+'/pay-requests/'+r.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:'rejected'})}).catch(()=>{}); };
  const monthLbl = m=> m>=12?'1 ปี':m+' เดือน';
  const ADDON_LBL = { consign:'ขายฝาก' };
  const addonShop = (r)=> update(d=>{ const s=d.shops.find(x=>x.id===r.shopId||x.name===r.shopName);
    if(s){ s.addons={...(s.addons||{}),[r.addon]:true}; s.pays=s.pays||[]; s.pays.unshift({d:new Date().toISOString().slice(0,10),amt:r.amount,via:'Add-on '+((ADDON_LBL[r.addon])||r.addon)+' (แจ้งชำระ)'}); } return d; });
  const reqLine = (r)=> (r.kind==='addon'&&r.addon) ? ('Add-on: '+((ADDON_LBL[r.addon])||r.addon)+' · '+monthLbl(r.months)) : monthLbl(r.months);
  return (<div>
    <div className="kpis" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
      <Kpi lbl="รอยืนยัน" val={pending.length} delta="ตรวจสลิป" down={pending.length>0} ic="🧾"/>
      <Kpi lbl="ยืนยันแล้ว (สะสม)" val={handled.filter(r=>r.status==='confirmed').length} delta="" up ic="✓"/>
      <Kpi lbl="ยอดรอตรวจ" val={money(pending.reduce((a,r)=>a+(r.amount||0),0))} delta="" ic="💰"/>
    </div>
    <div className="card" style={{overflow:'hidden',marginTop:16}}>
      <div style={{padding:'16px 18px',fontWeight:700,fontSize:15.5,borderBottom:'1px solid var(--hair)'}}>รอยืนยัน ({pending.length})</div>
      {pending.length===0 && <div style={{padding:'30px',textAlign:'center',color:'var(--ink-3)',fontSize:13.5}}>ไม่มีคำขอรอยืนยัน · คำขอจะมาจากปุ่ม "แจ้งชำระเงิน" ในแอปร้าน</div>}
      {pending.map(r=>(<div key={r.id} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 18px',borderBottom:'1px solid var(--hair)'}}>
        <div className="shopmk">🏪</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700}}>{r.shopName||r.shopId}</div>
          <div style={{fontSize:12.5,color:'var(--ink-3)'}}>{money(r.amount)} · {reqLine(r)} {r.note?'· '+r.note:''}</div>
        </div>
        {r.slip ? <img src={r.slip} onClick={()=>setBig(r.slip)} style={{width:46,height:46,objectFit:'cover',borderRadius:9,border:'1px solid var(--hair-2)',cursor:'zoom-in'}}/> : <span style={{fontSize:11.5,color:'var(--ink-3)'}}>ไม่มีสลิป</span>}
        <button className="btn danger sm" onClick={()=>reject(r)}>ปฏิเสธ</button>
        <button className="btn pri sm" onClick={()=>confirm(r)}>{(r.kind==='addon')?'ยืนยัน + เปิด add-on':'ยืนยัน + ต่ออายุ'}</button>
      </div>))}
    </div>
    {handled.length>0 && <div className="card" style={{overflow:'hidden',marginTop:16}}>
      <div style={{padding:'16px 18px',fontWeight:700,fontSize:15.5,borderBottom:'1px solid var(--hair)'}}>ประวัติ</div>
      {handled.slice(0,12).map(r=>(<div key={r.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 18px',borderBottom:'1px solid var(--hair)'}}>
        <div style={{flex:1}}><span style={{fontWeight:600,fontSize:13.5}}>{r.shopName||r.shopId}</span> <span style={{fontSize:12.5,color:'var(--ink-3)'}}>· {money(r.amount)} · {monthLbl(r.months)}</span></div>
        <span className={'badge '+(r.status==='confirmed'?'b-paid':'b-expired')}>{r.status==='confirmed'?'✓ ยืนยันแล้ว':'ปฏิเสธ'}</span>
      </div>))}
    </div>}
    {big && <div onClick={()=>setBig(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:60,padding:30,cursor:'zoom-out'}}><img src={big} style={{maxWidth:'90%',maxHeight:'90%',borderRadius:12}}/></div>}
  </div>);
}

/* ══ CODE REQUESTS (คำขอรหัส Office · เปิดวันย้อนหลัง) ══ */

  useEffect(()=>{ load(); const t=setInterval(load,8000); return ()=>clearInterval(t); },[]);
  const pending = reqs.filter(r=>r.status==='pending');

  const reject = async (r)=>{ try{ await fetch(KD_API_BASE+'/code-requests/'+r.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:'rejected'})}); load(); }catch(e){} };

    {handled.length>0 && <div className="card" style={{overflow:'hidden',marginTop:16}}>
      <div style={{padding:'16px 18px',fontWeight:700,fontSize:15.5,borderBottom:'1px solid var(--hair)'}}>ประวัติ</div>

        <div style={{flex:1}}><span style={{fontWeight:600,fontSize:13.5}}>{r.shop_name||r.shop_id}</span> <span style={{fontSize:12,color:'var(--ink-3)'}} className="mono">· {dt(r.handled_at||r.created_at)}</span></div>

}

function MenuManager({shopId}){

  useEffect(()=>{ let alive=true; setItems(null);
    fetch(KD_API_BASE+'/menu?shop='+encodeURIComponent(shopId)).then(r=>r.ok?r.json():[]).then(rows=>{ if(alive) setItems(Array.isArray(rows)?rows:[]); }).catch(()=>alive&&setItems([]));
    return ()=>{alive=false;}; },[shopId]);
  const upd=(i,k,v)=>setItems(a=>a.map((x,j)=>j===i?{...x,[k]:v,_dirty:true}:x));
  const addNew=()=>setItems(a=>[{id:'m'+Date.now(),cat:'อาหาร',th:'',en:'',price:0,cost:0,hot:false,off:false,active:true,_dirty:true,_new:true},...(a||[])]);
  const saveOne=async(it)=>{ try{ const r=await fetch(KD_API_BASE+'/menu?shop='+encodeURIComponent(shopId),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(it)});
      if(r.ok){ setItems(a=>a.map(x=>x.id===it.id?{...x,_dirty:false,_new:false}:x)); return true; } }catch(e){} return false; };
  const saveAll=async()=>{ setBusy(true); setMsg('');
    const dirty=(items||[]).filter(x=>x._dirty&&(x.th||'').trim());
    if(!dirty.length){ setBusy(false); setMsg('ไม่มีรายการที่แก้'); return; }
    let ok=0; for(const it of dirty){ if(await saveOne(it)) ok++; }
    setBusy(false); setMsg(ok===dirty.length?`บันทึก ${ok} เมนู ✓`:`บันทึกได้ ${ok}/${dirty.length} — backend ไม่ตอบบางรายการ`); };
  const [askDelIt,setAskDelIt]=useState(null);

  if(items===null) return <div style={{padding:'44px',textAlign:'center',color:'var(--ink-3)'}}>กำลังโหลดเมนู…</div>;

      <div style={{display:'flex',gap:8,alignItems:'center'}}>{msg&&<span style={{fontSize:12.5,fontWeight:600,color:msg.includes('✓')?'var(--brand-ink)':'var(--danger)'}}>{msg}</span>}
        <button className="btn line sm" onClick={addNew}>+ เพิ่มเมนู</button>
        <button className="btn pri sm" onClick={saveAll} disabled={busy}>{busy?'กำลังบันทึก…':'บันทึกทั้งหมด'}</button></div>
    </div>

        <td><input className="in" value={it.th||''} onChange={e=>upd(i,'th',e.target.value)} placeholder="ชื่อเมนู" style={{width:'100%',padding:'7px 9px',fontSize:13.5}}/></td>

        <td><input className="in num" type="number" value={it.cost} onChange={e=>upd(i,'cost',+e.target.value||0)} style={{width:76,padding:'6px 8px'}}/></td>
        <td style={{textAlign:'center'}}><button onClick={()=>upd(i,'hot',!it.hot)} title="ขายดี" style={{border:'none',background:'none',fontSize:18,cursor:'pointer',opacity:it.hot?1:.24}}>🔥</button></td>

        <td><button className="btn line sm" onClick={()=>del(it)} style={{padding:'6px 9px'}}>🗑️</button></td>
      </tr>))}
      {items.length===0&&<tr><td colSpan={7} style={{textAlign:'center',color:'var(--ink-3)',padding:'34px'}}>ยังไม่มีเมนู · กด “เพิ่มเมนู” เพื่อสร้างให้ร้าน</td></tr>}

  </div>);
}

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,gap:10,flexWrap:'wrap'}}>
      <div style={{fontSize:13,color:'var(--ink-3)'}}>{rows.length} วัตถุดิบ · คงเหลือ/ต้นทุนเฉลี่ย/จุดเตือน</div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>{msg&&<span style={{fontSize:12.5,fontWeight:600,color:msg.includes('✓')?'var(--brand-ink)':'var(--danger)'}}>{msg}</span>}
        <button className="btn line sm" onClick={addNew}>+ เพิ่มวัตถุดิบ</button>
        <button className="btn pri sm" onClick={save} disabled={busy}>{busy?'กำลังบันทึก…':'บันทึกสต๊อก'}</button></div>
    </div>
    <div className="card" style={{overflow:'hidden'}}>
      <table><thead><tr><th>วัตถุดิบ</th><th style={{width:96}}>หน่วย</th><th style={{width:100}}>คงเหลือ</th><th style={{width:114}}>ต้นทุน/หน่วย</th><th style={{width:100}}>จุดเตือน</th><th style={{width:44}}></th></tr></thead>
      <tbody>{rows.map((r,i)=>{const lowHit=(+r.stock)<=(+r.low)&&(+r.low)>0;return (<tr key={r.id} style={lowHit?{background:'var(--danger-soft)'}:null}>
        <td><input className="in" value={r.th||''} onChange={e=>upd(i,'th',e.target.value)} placeholder="ชื่อวัตถุดิบ" style={{width:'100%',padding:'7px 9px',fontSize:13.5}}/></td>
        <td><select className="in" value={r.unit||'g'} onChange={e=>upd(i,'unit',e.target.value)} style={{width:84,padding:'7px 8px'}}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></td>
        <td><input className="in num" type="number" value={r.stock} onChange={e=>upd(i,'stock',+e.target.value||0)} style={{width:86,padding:'6px 8px'}}/></td>
        <td><input className="in num" type="number" value={r.avgCost} onChange={e=>upd(i,'avgCost',+e.target.value||0)} style={{width:98,padding:'6px 8px'}}/></td>
        <td><input className="in num" type="number" value={r.low} onChange={e=>upd(i,'low',+e.target.value||0)} style={{width:86,padding:'6px 8px'}}/></td>
        <td><button className="btn line sm" onClick={()=>del(i)} style={{padding:'6px 9px'}}>🗑️</button></td>
      </tr>);})}
      {rows.length===0&&<tr><td colSpan={6} style={{textAlign:'center',color:'var(--ink-3)',padding:'34px'}}>ยังไม่มีวัตถุดิบ · กด “เพิ่มวัตถุดิบ”</td></tr>}
      </tbody></table>
    </div>
    <div style={{fontSize:12,color:'var(--ink-3)',marginTop:10}}>* บันทึกจะแทนที่ทั้งชุด (ลบแถวที่เอาออกด้วย) · แถวแดง = คงเหลือต่ำกว่าจุดเตือน</div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
