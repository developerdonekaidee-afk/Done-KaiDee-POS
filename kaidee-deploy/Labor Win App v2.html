.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold)}.btn.dark{background:var(--ink)}.btn.ghost{background:#fff;color:var(--ink-2);border:1.5px solid var(--line)}
.btn2{display:flex;gap:9px}
.btn2 .b{flex:1;border:none;font-family:inherit;border-radius:13px;padding:15px;text-align:center;font-size:15px;font-weight:800;color:#fff;cursor:pointer}

.rowb{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}

.timer{text-align:center;font-size:12.5px;font-weight:700;color:var(--gold)}

.seg{display:flex;gap:6px;background:#eef1f0;border-radius:11px;padding:4px}
.seg button{flex:1;border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink-3);padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* worker switch */
.wsw{display:flex;align-items:center;gap:11px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px;cursor:pointer;transition:.15s}
.wsw.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.wsw.dis{opacity:.75;cursor:default}
.wsw .e{font-size:26px}
.wsw .tx{flex:1}.wsw .tx b{font-size:15px;display:block}.wsw .tx span{font-size:11.5px;color:var(--ink-3)}
.wsw .knob{width:46px;height:27px;border-radius:100px;background:#cfd8d3;position:relative;flex:0 0 auto;transition:.15s}
.wsw .knob:after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wsw .knob.on:after{left:22px}
/* paysel (statuses / pay) */
.paysel{display:flex;flex-direction:column;gap:7px}
.paysel .p{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:9px}
.paysel .p.on{border-color:var(--brand);background:var(--brand-soft)}
.paysel .p .r{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.paysel .p.on .r{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.mini{font-size:10px;font-weight:800;background:var(--gold);color:#fff;padding:1px 6px;border-radius:100px;margin-left:6px;vertical-align:middle}
.mini2{font-size:10.5px;color:var(--ink-3)}
.minibtn{border:none;background:var(--brand);color:#fff;font-family:inherit;font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:9px;cursor:pointer}
.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:6px;background:var(--line);margin:12px 0 6px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--brand);cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sel{border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;font-family:inherit;font-size:12.5px;background:#fff}
.tin{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font-family:inherit;font-size:12.5px}
.daychip{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:9px 0;text-align:center;font-size:12.5px;cursor:pointer;font-weight:600}
.daychip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ckrow{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.4;cursor:pointer;padding:2px}
.ckrow input{margin-top:2px;width:17px;height:17px;flex:0 0 auto}
.reset{margin-top:6px;font-size:12px;color:var(--ink-3);background:none;border:none;cursor:pointer;text-decoration:underline;align-self:center}
.toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:100px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s;white-space:nowrap;max-width:88%;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(14,30,22,.5);z-index:40;display:flex;align-items:flex-end;animation:tin .2s}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:9px}
.modal .mh{font-size:17px;font-weight:800}
.modal .mp{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.tbox{background:var(--gold-soft);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--ink-2)}
.tbox b{color:var(--ink)}.tbox ul{margin:6px 0 0 16px;line-height:1.6}
.flbl{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:4px}
.fin{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:14px;width:100%}
.tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:none;background:none;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--ink-3);font-size:10.5px;font-weight:700;border-radius:12px}
.tabbar button .e{font-size:20px;line-height:1;position:relative}
.tabbar button.on{color:var(--brand)}
.tabbar button.on.worker{color:var(--gold)}.tabbar button.on.win{color:var(--ink)}
.badge{position:absolute;top:-4px;right:-9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px}
@media(max-width:520px){
  body{padding:0;display:block}
  .head{display:none}
  .phone{width:100%;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}

<div id="mount"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">const { useState, useEffect } = React; Object.assign(window,{useState,useEffect});</script>
<script type="text/babel" src="platform-api.jsx?v=p2-20260730j"></script>
<script type="text/babel" src="kd-wallet.jsx?v=p2-20260730j"></script>
<script type="text/babel" src="laborwin2-data.jsx?v=p2-20260730j"></script>
<script type="text/babel" src="kd-sponsor-feed.jsx?v=p2-20260730j"></script>
<script type="text/babel" src="laborwin2-worker.jsx?v=p2-20260730j"></script>
<script type="text/babel" src="laborwin2-shop.jsx?v=p2-20260730j"></script>
<script type="text/babel" src="laborwin2-win.jsx?v=p2-20260730j"></script>
<script type="text/babel">
function Root(){
  const [role,setRole]=useState(()=>{ try{ const r=new URLSearchParams(location.search).get('role')||''; const map={worker:'worker',labor:'worker',shop:'shop',merchant:'shop',lead:'shop',vendor:'shop',win:'win',leader:'win',winleader:'win',market:'market'}; return map[r.toLowerCase()]||'shop'; }catch(e){ return 'shop'; } });
  const [st,setSt]=useState(lw2load);
  const [toast,setToast]=useState('');
  const first=React.useRef(true);
  useEffect(()=>{ if(first.current){first.current=false;return;} try{st.updatedAt=Date.now();localStorage.setItem(LW2_LS,JSON.stringify(st));}catch(e){} if(window.__lw2Sync)window.__lw2Sync.push(); },[st]);
  useEffect(()=>{ if(!window.PLAT_API)return;
    const p=new URLSearchParams(location.search);const biz=p.get('biz')||'demo-laborwin2';
    const sync=PLAT_API.attach({biz,type:'laborwin',key:'laborwin2',read:()=>lw2load(),write:(b)=>{try{localStorage.setItem(LW2_LS,JSON.stringify(b));}catch(e){}},onRemote:(b)=>setSt(b),stamp:(b)=>(b&&b.updatedAt)||0});
    window.__lw2Sync=sync; return ()=>{try{sync.stop();}catch(e){} window.__lw2Sync=null;};
  },[]);
  const flash=(m)=>{setToast(m);setTimeout(()=>setToast(''),1700);};
  const up=(fn)=>setSt(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);return n;});
  const R=[{id:'shop',e:'🏪',l:'แม่ค้า',c:'shop'},{id:'worker',e:'👷',l:'แรงงาน',c:'worker'},{id:'win',e:'🎽',l:'หัวหน้าวิน',c:'win'},{id:'market',e:'🏛️',l:'ทะเบียนตลาด',c:'market'}];
  const w=st.workers.find(x=>x.id===MEW);
  const eff=effSwitches(w,HHMM());
  const nOffer=(eff.market?st.winQueue.filter(j=>j.win_id===w.win_id&&j.status==='queued').length:0)+(eff.outside?st.openPool.filter(j=>j.status==='open').length:0);
  return (<>
    <div className="head">
      <span className="kick">🎽 Labor Win v2 · market-optional</span>
      <h1>วินแรงงาน · 4 บทบาท เชื่อมกันจริง</h1>
      <p>ตลาดไม่ต้องสมัคร (market_id = โค้ดสถานที่) · แรงงาน 2 สวิตช์อิสระ (งานตลาด/งานนอก) · หัวคิวเห็นแค่ยอดรวม · ค่าคอมวิน 2%</p>
    </div>
    <div className="phone"><div className="screen">
      {role==='shop'&&<Shop st={st} up={up} flash={flash}/>}
      {role==='worker'&&<Worker st={st} up={up} flash={flash}/>}
      {role==='win'&&<Win st={st} up={up} flash={flash}/>}
      {role==='market'&&<MarketDir st={st} up={up} flash={flash}/>}
      {toast&&<div className="toast">{toast}</div>}
      <div className="tabbar">{R.map(r=><button key={r.id} className={(role===r.id?'on '+r.c:'')} onClick={()=>setRole(r.id)}>
        <span className="e">{r.e}{r.id==='worker'&&nOffer>0&&<span className="badge">{nOffer}</span>}</span>{r.l}</button>)}</div>
    </div></div>
  </>);
}
ReactDOM.createRoot(document.getElementById('mount')).render(<Root/>);
</script>
