<script>(function(){var m=document.querySelector('meta[name=build]'),V=m?m.content:"";try{var K="kd_build_v1",old=localStorage.getItem(K);if(V&&old!==V){localStorage.setItem(K,V);if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});}}catch(e){}if("serviceWorker" in navigator&&location.protocol==="https:"){var r=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(r)return;r=true;location.reload()});addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v="+V).then(function(g){try{g.update()}catch(e){}if(g.waiting)try{g.waiting.postMessage("skip")}catch(e){}}).catch(function(){})})}addEventListener("DOMContentLoaded",function(){try{var b=document.createElement("div");b.textContent="v "+V;b.style.cssText="position:fixed;left:5px;bottom:3px;z-index:99999;font:10px ui-monospace,monospace;color:#9aa3a8;opacity:.55;pointer-events:none";document.body.appendChild(b)}catch(e){}})})();</script>

<body>
<div id="root"></div>
<script type="text/babel" src="fitness-data.jsx?v=p2-20260730m"></script>
<script type="text/babel" src="platform-api.jsx?v=p2-20260730m"></script>
<script type="text/babel" src="kaidee-board.jsx?v=p2-20260730m"></script>
<script type="text/babel">
// ── shims ให้ jอครัว KaiDee (KitchenBoard/QueueBoard) ทำงานบนข้อมูลฟิตเนส ──
window.useT = ()=>({ lang:(function(){ try{ return localStorage.getItem('kd_fit_lang')||'th'; }catch(e){ return 'th'; } })() });
window.CHANNELS = {
  app:     { th:'สั่งผ่านแอปสมาชิก', en:'Member app', c:'#0E9C88', prefix:'A' },
  kiosk:   { th:'ตู้สั่งเอง (Kiosk)', en:'Kiosk',      c:'#E8992F', prefix:'K' },
  counter: { th:'เคาน์เตอร์',        en:'Counter',    c:'#2E6BE6', prefix:'C' },
};
const F = window.FIT;

// แปลง order ฟิตเนส → รูปแบบที่ KitchenBoard/QueueBoard คาดหวัง (ใช้เอนจินเดิมทั้งดุ้น)
function buildStore(d, patchOrder){
  const products = d.products||[];
  const menu = products.map(p=>({ id:p.id, th:p.name, en:p.name }));
  const extra = {};
  const active = (d.orders||[]).filter(o=>['new','cooking','ready'].includes(o.status||'new'));
  const sorted = [...active].sort((a,b)=>(a.at||0)-(b.at||0));
  const numMap = {}; sorted.forEach((o,i)=>{ numMap[o.id]=i+1; });
  const orders = (d.orders||[]).map(o=>{
    const items = (o.items||[]).map(it=>{ const id = it.productId || ('x-'+(it.name||'')); if(!products.find(p=>p.id===id) && !extra[id]){ extra[id]={ id, th:it.name||'สินค้า', en:it.name||'item' }; } return [id, it.qty||1, it.opt||'']; });
    return { ...o, status:o.status||'new', channel:o.via||'app', qnum:(numMap[o.id]||o.qnum||o.no), customer:o.memberName||'', createdAt:o.at, items };
  });
  return { orders, menu:menu.concat(Object.values(extra)), shop:{ name:(d.gym&&d.gym.name)||'ฟิตเนส' }, chanCfg:{}, patchOrder };
}

function App(){
  const [d,setD] = React.useState(()=>F.load());
  React.useEffect(()=>{ const t=setInterval(()=>setD(F.load()), 3000); return ()=>clearInterval(t); },[]); // poll: รับออเดอร์ใหม่จากหน้าขาย
  // ซิงค์ข้ามเครื่องผ่าน backend — จอที่เปิดจากลิงก์แชร์รับออเดอร์จากหน้าขายอีกเครื่อง
  React.useEffect(()=>{
    if(!window.PLAT_API) return;
    const p=new URLSearchParams(location.search);
    const biz=p.get('shop')||(F.load().gym||{}).id||'demo-gym';
    const sync=window.PLAT_API.attach({ biz, type:'fitness', key:'fitness', read:()=>F.load(), write:(b)=>F.save(b), onRemote:(b)=>setD(b), stamp:(b)=>(b&&b.updatedAt)||0 });
    window.__fitSync=sync;
    return ()=>{ try{sync.stop();}catch(e){} window.__fitSync=null; };
  },[]);
  const patchOrder = (id,patch)=> setD(()=>{ const dd=F.load(); const o=(dd.orders||[]).find(x=>x.id===id); if(o){ Object.assign(o,patch); F.save(dd); if(window.__fitSync) window.__fitSync.push(); } return dd; });
  const store = buildStore(d, patchOrder);
  const role = new URLSearchParams(location.search).get('role');
  const key = role==='board' ? 'board' : 'kds';
  const has = !window.FIT || !window.FIT.fitHasAddon || window.FIT.fitHasAddon(d,key);
  if(!has){
    const ad=(window.FIT&&window.FIT.ADDONS&&window.FIT.ADDONS[key])||{name:key==='board'?'จอคิวหน้าร้าน':'KDS จอครัว',price:key==='board'?190:290,icon:key==='board'?'📺':'👨‍🍳'};
    return <div style={{minHeight:'100vh',display:'grid',placeItems:'center',padding:'24px',background:'#0b0e13',color:'#e7ecf3',fontFamily:'system-ui,sans-serif'}}><div style={{maxWidth:420,textAlign:'center',background:'#151a22',border:'1px solid #263041',borderRadius:18,padding:'32px 26px'}}><div style={{fontSize:52,lineHeight:1}}>{ad.icon}</div><div style={{fontSize:24,fontWeight:800,marginTop:14}}>ยังไม่เปิดใช้ add-on นี้</div><div style={{fontSize:16,color:'#9fb0c6',marginTop:10,lineHeight:1.6}}>{ad.name} เป็น add-on เสริม ฿{ad.price}/เดือน<br/>เปิดใช้ได้ที่แอปร้าน: <b style={{color:'#e7ecf3'}}>เพิ่มเติม › {ad.name}</b></div><div style={{fontSize:13,color:'#6f7f95',marginTop:18}}>เปิดแล้วรีเฟรชหน้านี้อีกครั้ง</div></div></div>;
  }
  return role==='board' ? <window.QueueBoard store={store}/> : <window.KitchenBoard store={store}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
