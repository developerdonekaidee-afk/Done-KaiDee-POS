<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730k">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="omelette-owns-print" content="1">
<title>เอกสารร้านค้า — KaiDee POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--brand:#0E9C88;--brand-ink:#0A6E60;--ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--bg:#EEF2F0;--hair:#DCE4E1;--font:"IBM Plex Sans Thai",system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{color:var(--brand-ink);}a:hover{color:var(--brand);}
  .bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px;padding:11px 16px;}
  .bar .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(152deg,#14A886,#1E73B0);display:flex;align-items:center;justify-content:center;font-size:17px;}
  .bar b{font-size:14.5px;} .bar .sub{font-size:11.5px;color:var(--ink-3);}
  .bar .sp{flex:1;}
  .btn{border:none;border-radius:10px;padding:9px 15px;font-family:var(--font);font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn.pri{background:var(--brand);color:#fff;} .btn.gh{background:#EAF3F0;color:var(--brand-ink);}
  .wrap{max-width:820px;margin:22px auto 60px;padding:0 16px;}
  .paper{background:#fff;border-radius:6px;box-shadow:0 2px 10px rgba(20,40,30,.09);padding:46px 52px;min-height:60vh;}
  .doc-head{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px;}
  .doc-head .logo{width:52px;height:52px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;flex:0 0 auto;}
  .doc-head h1{font-size:19px;font-weight:700;line-height:1.35;}
  .doc-head .shop{font-size:13px;color:var(--ink-2);margin-top:3px;}
  .doc-body{white-space:pre-wrap;font-size:14.5px;line-height:1.9;}
  .foot{margin-top:30px;padding-top:14px;border-top:1px dashed var(--hair);font-size:11px;color:var(--ink-3);line-height:1.6;}
  .miss{background:#FFF7F5;border:1px solid #F3C9C0;color:#9A4634;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.6;}
  @media print{
    @page{size:A4;margin:16mm 14mm;}
    body{background:#fff;} .bar{display:none;} .wrap{margin:0;max-width:none;padding:0;}
    .paper{box-shadow:none;border-radius:0;padding:0;min-height:auto;}
  }
</style>
<script>(function(){var m=document.querySelector('meta[name=build]'),V=m?m.content:"";try{var K="kd_build_v1",old=localStorage.getItem(K);if(V&&old!==V){localStorage.setItem(K,V);if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});}}catch(e){}if("serviceWorker" in navigator&&location.protocol==="https:"){var r=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(r)return;r=true;location.reload()});addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v="+V).then(function(g){try{g.update()}catch(e){}if(g.waiting)try{g.waiting.postMessage("skip")}catch(e){}}).catch(function(){})})}addEventListener("DOMContentLoaded",function(){try{var b=document.createElement("div");b.textContent="v "+V;b.style.cssText="position:fixed;left:5px;bottom:3px;z-index:99999;font:10px ui-monospace,monospace;color:#9aa3a8;opacity:.55;pointer-events:none";document.body.appendChild(b)}catch(e){}})})();</script>
</head>
<body>
<div class="bar">
  <div class="mk" id="barMk">🏪</div>
  <div><b id="barTitle">เอกสารร้านค้า</b><div class="sub" id="barSub">KaiDee POS</div></div>
  <div class="sp"></div>
  <button class="btn gh" id="btnCopy">🔗 คัดลอกลิงก์</button>
  <button class="btn pri" id="btnPrint">⬇ ดาวน์โหลด / พิมพ์</button>
</div>
<div class="wrap"><div class="paper" id="paper"></div></div>

<script src="doc-templates.js?v=p2-20260730k"></script>
<script>
  function qp(k){ return new URLSearchParams(location.search).get(k)||''; }
  var docId = qp('doc')||'pdpa';
  var shop = {
    name: qp('name'), address: qp('addr'), phone: qp('phone'),
    partner: qp('partner'),
    pay: { shopName: qp('name'), taxId: qp('tax'), taxAddr: qp('addr'), phone: qp('phone') }
  };
  var tpl = (window.KD_DOC && window.KD_DOC.byId(docId)) || null;
  var paper = document.getElementById('paper');
  if(!tpl){
    document.getElementById('barTitle').textContent = 'ไม่พบเอกสาร';
    paper.innerHTML = '<div class="miss">ไม่พบเอกสารที่ต้องการ — ลิงก์อาจไม่ถูกต้อง หรือร้านยังไม่ได้เผยแพร่เอกสารนี้</div>';
  } else {
    var v = window.KD_DOC.vars(shop);
    var filledTitle = window.KD_DOC.fill(tpl.title, v);
    var filledBody = window.KD_DOC.fill(tpl.body, v);
    document.getElementById('barTitle').textContent = filledTitle;
    document.getElementById('barMk').textContent = qp('emoji')||'🏪';
    document.getElementById('barSub').textContent = (v['ชื่อร้าน']||'KaiDee POS');
    document.title = filledTitle + ' — ' + (v['ชื่อร้าน']||'');
    paper.innerHTML =
      '<div class="doc-head"><div class="logo">'+ (qp('emoji')||'🏪') +'</div>'+
      '<div><h1></h1><div class="shop"></div></div></div>'+
      '<div class="doc-body"></div>'+
      '<div class="foot">เอกสารนี้จัดทำผ่านระบบ KaiDee POS เป็นแม่แบบเพื่ออำนวยความสะดวก '+
      'มิใช่คำแนะนำทางกฎหมาย ร้านค้าควรตรวจทาน/ปรับให้เหมาะกับธุรกิจของตนก่อนใช้จริง</div>';
    paper.querySelector('h1').textContent = filledTitle;
    paper.querySelector('.shop').textContent = (v['ชื่อร้าน']||'') + (v['เบอร์']&&v['เบอร์']!=='—'?(' · โทร '+v['เบอร์']):'');
    paper.querySelector('.doc-body').textContent = filledBody;
  }
  document.getElementById('btnPrint').onclick = function(){ window.print(); };
  document.getElementById('btnCopy').onclick = function(){
    try{ navigator.clipboard.writeText(location.href); this.textContent='✓ คัดลอกแล้ว'; var b=this; setTimeout(function(){ b.textContent='🔗 คัดลอกลิงก์'; },1500); }catch(e){}
  };
</script>
</body>
</html>
