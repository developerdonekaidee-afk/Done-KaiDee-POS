<body>
<div class="top">

<p>กดปุ่มที่ <b>ไฮไลต์</b> บนจอ หรือกด “ถัดไป” เพื่อดูวิธีใช้ทีละขั้น</p>

<script>
var STEPS=[
 {badge:'🚪',tip:'จอเช็คอินหน้าประตู — สมาชิกแตะมือถือที่สติกเกอร์ NFC (แตะวง NFC เพื่อจำลอง)',focus:'#nfc-btn',hint:'แตะเช็คอิน',
  side:{h:'เช็คอินหน้าประตู',p:'แค่แตะมือถือที่สติกเกอร์ NFC — ไม่ต้องมีเครื่องสแกน ไม่ต้องเปิดแอป',f:['🏷️ สติกเกอร์ NFC ถูกหลักร้อย','📷 หรือสแกน QR แทนได้','⚡ รู้ตัวตนใน 1 วินาที']}},
 {badge:'✅',tip:'สมาชิกแพ็ก active → ไฟเขียว เข้าได้ทันที + บันทึกเวลาเข้า',focus:null,
  side:{h:'คัดกรองอัตโนมัติ',p:'แพ็กยังไม่หมด = เขียวเข้าได้ · หมดอายุ = แดง เด้งให้ต่อ',f:['🟢 active = เข้าได้','📒 บันทึกเวลาเข้า','📊 นับคนเข้า/ชั่วโมงพีค']}},
 {badge:'🔴',tip:'อีกคนแตะ — แพ็กหมดอายุ! ระบบขึ้นแดง กันเข้า + เด้งปุ่มต่ออายุ (แตะ “ต่ออายุ”)',focus:'#renew-btn',hint:'แตะต่ออายุ',
  side:{h:'หมดอายุ = ต่อได้เลย',p:'ไม่ต้องรอเคาน์เตอร์ — สมาชิกกดต่ออายุจ่ายในแอปเอง จ่ายเสร็จเข้าได้ทันที',f:['🔴 หมดอายุ = กันเข้า','🔄 ต่ออายุในแอปเอง','⏱️ จ่ายเสร็จเข้าได้เลย']}},
 {badge:'🎫',tip:'เลือกแพ็กที่จะต่อ (แตะ “รายเดือน”) — จ่ายพร้อมเพย์ในแอปได้เลย',focus:'#pk-1',hint:'เลือกแพ็ก',
  side:{h:'ซื้อ/ต่อแพ็กเอง',p:'รายเดือน · รายปี · แพ็กคลาส · เข้าครั้ง — สมาชิกซื้อเองผ่านมือถือ',f:['🎫 หลายแบบแพ็ก','💳 จ่ายพร้อมเพย์','🔔 เตือนใกล้หมดอัตโนมัติ']}},
 {badge:'💳',tip:'จ่ายพร้อมเพย์ — สแกน QR (จำลองจ่ายแล้ว)',focus:'#paid-btn',hint:'จ่ายแล้ว',
  side:{h:'จ่ายในแอป',p:'QR PromptPay ตามยอด — จับยอดอัตโนมัติ ต่ออายุให้ทันที',f:['💳 QR อัตโนมัติ','✅ ต่ออายุทันทีที่จ่าย','🧾 ใบเสร็จ + ประวัติ']}},
 {badge:'🎉',tip:'ต่ออายุสำเร็จ — สมาชิกกลับมาแตะเข้าได้ทันที ไฟเขียว',focus:null,
  side:{h:'กลับมาเขียวทันที',p:'จ่ายเสร็จ = แพ็ก active ต่อ — แตะเข้าได้เลย ไม่ต้องรอ',f:['🟢 active ต่อทันที','📲 ใบเสร็จเข้า LINE','🏋️ พร้อมออกกำลัง']}},
 {badge:'📊',tip:'ครบวงจร — เจ้าของเห็นสมาชิก active/หมดอายุ · คนเข้าต่อวัน · คลาส · ขายของ · รายได้ในแอปเดียว — กด “เริ่มใหม่”',focus:null,done:true,
  side:{h:'เจ้าของเห็นทุกอย่าง',p:'สมาชิก · เช็คอิน · คลาส · เทรนเนอร์ · ขายของ · บัญชี — เอนจินเดียวกับ POS/ตลาด',f:['📊 สมาชิก active/หมดอายุ','📅 คลาส + เทรนเนอร์','🥤 ขายของในยิม (POS)']}}
];
var step=0;
function head(s1,s2,bg){ return '<div class="hd"'+(bg?' style="background:'+bg+'"':'')+'><div class="s1">'+s1+'</div><div class="s2">'+s2+'</div></div>'; }
function screenHTML(){
  var st=STEPS[step];
  if(step===0) return head('ประตูฟิตเนส · Human Fit','แตะมือถือเพื่อเช็คอิน','#1f2a24')+
    '<div class="body"><div class="status"><div class="nfc" id="nfc-btn">📲</div><div class="t">แตะบัตร / สแกน</div><div class="s">แตะมือถือที่สติกเกอร์ NFC<br>หรือสแกน QR ที่ประตู</div></div></div>';
  if(step===1) return '<div class="hd" style="background:linear-gradient(135deg,#0E7C4E,#1DB954)"><div class="s1">เช็คอินสำเร็จ</div><div class="s2">ยินดีต้อนรับ 🎉</div></div>'+
    '<div class="body"><div class="status"><div class="big">✅</div><div class="t">คุณสมชาย · เข้าได้</div><div class="s">แพ็กรายเดือน · เหลือ 12 วัน<br>บันทึกเวลาเข้า 18:24 ✓</div><span class="tag ok">🟢 สมาชิก active</span></div></div>';
  if(step===2) return '<div class="hd" style="background:linear-gradient(135deg,#8a1d1d,#C0392B)"><div class="s1">เช็คอิน</div><div class="s2">ต้องต่ออายุ ⚠️</div></div>'+
    '<div class="body"><div class="status"><div class="big">🔴</div><div class="t">คุณมาลี · แพ็กหมดอายุ</div><div class="s">รายเดือน · หมดเมื่อ 3 วันก่อน<br>ต่ออายุเพื่อเข้าใช้บริการ</div></div><button class="btn" id="renew-btn" style="background:var(--red)">🔄 ต่ออายุเลย</button></div>';
  if(step===3) return head('ต่ออายุสมาชิก','เลือกแพ็ก')+
    '<div class="body"><div class="pkg">'+
      '<div class="pk1"><div class="rowc"><b>รายสัปดาห์</b><span>฿199</span></div></div>'+
      '<div class="pk1 on" id="pk-1"><div class="rowc"><b>รายเดือน ⭐</b><span style="color:var(--brand-2);font-weight:800">฿790</span></div><div style="font-size:12px;color:var(--ink-3);margin-top:3px">ยอดนิยม · เข้าได้ไม่จำกัด 30 วัน</div></div>'+
      '<div class="pk1"><div class="rowc"><b>รายปี</b><span>฿7,900</span></div></div>'+
    '</div><button class="btn" style="margin-top:auto">จ่าย ฿790 →</button></div>';
  if(step===4) return head('จ่ายพร้อมเพย์','฿790')+
    '<div class="body"><div class="qr"></div><div style="text-align:center;font-size:13px;color:var(--ink-3)">สแกนด้วยแอปธนาคาร · ฿790</div><button class="btn" id="paid-btn" style="margin-top:auto">🔔 (จำลอง) จ่ายแล้ว</button></div>';
  if(step===5) return '<div class="hd" style="background:linear-gradient(135deg,#0E7C4E,#1DB954)"><div class="s1">ต่ออายุสำเร็จ</div><div class="s2">พร้อมเข้าใช้ 🎉</div></div>'+
    '<div class="body"><div class="status"><div class="big">🟢</div><div class="t">คุณมาลี · active ต่อ 30 วัน</div><div class="s">แตะเข้าได้ทันที<br>ใบเสร็จส่งเข้า LINE แล้ว</div></div></div>';
  return head('ภาพรวมฟิตเนส','Human Fit')+
    '<div class="body"><div class="status"><div class="big">📊</div><div class="t">ครบวงจรในแอปเดียว</div><div class="s">สมาชิก · เช็คอิน · คลาส · เทรนเนอร์<br>ขายของ · รายได้ · บัญชี</div></div></div>';
}
function sideHTML(){ var s=STEPS[step].side; return '<h3>'+s.h+'</h3><p>'+s.p+'</p><div class="f">'+s.f.map(function(x){return '<div class="fi">'+x+'</div>';}).join('')+'</div>'; }
function render(){
  var st=STEPS[step];
  document.getElementById('scr').innerHTML=screenHTML();
  document.getElementById('side').innerHTML=sideHTML();
  document.getElementById('g-badge').textContent=st.badge;
  document.getElementById('g-step').textContent='ขั้นที่ '+(step+1)+' / '+STEPS.length;
  document.getElementById('g-tip').textContent=st.tip;
  document.getElementById('prog').style.width=((step+1)/STEPS.length*100)+'%';
  document.getElementById('g-prev').disabled=step===0;
  document.getElementById('g-next').textContent=step===STEPS.length-1?'↻ เริ่มใหม่':'ถัดไป →';
  if(st.focus){ var el=document.querySelector(st.focus); if(el){ if(el.id!=='nfc-btn')el.classList.add('pulse'); el.onclick=function(){next();}; var h=document.createElement('div'); h.className='hint'; h.textContent=st.hint||'แตะ'; el.style.position='relative'; el.appendChild(h);} }
}
function next(){ if(step===STEPS.length-1){ step=0; } else { step++; } render(); }
function prev(){ if(step>0){ step--; render(); } }
document.getElementById('g-next').onclick=next;
document.getElementById('g-prev').onclick=prev;
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });
render();
</script>
