<!DOCTYPE html>
<html lang="th">
<head>
<script src="gate.js?v=p2-20260730j"></script>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730j">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรแกรมตลาด — KaiDee Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --brand:#0E9C88;--brand-ink:#0A6E60;--brand-soft:#E3F5F1;--brand-softer:#EFFAF7;
    --blue:#1E73B0;--blue-ink:#155a8c;--blue-soft:#E6F0F8;
    --hero:linear-gradient(152deg,#14A886 0%,#1E73B0 100%);
    --gold:#E8992F;--gold-soft:#FDF0E2;--danger:#E0533D;--danger-soft:#FCEEEA;
    --green:#1E9E6A;--green-soft:#E4F5EC;--yellow:#C88A12;--yellow-soft:#FCF3DE;--red:#D8452F;--red-soft:#FBEAE6;
    --plum:#7a4a8c;--plum-soft:#f0e9f3;
    --ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--bg:#F4F7F6;--card:#fff;
    --hair:#E9EEEC;--hair-2:#DCE4E1;--sidebar:#0E2A2A;
    --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 16px rgba(20,40,30,.05);
    --font:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  .num{font-variant-numeric:tabular-nums;} .mono{font-family:var(--mono);}
  button{font-family:var(--font);cursor:pointer;}
  input,select{font-family:var(--font);font-size:14px;}
  a{color:var(--brand-ink);text-decoration:none;} a:hover{color:var(--brand);}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:#cdd6d2;border-radius:6px;border:2px solid var(--bg);}
  .fade{animation:fade .3s ease both;}@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .app{display:flex;min-height:100vh;}
  .side{width:246px;flex:0 0 auto;background:var(--sidebar);color:#cfe6df;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
  .logo{display:flex;align-items:center;gap:11px;padding:4px 8px 8px;}
  .logo-mk{width:40px;height:40px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;padding:5px;}
  .logo-mk img{width:100%;height:100%;object-fit:contain;}
  .logo-tx{font-weight:700;font-size:15.5px;color:#fff;line-height:1.15;}
  .logo-tx small{display:block;font-weight:500;font-size:11.5px;color:#8fb3aa;}
  .roleswitch{margin:8px 4px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px;}
  .roleswitch .rl-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#7ea299;font-weight:700;padding:3px 8px 6px;}
  .roleswitch button{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;color:#9cbcb2;text-align:left;padding:8px 9px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:2px;}
  .roleswitch button .rc{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto;}
  .roleswitch button:hover{background:rgba(255,255,255,.05);color:#eafaf4;}
  .roleswitch button.on{background:rgba(255,255,255,.1);color:#fff;}
  .nav{border:none;background:none;color:#9cbcb2;text-align:left;width:100%;padding:11px 13px;border-radius:11px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:11px;margin-bottom:3px;transition:background .15s,color .15s;}
  .nav:hover{background:rgba(255,255,255,.06);color:#eafaf4;}
  .nav.on{background:var(--brand);color:#fff;}
  .nav .ic{font-size:17px;width:20px;text-align:center;}
  .navgrp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#6c9086;font-weight:700;padding:14px 13px 6px;}
  .nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;}
  .side-foot{margin-top:auto;font-size:11px;color:#7ea299;padding:12px 10px 2px;border-top:1px solid rgba(255,255,255,.08);}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{min-height:66px;flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;position:sticky;top:0;z-index:20;flex-wrap:wrap;}
  .content{padding:24px 28px 60px;max-width:1320px;width:100%;}
  h1{font-size:22px;font-weight:700;margin:0;}
  .sub{font-size:13px;color:var(--ink-3);margin-top:3px;}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--hair);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
  .kpi{padding:16px 18px;}
  .kpi .lbl{font-size:12.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:6px;}
  .kpi .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.02em;}
  .kpi .foot{font-size:12px;font-weight:600;margin-top:4px;color:var(--ink-3);}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:18px;}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media (max-width:1000px){.grid2,.grid2b{grid-template-columns:1fr;}}
  .panel{padding:18px 20px;}
  .panel h3{margin:0 0 14px;font-size:15px;font-weight:700;}
  .panel h3 .r-lnk{float:right;font-size:12.5px;font-weight:600;color:var(--brand-ink);}
  .barrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;}
  .barrow .bl{flex:0 0 34%;color:var(--ink-2);font-weight:600;}
  .bartrack{flex:1;height:9px;border-radius:5px;background:var(--brand-softer);overflow:hidden;}
  .barfill{height:100%;border-radius:5px;background:var(--brand);}
  .barrow .bv{flex:0 0 auto;font-weight:700;min-width:74px;text-align:right;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;padding:11px 14px;border-bottom:1px solid var(--hair);white-space:nowrap;background:var(--card);}
  td{padding:12px 14px;border-bottom:1px solid var(--hair);font-size:13.5px;vertical-align:middle;}
  tr.row{cursor:pointer;transition:background .12s;}
  tr.row:hover{background:var(--brand-softer);}
  .r{text-align:right;} .c{text-align:center;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .p-g{background:var(--green-soft);color:var(--green);}
  .p-y{background:var(--yellow-soft);color:var(--yellow);}
  .p-r{background:var(--red-soft);color:var(--red);}
  .p-b{background:var(--blue-soft);color:var(--blue-ink);}
  .p-plum{background:var(--plum-soft);color:var(--plum);}
  .p-n{background:#EEF1F0;color:var(--ink-2);}
  .btn{border:none;border-radius:10px;padding:9px 15px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:filter .15s,transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn.pri{background:var(--brand);color:#fff;} .btn.pri:hover{filter:brightness(1.06);}
  .btn.gh{background:var(--card);color:var(--ink-2);border:1px solid var(--hair-2);} .btn.gh:hover{border-color:var(--brand);color:var(--brand-ink);}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .btn.dngh{background:#fff;color:var(--danger);border:1px solid #f3cfc7;} .btn.dngh:hover{background:var(--danger-soft);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .seg{display:inline-flex;background:#EEF1F0;border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);}
  .seg button.on{background:#fff;color:var(--brand-ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .field{border:1px solid var(--hair-2);border-radius:10px;padding:9px 12px;background:#fff;outline:none;width:100%;}
  .field:focus{border-color:var(--brand);}
  label.lb{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:12px 0 6px;}
  .chkrow{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;}
  .chkline{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;}
  .chkline input{width:18px;height:18px;accent-color:var(--brand);}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar .grow{flex:1;min-width:120px;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease;}
  .modal{background:var(--card);border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-h{position:sticky;top:0;background:#fff;padding:20px 24px 14px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;z-index:2;}
  .modal-h h3{margin:0;font-size:18px;font-weight:700;}
  .modal-h .x{border:none;background:#EEF1F0;width:32px;height:32px;border-radius:9px;font-size:16px;color:var(--ink-2);}
  .modal-b{padding:20px 24px 24px;}
  .empty{text-align:center;color:var(--ink-3);padding:44px 20px;font-size:14px;}
  .note{border-radius:12px;padding:13px 16px;font-size:13.5px;line-height:1.5;}
  .note.g{background:var(--brand-softer);color:var(--brand-ink);border:1px solid #cfeae4;}
  .note.gold{background:var(--gold-soft);color:#8a5a10;border:1px solid #f0d8b0;}
  .note.blue{background:var(--blue-soft);color:var(--blue-ink);border:1px solid #cfe0ef;}
  .note.red{background:var(--danger-soft);color:var(--danger);border:1px solid #f3cfc7;}
  /* stall grid */
  .stallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .stall{border:1px solid var(--hair-2);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .12s,transform .1s;background:#fff;position:relative;}
  .stall:hover{border-color:var(--brand);transform:translateY(-2px);}
  .stall .sc{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.02em;}
  .stall .sn{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stall .sm{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .stall .sbadge{position:absolute;top:12px;right:12px;}
  .stall.vac{background:repeating-linear-gradient(135deg,#fafbfb,#fafbfb 9px,#f2f4f3 9px,#f2f4f3 18px);border-style:dashed;}
  .stall.vac .sc{color:var(--ink-3);}
  .stall.locked{border-color:#f0c9c0;box-shadow:0 0 0 3px var(--danger-soft) inset;}
  .zone-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
  .zone-h .zt{font-size:11.5px;color:var(--ink-3);font-weight:600;}
  /* qr box */
  .qrbox{display:flex;gap:18px;align-items:center;background:var(--brand-softer);border:1px solid #cfeae4;border-radius:14px;padding:18px;}
  .qrimg{width:120px;height:120px;flex:0 0 auto;background:#fff;border-radius:12px;padding:8px;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;}
  .qrimg svg{width:100%;height:100%;}
  .meterrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--hair);font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-2);} .kv .v{font-weight:700;}
  .kv.total{border-top:2px solid var(--ink);border-bottom:none;padding-top:12px;margin-top:4px;font-size:16px;}
  .feed{display:flex;flex-direction:column;}
  .feeditem{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair);}
  .feeditem .fi-ic{width:34px;height:34px;border-radius:10px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;}
  .feeditem .fi-b{flex:1;min-width:0;} .feeditem .fi-t{font-size:13.5px;font-weight:600;}
  .feeditem .fi-s{font-size:12px;color:var(--ink-3);margin-top:1px;}
  .feeditem .fi-v{font-weight:700;color:var(--green);font-family:var(--mono);}
  .lockbanner{background:var(--sidebar);color:#dbeee7;border-radius:18px;padding:34px 30px;text-align:center;}
  .lockbanner .lk{font-size:44px;}
  .lockbanner h2{color:#fff;margin:14px 0 8px;font-size:24px;}
  .lockbanner p{color:#9fc0b6;max-width:560px;margin:0 auto;font-size:14.5px;line-height:1.6;}
  .modtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:7px;background:var(--brand-soft);color:var(--brand-ink);text-transform:uppercase;}
  @media (max-width:820px){
    .app{flex-direction:column;}
    .side{width:100%;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:6px;}
    .side .logo{padding:4px 6px;flex:0 0 auto;} .side-foot,.roleswitch .rl-h{display:none;}
    .roleswitch{display:flex;margin:0;padding:4px;flex:0 0 auto;} .roleswitch button{width:auto;white-space:nowrap;}
    .side .nav{width:auto;flex:0 0 auto;margin-bottom:0;white-space:nowrap;padding:9px 12px;}
    .content{padding:16px;} .qrbox{flex-direction:column;}
  }
</style>
</head>
