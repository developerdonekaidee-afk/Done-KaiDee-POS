<style>
  :root{
    --brand:#12A56E; --brand-ink:#0B7A50; --brand-soft:#E7F6EF; --brand-softer:#F1FAF5;
    --line-green:#06C755; --ink:#1B2420; --ink-2:#57635C; --ink-3:#8A948E;

    --r:18px; --font:"IBM Plex Sans Thai",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ font-family:var(--font); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; min-height:100vh; }
  a{color:var(--brand-ink);} a:hover{color:var(--brand);}
  .wrap{ max-width:560px; margin:0 auto; padding:32px 20px 60px; }
  .logo{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .logo-mark{ width:44px; height:44px; border-radius:13px; background:var(--brand);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; }
  h1{ font-size:26px; margin:18px 0 4px; letter-spacing:-.02em; }
  .sub{ color:var(--ink-2); font-size:15px; margin-bottom:26px; line-height:1.5; }
  .card{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:22px; margin-bottom:16px; }
  label{ display:block; font-size:13.5px; font-weight:600; margin:14px 0 6px; }
  label:first-child{ margin-top:0; }
  .hint{ font-size:12.5px; color:var(--ink-3); font-weight:400; margin-top:4px; }
  input,select{ width:100%; border:1.5px solid var(--hair-2); border-radius:12px; padding:12px 14px;
    font-size:15px; font-family:var(--font); background:#fff; color:var(--ink); outline:none; transition:border .15s; }
  input:focus,select:focus{ border-color:var(--brand); }
  .row{ display:flex; gap:12px; } .row>*{ flex:1; }
  .btn{ width:100%; border:none; cursor:pointer; border-radius:14px; padding:15px; font-size:16px;
    font-weight:700; font-family:var(--font); background:var(--brand); color:#fff; margin-top:22px;
    transition:filter .15s, transform .1s; }
  .btn:hover{ filter:brightness(1.05); } .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .emoji-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .emoji-btn{ width:44px; height:44px; border-radius:12px; border:1.5px solid var(--hair-2);
    background:#fff; font-size:22px; cursor:pointer; }
  .emoji-btn.on{ border-color:var(--brand); background:var(--brand-soft); }
  .step{ display:flex; gap:13px; margin-bottom:16px; }
  .step-n{ width:28px; height:28px; border-radius:999px; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
  .step-b{ font-size:14.5px; line-height:1.55; color:var(--ink-2); }
  .step-b b{ color:var(--ink); }
  .urlbox{ display:flex; align-items:center; gap:8px; background:var(--brand-softer); border:1px solid var(--hair);
    border-radius:12px; padding:10px 12px; margin-top:8px; }
  .urlbox code{ font-family:var(--mono); font-size:12.5px; color:var(--brand-ink); word-break:break-all; flex:1; }
  .copy{ border:none; background:var(--brand); color:#fff; border-radius:9px; padding:7px 12px;
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--font); white-space:nowrap; }
  .err{ color:#C0392B; font-size:13.5px; margin-top:10px; }
  .ok-badge{ width:74px; height:74px; border-radius:999px; background:var(--brand-soft); color:var(--brand);
    display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 14px; }
