<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730k">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เช็คอินสมาชิก — Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<!-- ⚠️ ไม่โหลด gate.js โดยตั้งใจ — หน้านี้คือจอเช็คอินหน้าประตู ต้องใช้ได้โดยไม่ถามรหัส -->
<style>
  :root{
    --brand:#0E9C88;--brand-ink:#0A6E60;--brand-soft:#E3F5F1;--brand-softer:#EFFAF7;
    --green:#12945E;--green-d:#0C6E46;--red:#D8452F;--red-d:#A62E1D;--gold:#E8992F;
    --ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--card:#fff;--hair:#E9EEEC;--hair-2:#DCE4E1;
    --font:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--font);background:#0A1F1C;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
  select{font-family:var(--font);font-size:15px;}
  .num{font-variant-numeric:tabular-nums;}.mono{font-family:var(--mono);}
  #root{height:100vh;}
  .kiosk{height:100vh;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% 0%,#0F3B33 0%,#0A1F1C 62%);}
  .topbar{flex:0 0 auto;padding:26px 30px 0;display:flex;align-items:center;justify-content:space-between;color:#fff;}
  .tb-gym{display:flex;align-items:center;gap:12px;min-width:0;}
  .tb-gym .em{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
  .tb-gym .nm{font-size:19px;font-weight:700;line-height:1.15;}
  .tb-gym .sub{font-size:12.5px;opacity:.7;font-weight:600;margin-top:1px;}
  .tb-clock{text-align:right;font-family:var(--mono);}
  .tb-clock .t{font-size:26px;font-weight:600;color:#fff;letter-spacing:.02em;}
  .tb-clock .d{font-size:12px;opacity:.65;color:#fff;margin-top:2px;font-family:var(--font);font-weight:600;}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;min-height:0;overflow:auto;}
  .panel{width:100%;max-width:560px;text-align:center;}
  /* idle */
  .idle{animation:fade .3s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .tapwrap{position:relative;width:230px;height:230px;margin:0 auto 30px;display:flex;align-items:center;justify-content:center;}
  .tapwrap .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:pulse 2.4s ease-out infinite;}
  .tapwrap .ring:nth-child(2){animation-delay:.8s;}.tapwrap .ring:nth-child(3){animation-delay:1.6s;}
  @keyframes pulse{0%{transform:scale(.55);opacity:.7;}80%{opacity:0;}100%{transform:scale(1);opacity:0;}}
  .tapdisc{width:150px;height:150px;border-radius:50%;background:linear-gradient(150deg,#16C39F,#0A6E60);display:flex;align-items:center;justify-content:center;font-size:74px;box-shadow:0 18px 50px rgba(0,0,0,.4);position:relative;z-index:2;}
  .idle h1{color:#fff;font-size:34px;font-weight:700;letter-spacing:-.01em;}
  .idle p{color:rgba(255,255,255,.62);font-size:16px;margin-top:10px;font-weight:600;line-height:1.5;}
  /* result */
  .result{border-radius:30px;padding:46px 34px 40px;animation:pop .32s cubic-bezier(.2,.9,.3,1) both;box-shadow:0 30px 80px rgba(0,0,0,.45);}
  @keyframes pop{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
  .result.ok{background:linear-gradient(160deg,#14A86F,var(--green-d));}
  .result.no{background:linear-gradient(160deg,#E1543E,var(--red-d));}
  .result .badge{width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:78px;color:#fff;margin:0 auto 22px;font-weight:700;}
  .result .verdict{color:#fff;font-size:34px;font-weight:700;letter-spacing:.01em;}
  .result .nm{color:#fff;font-size:26px;font-weight:700;margin-top:16px;}
  .result .meta{color:rgba(255,255,255,.85);font-size:16px;margin-top:5px;font-weight:600;}
  .result .code{font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.6);margin-top:4px;letter-spacing:.04em;}
  .result .callout{margin-top:22px;background:rgba(255,255,255,.16);border-radius:14px;padding:13px 16px;color:#fff;font-size:15px;font-weight:700;line-height:1.5;}
  .result .cdn{margin-top:20px;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;}
  /* demo strip */
  .demo{flex:0 0 auto;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.08);}
  .demo .lbl{color:rgba(255,255,255,.5);font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;text-align:center;margin-bottom:9px;}
  .demo .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;}
  .chip{border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;background:rgba(255,255,255,.1);color:#fff;display:inline-flex;align-items:center;gap:6px;}
  .chip.ok{background:rgba(18,148,94,.32);}
  .chip.no{background:rgba(216,69,47,.34);}
  .chip:active{transform:scale(.96);}
  .demo select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 14px;font-weight:600;outline:none;max-width:210px;}
  .demo select option{color:#000;}
  .demo .note{color:rgba(255,255,255,.4);font-size:11px;text-align:center;margin-top:9px;font-weight:600;}
  @media(max-width:600px){ .tb-clock .t{font-size:20px;} .tb-gym .nm{font-size:16px;} .idle h1{font-size:26px;} .result{padding:34px 22px 30px;} .result .verdict{font-size:27px;} .result .badge{width:104px;height:104px;font-size:60px;} }
  @media(max-height:640px){ .tapwrap{width:150px;height:150px;margin-bottom:18px;} .tapdisc{width:100px;height:100px;font-size:50px;} .idle h1{font-size:26px;} .idle p{font-size:14px;margin-top:7px;} .topbar{padding-top:16px;} }
</style>
<script>(function(){var m=document.querySelector('meta[name=build]'),V=m?m.content:"";try{var K="kd_build_v1",old=localStorage.getItem(K);if(V&&old!==V){localStorage.setItem(K,V);if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})});}}catch(e){}if("serviceWorker" in navigator&&location.protocol==="https:"){var r=false;navigator.serviceWorker.addEventListener("controllerchange",function(){if(r)return;r=true;location.reload()});addEventListener("load",function(){navigator.serviceWorker.register("sw.js?v="+V).then(function(g){try{g.update()}catch(e){}if(g.waiting)try{g.waiting.postMessage("skip")}catch(e){}}).catch(function(){})})}addEventListener("DOMContentLoaded",function(){try{var b=document.createElement("div");b.textContent="v "+V;b.style.cssText="position:fixed;left:5px;bottom:3px;z-index:99999;font:10px ui-monospace,monospace;color:#9aa3a8;opacity:.55;pointer-events:none";document.body.appendChild(b)}catch(e){}})})();</script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="market-data.jsx?v=p2-20260730k"></script>
<script type="text/babel" src="fitness-data.jsx?v=p2-20260730k"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
(function(){
const F=window.FIT; const { memberStatus, canEnter, B, thTime, thDate, fitVerifyToken } = F;
const qs=new URLSearchParams(location.search);
const firstName=(n)=>String(n||'').split(' ')[0];
const pkgOf=(d,id)=>(d.packages||[]).find(p=>p.id===id);
const HOLD=6000; // ms แสดงผลก่อนกลับหน้าพร้อมเช็คอิน

function Clock(){
  const [t,setT]=useState(Date.now());
  useEffect(()=>{ const id=setInterval(()=>setT(Date.now()),1000); return ()=>clearInterval(id); },[]);
  const dt=new Date(t);
  return (<div className="tb-clock"><div className="t">{String(dt.getHours()).padStart(2,'0')}:{String(dt.getMinutes()).padStart(2,'0')}</div><div className="d">{thDate(dt.toISOString().slice(0,10))}</div></div>);
}

function Kiosk(){
  const [data,setData]=useState(()=>F.load());
  const [result,setResult]=useState(null);
  const [cd,setCd]=useState(0);
  const gymName=qs.get('name')||data.gym.name;
  const okMsg=qs.get('welcome')||data.gym.checkinWelcome||'เข้าได้ ยินดีต้อนรับ';
  const noMsg=qs.get('deny')||data.gym.checkinDeny||'ยังเข้าไม่ได้';
  const wellMsg=qs.get('well')||data.gym.checkinWellness||'ขอให้สุขภาพแข็งแรงนะครับ 💪';
  const timer=useRef(null), cdTimer=useRef(null);

  const reset=()=>{ clearTimeout(timer.current); clearInterval(cdTimer.current); setResult(null); setCd(0); };

  const doCheck=(mid)=>{
    const m=(data.members||[]).find(x=>x.id===mid); if(!m)return;
    const ok=canEnter(m), s=memberStatus(m);
    const nd={...data}; nd.checkins=[...(nd.checkins||[]),{id:'ck-'+Date.now().toString(36),memberId:mid,at:Date.now(),method:qs.get('method')||'nfc',result:ok?'ok':'denied'}];
    F.save(nd); setData(nd);
    setResult({m,ok,s,pk:pkgOf(nd,m.packageId)});
    // auto-return countdown
    clearTimeout(timer.current); clearInterval(cdTimer.current);
    setCd(Math.round(HOLD/1000));
    cdTimer.current=setInterval(()=>setCd(c=>c>0?c-1:0),1000);
    timer.current=setTimeout(reset,HOLD);
  };

  // แสดงหน้าจอปฏิเสธเฉพาะโค้ดหมุนที่แคปไม่ได้ (stale/forged)
  const denyToken=(reason)=>{
    clearTimeout(timer.current); clearInterval(cdTimer.current);
    setResult({tokenFail:true,reason});
    setCd(Math.round(HOLD/1000));
    cdTimer.current=setInterval(()=>setCd(c=>c>0?c-1:0),1000);
    timer.current=setTimeout(reset,HOLD);
  };

  // ตัวรับสแกนจริง: โค้ด FMB. = โทเคนหมุนจากบัตรสมาชิก → ตรวจ sig+รอบเวลา ก่อนเช็คสิทธิ์ · ค่าอื่น = รหัสสมาชิกตรง (สำรอง/พนักงาน)
  const doScan=(raw)=>{
    const v=String(raw||'').trim();
    if(v.indexOf('FMB.')===0){
      const r=fitVerifyToken(data,v);
      if(r.ok) return doCheck(r.memberId);
      return denyToken(r.reason);
    }
    doCheck(v);
  };

  // NFC/QR carrying a member id OR rotating token → auto-check on load (real door usage)
  useEffect(()=>{ const raw=qs.get('code')||qs.get('m')||qs.get('member'); if(raw) doScan(raw); /* eslint-disable-next-line */ },[]);
  useEffect(()=>()=>{ clearTimeout(timer.current); clearInterval(cdTimer.current); },[]);

  const activeSample=(data.members||[]).filter(m=>['active','expiring'].includes(memberStatus(m).key)).slice(0,4);
  const expiredSample=(data.members||[]).find(m=>memberStatus(m).key==='expired');

  return (<div className="kiosk">
    <div className="topbar">
      <div className="tb-gym"><div className="em">🏋️</div><div><div className="nm">{gymName}</div><div className="sub">เช็คอินสมาชิก</div></div></div>
      <Clock/>
    </div>

    <div className="stage">
      {result
        ? (result.tokenFail
          ? <div className="panel" key={'tf'+result.reason}>
              <div className="result no">
                <div className="badge">✕</div>
                <div className="verdict">{result.reason==='stale'?'โค้ดหมดอายุ':'บัตรไม่ถูกต้อง'}</div>
                <div className="meta" style={{marginTop:14,fontSize:'1.05em'}}>{result.reason==='stale'?'นี่คือภาพแคปหน้าจอที่หมดอายุแล้ว':'โค้ดไม่ถูกต้อง/ปลอม'}</div>
                <div className="callout">ให้สมาชิกเปิดบัตรในแอพใหม่ — โค้ดจะหมุนทุก {F.CARD_WIN} วิ · ภาพแคปหน้าจอส่งต่อใช้ไม่ได้</div>
                <div className="cdn">กลับหน้าเช็คอินใน {cd} วินาที · แตะที่ใดก็ได้</div>
              </div>
            </div>
          : <div className={'panel'} key={result.m.id+result.ok}>
            <div className={'result '+(result.ok?'ok':'no')}>
              <div className="badge">{result.ok?'✓':'✕'}</div>
              <div className="verdict">{result.ok?okMsg:noMsg}</div>
              <div className="nm">{result.ok?('คุณ '+result.m.name):result.m.name}</div>
              {result.ok&&wellMsg&&<div style={{marginTop:6,fontSize:'1.02em',fontWeight:600,opacity:.92}}>{wellMsg}</div>}
              <div className="meta">{result.ok
                ? ((result.pk?result.pk.name+' · ':'')+(result.s.key==='expiring'?('เหลือ '+result.s.d+' วัน'):'ใช้งานได้'))
                : (result.s.key==='expired'?('หมดอายุมาแล้ว '+Math.abs(result.s.d)+' วัน'):(result.s.key==='frozen'?'พักสมาชิกชั่วคราวอยู่':result.s.th))}</div>
              <div className="code">{result.m.code}</div>
              {!result.ok&&<div className="callout">กรุณาต่ออายุที่เคาน์เตอร์ หรือจ่ายผ่านแอปได้เลย</div>}
              {result.s.key==='expiring'&&result.ok&&<div className="callout">ใกล้หมดแล้ว — ต่ออายุในแอปได้เลย</div>}
              <div className="cdn">กลับหน้าเช็คอินใน {cd} วินาที · แตะที่ใดก็ได้</div>
            </div>
          </div>)
        : <div className="panel idle">
            <div className="tapwrap"><span className="ring"></span><span className="ring"></span><span className="ring"></span><div className="tapdisc">📶</div></div>
            <h1>แตะบัตร / สแกนเพื่อเข้า</h1>
            <p>แตะโทรศัพท์หรือบัตรสมาชิกที่จุด NFC ตรงประตู<br/>ระบบจะตรวจสิทธิ์ให้อัตโนมัติ</p>
          </div>}
    </div>

    {result
      ? <div className="demo" onClick={reset}><div className="btns"><span className="chip">แตะที่ใดก็ได้เพื่อเช็คอินคนถัดไป</span></div></div>
      : <div className="demo">
          <div className="lbl">จำลองการแตะ (เดโมเท่านั้น)</div>
          <div className="btns">
            {activeSample.map(m=><button key={m.id} className="chip ok" onClick={()=>doScan(F.cardToken(m.id,(data.gym&&data.gym.cardSecret)||'seed',Math.floor(Date.now()/(F.CARD_WIN*1000))))}>🟢 {firstName(m.name)}</button>)}
            {expiredSample&&<button className="chip no" onClick={()=>doScan(F.cardToken(expiredSample.id,(data.gym&&data.gym.cardSecret)||'seed',Math.floor(Date.now()/(F.CARD_WIN*1000))))}>🔴 {firstName(expiredSample.name)}</button>}
            {activeSample[0]&&<button className="chip no" onClick={()=>doScan(F.cardToken(activeSample[0].id,(data.gym&&data.gym.cardSecret)||'seed',Math.floor(Date.now()/(F.CARD_WIN*1000))-3))}>📸 แคปเก่า</button>}
            <select value="" onChange={e=>{ if(e.target.value)doCheck(e.target.value); }}>
              <option value="">ค้นสมาชิก…</option>
              {(data.members||[]).map(m=><option key={m.id} value={m.id}>{m.code} · {m.name}</option>)}
            </select>
          </div>
          <div className="note">หน้าจริงรับโค้ดหมุนจากการแตะ NFC / สแกน QR ที่ประตู — ปุ่ม 📸 จำลองแคปหน้าจอเก่า (ต้องโดนปฏิเสธ)</div>
        </div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Kiosk/>);
})();
</script>
</body>
</html>
