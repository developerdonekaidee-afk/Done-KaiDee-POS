<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730j">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market OS — เดโมกดจริง (หน้าแอปเจ้าของตลาด)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#0E7C4E;--brand-2:#12945C;--brand-soft:#E9F5EE;--gold:#F4900C;--gold-soft:#FEF1E2;--red:#C0392B;--red-soft:#FDECEA;--blue:#2563eb;--ink:#17211b;--ink-2:#4b5a52;--ink-3:#8a978f;--bg:#eef2f0;--line:#dde5e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(140% 100% at 50% 0%,#f6f9f7,#e4ebe7);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--brand)}
.top{padding:18px 20px 10px;text-align:center;flex:0 0 auto}
.top .kick{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:6px 13px;border-radius:100px}
.top h1{font-size:22px;font-weight:800;margin:9px 0 2px;letter-spacing:-.01em}
.top p{margin:0;color:var(--ink-2);font-size:13.5px}
.guide{max-width:820px;margin:8px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 22px rgba(20,60,40,.07)}
.guide .badge{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--brand-soft)}
.guide .g-tx{flex:1;min-width:0;text-align:left}
.guide .g-step{font-size:11.5px;font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
.guide .g-tip{font-size:15px;font-weight:600;margin-top:2px;line-height:1.4;text-wrap:pretty}
.guide .g-nav{flex:0 0 auto;display:flex;gap:8px}
.gbtn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:11px;padding:11px 16px;font-size:14px}
.gbtn.prev{background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.gbtn.next{background:var(--brand);color:#fff}
.gbtn:disabled{opacity:.4;cursor:default}
.prog{max-width:820px;margin:10px auto 0;height:5px;background:#dbe4df;border-radius:100px;overflow:hidden}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:100px;transition:width .35s}
.stage{flex:1;display:flex;gap:34px;justify-content:center;align-items:center;padding:20px 18px 30px;flex-wrap:wrap}
.phone{width:320px;height:650px;background:#0f1720;border-radius:42px;padding:12px;box-shadow:0 26px 60px rgba(14,124,78,.22)}
.screen{width:100%;height:100%;background:#F3F6F4;border-radius:31px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.hd{color:#fff;padding:18px 17px 15px;flex:0 0 auto;background:var(--brand)}
.hd .s1{font-size:13.5px;opacity:.85}
.hd .s2{font-size:21px;font-weight:800;margin-top:1px}
.body{padding:14px;display:flex;flex-direction:column;gap:11px;flex:1;overflow:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.kpi .n{font-size:22px;font-weight:800}
.kpi .l{font-size:12px;color:var(--ink-3);margin-top:1px}
.kpi.g .n{color:var(--brand)}.kpi.r .n{color:var(--red)}.kpi.o .n{color:var(--gold)}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.card{background:#fff;border-radius:13px;padding:12px 13px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.rowc{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:none;cursor:pointer;font-family:inherit;border-radius:13px;padding:14px;text-align:center;font-size:16px;font-weight:800;width:100%;color:#fff;background:var(--brand)}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px}
.tag.paid{background:var(--brand-soft);color:var(--brand)}.tag.due{background:var(--red-soft);color:var(--red)}.tag.new{background:var(--gold-soft);color:var(--gold)}
/* floor plan */
.plan{background:linear-gradient(135deg,#dfeee7,#eef4f1);border-radius:14px;flex:1;position:relative;overflow:hidden;min-height:230px}
.pin{position:absolute;width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.pin i{transform:rotate(-45deg);font-size:12px;font-weight:800;color:#fff;font-style:normal}
.pin.occ{background:var(--brand)}.pin.due{background:var(--red)}.pin.free{background:#9aa8a0}
.nav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line)}
.nav div{flex:1;text-align:center;padding:9px 2px 11px;font-size:10.5px;color:var(--ink-3)}
.nav div.on{color:var(--brand);font-weight:700}
.nav div .ic{font-size:19px;display:block}
.status{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.status .big{font-size:46px}.status .t{font-size:18px;font-weight:800}.status .s{font-size:14px;color:var(--ink-2);line-height:1.5}
.toast{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:9px 15px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:8}
.pulse{animation:pl 1.2s ease-in-out infinite;border-radius:13px}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(14,124,78,.5)}70%{box-shadow:0 0 0 12px rgba(14,124,78,0)}100%{box-shadow:0 0 0 0 rgba(14,124,78,0)}}
.hint{position:absolute;z-index:9;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-140%);left:50%;animation:bob 1.1s ease-in-out infinite}
.hint::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
@keyframes bob{0%,100%{transform:translate(-50%,-140%)}50%{transform:translate(-50%,-160%)}}
.side{max-width:300px;text-align:left;display:none}
@media(min-width:960px){.side{display:block}}
.side h3{font-size:16px;margin:0 0 6px}
.side p{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0}
.side .f{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.side .fi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:9px;align-items:center}
.foot{text-align:center;font-size:12px;color:var(--ink-3);padding:0 20px 18px}
</style>
</head>
<body>
<div class="top">
<span class="kick">🏢 Market OS · เดโมกดจริง</span>
<h1>โปรแกรมบริหารตลาด — บนมือถือเจ้าของตลาด</h1>
<p>กดปุ่มที่ <b>ไฮไลต์</b> บนจอ หรือกด “ถัดไป” เพื่อดูวิธีใช้ทีละขั้น</p>
</div>
<div class="guide">
<div class="badge" id="g-badge">📊</div>
<div class="g-tx"><div class="g-step" id="g-step">ขั้นที่ 1 / 7</div><div class="g-tip" id="g-tip">—</div></div>
<div class="g-nav"><button class="gbtn prev" id="g-prev">← ก่อนหน้า</button><button class="gbtn next" id="g-next">ถัดไป →</button></div>
</div>
<div class="prog"><i id="prog"></i></div>

<div class="stage">
  <div class="phone"><div class="screen" id="scr"></div></div>
  <div class="side" id="side"></div>
</div>
<div class="foot">เดโมสำหรับนำเสนอ — ตลาดสี่มุมเมือง · บิลออนไลน์ + จับยอดอัตโนมัติ + ผังแผงจริง + จองรายวัน</div>

<script>
var STEPS=[
 {tab:'home',badge:'📊',tip:'หน้าแรก — เจ้าของตลาดเห็นภาพรวมทันที: แผงเต็มกี่ %, เก็บได้เท่าไร, ค้างจ่ายกี่ร้าน',focus:null,
   side:{h:'ภาพรวมตลาด',p:'เปิดแอปมาเห็นตัวเลขสำคัญทันที ไม่ต้องเปิดสมุด/Excel',f:['📈 อัตราแผงเต็ม (occupancy)','💰 เก็บได้เดือนนี้','⚠️ ร้านค้างจ่าย']}},
 {tab:'home',badge:'🗺️',tip:'แตะ “ผังแผง” เพื่อดูผังตลาดจริงแบบปักหมุด',focus:'#nav-plan',hint:'แตะผังแผง',
   side:{h:'ผังแผงจริง',p:'อัปโหลดรูปผังตลาดจริง แล้วปักหมุดแต่ละแผง',f:['🟢 มีร้าน','🔴 ค้างจ่าย','⚪ ว่าง (ปล่อยเช่าได้)']}},
 {tab:'plan',badge:'🗺️',tip:'หมุดสีบอกสถานะทุกแผงในพริบตา — แตะหมุดสีแดง (ร้านค้างจ่าย) เพื่อจัดการ',focus:'#pin-due',hint:'แตะหมุดแดง',
   side:{h:'เห็นทั้งตลาดในจอเดียว',p:'สีเขียว=มีร้าน แดง=ค้างจ่าย เทา=ว่าง — รู้ทันทีว่าตรงไหนต้องตาม ตรงไหนปล่อยเช่าได้',f:['แตะหมุด = เปิดข้อมูลร้าน','ลากหมุดจัดตำแหน่งได้','แตะแผงว่าง = ปล่อยเช่า']}},
 {tab:'bill',badge:'🧾',tip:'เห็นบิลค่าเช่า+น้ำไฟของร้านนี้ — กด “ส่งบิล + ทวงผ่าน LINE” ส่งถึงมือร้านทันที',focus:'#bill-btn',hint:'กดส่งบิล',
   side:{h:'ออกบิล + ทวงอัตโนมัติ',p:'ไม่ต้องเดินเก็บ ไม่ต้องเขียนมือ — บิลวิ่งเข้า LINE ร้านพร้อม QR จ่าย',f:['🧾 ค่าเช่า + น้ำ/ไฟ รวมให้','📲 ส่ง/ทวงผ่าน LINE','🔢 แนบ QR PromptPay + เลข VA']}},
 {tab:'money',badge:'💸',tip:'ร้านโอนเข้า “เลข VA” ของตัวเอง → ระบบรู้ทันทีว่าใครจ่าย จับคู่บิลอัตโนมัติ (ไม่ต้องแนบสลิป)',focus:null,
   side:{h:'Virtual Account — รู้ว่าใครจ่าย',p:'แต่ละร้านมีเลขบัญชีเสมือนของตัวเอง เงินเข้าปุ๊บระบบตัดบิลให้ปั๊บ',f:['💳 เงินเข้า = จับคู่บิลเอง','✅ ปลดล็อกแผงอัตโนมัติ','📒 เดินบัญชีครบ ส่งสำนักงานบัญชีได้']}},
 {tab:'daily',badge:'📅',tip:'ตลาดนัด/รายวัน — จองแผงรายวัน เก็บเงินหน้างาน + เช็คอิน + เพิ่ม walk-in ได้',focus:'#daily-btn',hint:'กดเพิ่ม walk-in',
   side:{h:'จองรายวัน (ตลาดนัด)',p:'ปฏิทินจองแผงรายวัน เก็บเงินหน้างาน เช็คอิน และเพิ่มร้าน walk-in',f:['📅 ปฏิทินจองรายวัน','💵 เก็บเงิน + เช็คอิน','➕ walk-in หน้างาน']}},
 {tab:'home',badge:'✅',tip:'ครบวงจร — บริหารทั้งตลาดจากแอปเดียว: ผัง · บิล · เงิน · จองรายวัน · บัญชี — กด “เริ่มใหม่” เพื่อสาธิตอีกครั้ง',focus:null,done:true,
   side:{h:'ทุกอย่างในแอปเดียว',p:'เลิกเดินเก็บ เลิกทวงเอง เลิกเดาว่าใครจ่าย — ตลาดโปร่งใส เก็บครบ เห็นตัวเลขจริง',f:['🏢 บริหารทั้งตลาดจากมือถือ','🔗 ต่อยอด POS/ฟิตเนส/Labor Win','☁️ ข้อมูลบนคลาวด์ ข้ามเครื่องได้']}}
];
var step=0, toast='';

function head(s1,s2,bg){ return '<div class="hd"'+(bg?' style="background:'+bg+'"':'')+'><div class="s1">'+s1+'</div><div class="s2">'+s2+'</div></div>'; }
function nav(active){ var t=[['home','🏠','ภาพรวม'],['plan','🗺️','ผังแผง'],['bill','🧾','บิล'],['money','💸','เงิน'],['daily','📅','รายวัน']];
  return '<div class="nav">'+t.map(function(x){return '<div class="'+(x[0]===active?'on':'')+'" id="nav-'+x[0]+'"><span class="ic">'+x[1]+'</span>'+x[2]+'</div>';}).join('')+'</div>'; }

function screenHTML(){
  var st=STEPS[step], tab=st.tab, inner='';
  if(tab==='home') inner=head('ตลาดสี่มุมเมือง','ภาพรวมวันนี้')+
    '<div class="body">'+
      '<div class="kpis">'+
        '<div class="kpi g"><div class="n">92%</div><div class="l">แผงมีร้าน</div></div>'+
        '<div class="kpi g"><div class="n">฿284K</div><div class="l">เก็บได้เดือนนี้</div></div>'+
        '<div class="kpi r"><div class="n">7</div><div class="l">ร้านค้างจ่าย</div></div>'+
        '<div class="kpi o"><div class="n">5</div><div class="l">แผงว่าง</div></div>'+
      '</div>'+
      '<div class="lbl">เมนูหลัก</div>'+
      '<div class="card rowc" id="nav-plan"><span>🗺️ ผังแผงจริง (ปักหมุด)</span><span style="color:var(--ink-3)">›</span></div>'+
      '<div class="card rowc"><span>🧾 ออกบิล / ทวงค่าเช่า</span><span style="color:var(--ink-3)">›</span></div>'+
      '<div class="card rowc"><span>💸 เงินเข้า / กระเป๋าร้าน</span><span style="color:var(--ink-3)">›</span></div>'+
    '</div>'+nav('home');
  else if(tab==='plan') inner=head('ผังแผงจริง','แตะหมุดเพื่อจัดการ')+
    '<div class="body"><div class="plan">'+
      pin('occ','A1',14,16)+pin('occ','A2',40,16)+pin('due','A3',66,14,'pin-due')+pin('free','A4',86,20)+
      pin('occ','B1',18,44)+pin('occ','B2',44,46)+pin('occ','B3',70,44)+pin('free','B4',88,50)+
      pin('occ','C1',16,74)+pin('due','C2',42,76)+pin('occ','C3',68,74)+
    '</div>'+
    '<div class="rowc" style="font-size:12px;color:var(--ink-3)"><span>🟢 มีร้าน</span><span>🔴 ค้างจ่าย</span><span>⚪ ว่าง</span></div>'+
    '</div>'+nav('plan');
  else if(tab==='bill') inner=head('ร้าน A3 · เจ๊หมวย','บิลค่าเช่ารอบนี้','var(--red)')+
    '<div class="body">'+
      '<div class="card"><div class="rowc"><b>ค่าเช่าแผง</b><span>฿3,500</span></div><div class="rowc" style="margin-top:6px"><b>ค่าน้ำ/ไฟ</b><span>฿420</span></div><div class="rowc" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><b>รวม</b><b style="color:var(--red);font-size:19px">฿3,920</b></div></div>'+
      '<div class="rowc"><span class="tag due">ค้างจ่าย 4 วัน</span><span style="font-size:12px;color:var(--ink-3)">VA: 8850-0003</span></div>'+
      '<button class="btn" id="bill-btn" style="margin-top:auto">📲 ส่งบิล + ทวงผ่าน LINE</button>'+
    '</div>'+nav('bill');
  else if(tab==='money') inner=head('เงินเข้า · Virtual Account','จับคู่บิลอัตโนมัติ')+
    '<div class="body">'+
      '<div class="card" style="border-left:4px solid var(--brand)"><div class="rowc"><b>💳 +฿3,920</b><span class="tag paid">จับคู่แล้ว</span></div><div style="font-size:12.5px;color:var(--ink-3);margin-top:4px">ร้าน A3 เจ๊หมวย · VA 8850-0003 · ปลดล็อกแผคแล้ว</div></div>'+
      '<div class="card"><div class="rowc"><b>💳 +฿3,500</b><span class="tag paid">จับคู่แล้ว</span></div><div style="font-size:12.5px;color:var(--ink-3);margin-top:4px">ร้าน B2 · VA 8850-0012</div></div>'+
      '<div class="card rowc"><span>📒 เดินบัญชี / ส่งบัญชี</span><span style="color:var(--ink-3)">›</span></div>'+
      '<div class="status" style="flex:0;padding:8px"><div class="s">เงินเข้าเลข VA ไหน = รู้ทันทีว่าร้านไหนจ่าย<br>ไม่ต้องแนบสลิป ไม่ต้องเดา</div></div>'+
    '</div>'+nav('money');
  else if(tab==='daily') inner=head('จองรายวัน · ตลาดนัด','เสาร์ 26 ก.ค.')+
    '<div class="body">'+
      '<div class="kpis"><div class="kpi g"><div class="n">18</div><div class="l">จองวันนี้</div></div><div class="kpi o"><div class="n">฿5,400</div><div class="l">เก็บได้</div></div></div>'+
      '<div class="card rowc"><span>🅰️ แผง D2 · ร้านส้มตำ</span><span class="tag paid">จ่าย+เช็คอิน</span></div>'+
      '<div class="card rowc"><span>🅱️ แผง D5 · ร้านผลไม้</span><span class="tag due">รอเก็บเงิน</span></div>'+
      '<button class="btn" id="daily-btn" style="margin-top:auto">➕ เพิ่มร้าน walk-in</button>'+
    '</div>'+nav('daily');
  return inner + (toast?'<div class="toast">'+toast+'</div>':'');
}
function pin(cls,label,x,y,id){ return '<div class="pin '+cls+'"'+(id?' id="'+id+'"':'')+' style="left:'+x+'%;top:'+y+'%"><i>'+label+'</i></div>'; }

function sideHTML(){ var s=STEPS[step].side; return '<h3>'+s.h+'</h3><p>'+s.p+'</p><div class="f">'+s.f.map(function(x){return '<div class="fi">'+x+'</div>';}).join('')+'</div>'; }

function render(){
  var st=STEPS[step];
  document.getElementById('scr').innerHTML=screenHTML();
  document.getElementById('side').innerHTML=sideHTML();
  document.getElementById('g-badge').textContent=st.badge;
  document.getElementById('g-step').textContent='ขั้นที่ '+(step+1)+' / '+STEPS.length;
  document.getElementById('g-tip').textContent=st.tip;
  document.getElementById('prog').style.width=((step+1)/STEPS.length*100)+'%';
  document.getElementById('g-prev').disabled=step===0;
  document.getElementById('g-next').textContent = step===STEPS.length-1?'↻ เริ่มใหม่':'ถัดไป →';
  if(st.focus){ var el=document.querySelector(st.focus); if(el){ el.classList.add('pulse'); el.onclick=function(){ next(); }; var h=document.createElement('div'); h.className='hint'; h.textContent=st.hint||'แตะ'; el.style.position='relative'; el.appendChild(h); } }
}
function next(){
  var st=STEPS[step];
  // set a toast for the action just taken (shows on the step we move INTO)
  if(step===3) toast='📲 ส่งบิลเข้า LINE ร้านแล้ว';
  else if(step===5) toast='➕ เพิ่มร้าน walk-in แล้ว';
  else toast='';
  if(step===STEPS.length-1){ step=0; toast=''; } else { step++; }
  render();
  if(toast){ setTimeout(function(){ toast=''; var t=document.querySelector('.toast'); if(t)t.style.display='none'; },2200); }
}
function prev(){ if(step>0){ step--; toast=''; render(); } }
document.getElementById('g-next').onclick=next;
document.getElementById('g-prev').onclick=prev;
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight')next(); if(e.key==='ArrowLeft')prev(); });
render();
</script>
</body>
</html>
