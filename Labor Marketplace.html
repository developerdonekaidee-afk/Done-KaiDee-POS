<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="build" content="p2-20260730j">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เรียกคนรับจ้าง — Market Labor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0E9C88;--brand-ink:#0A6E60;--brand-soft:#E3F5F1;--brand-softer:#EFFAF7;
    --green:#12945E;--red:#D8452F;--gold:#E8992F;--blue:#2C6ECB;--blue-soft:#E7F0FC;--plum:#7A4FBF;--plum-soft:#F0E9FA;
    --ink:#16211E;--ink-2:#54615B;--ink-3:#8A948E;--card:#fff;--hair:#E9EEEC;--hair-2:#DCE4E1;--bg:#F4F7F5;
    --font:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--font);background:#0A1F1C;color:var(--ink);-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:var(--font);}
  button{cursor:pointer;border:none;background:none;color:inherit;}
  .num{font-variant-numeric:tabular-nums;}.mono{font-family:var(--mono);}
  #root{min-height:100vh;}
  .device{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.3);}
  .appbar{flex:0 0 auto;background:linear-gradient(150deg,var(--brand),var(--brand-ink));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px;}
  .appbar.plum{background:linear-gradient(150deg,#8C63CE,#5B3A94);}
  .ab-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ab-title{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;min-width:0;}
  .ab-title .em{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto;}
  .ab-sel{background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;}
  .ab-sub{font-size:12.5px;opacity:.8;font-weight:600;margin-top:8px;}
  .scroll{flex:1;overflow-y:auto;padding:16px 16px 90px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
  .kpi{background:#fff;border-radius:14px;padding:12px 12px;border:1px solid var(--hair);}
  .kpi .v{font-size:22px;font-weight:800;line-height:1;}
  .kpi .l{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:5px;}
  .kpi .f{font-size:10.5px;color:var(--ink-3);margin-top:3px;}
  .card{background:#fff;border-radius:16px;border:1px solid var(--hair);padding:14px 15px;margin-bottom:11px;}
  .secttl{font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 2px 9px;}
  .btn{width:100%;padding:14px;border-radius:13px;font-size:15.5px;font-weight:800;background:var(--brand);color:#fff;}
  .btn:disabled{opacity:.4;}
  .btn.gh{background:var(--bg);color:var(--ink-2);border:1px solid var(--hair-2);}
  .btn.plum{background:var(--plum);}
  .btn.sm{padding:10px;font-size:14px;border-radius:11px;}
  .job{display:flex;flex-direction:column;gap:6px;}
  .job .jh{display:flex;align-items:flex-start;gap:10px;}
  .job .jem{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
  .job .jt{font-size:16px;font-weight:800;line-height:1.2;}
  .job .jmeta{font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.5;margin-top:2px;}
  .job .jpay{font-size:19px;font-weight:800;color:var(--brand-ink);white-space:nowrap;}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;}
  .p-open{background:var(--blue-soft);color:var(--blue);}
  .p-assigned{background:#FFF3D6;color:#8A6100;}
  .p-doing{background:var(--plum-soft);color:var(--plum);}
  .p-done{background:var(--brand-soft);color:var(--green);}
  .row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--hair);}
  .row:last-child{border-bottom:none;}
  .av{width:38px;height:38px;border-radius:50%;background:var(--plum-soft);color:var(--plum);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;}
  .lb{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:13px 0 6px;}
  .field{width:100%;padding:11px 13px;border:1.5px solid var(--hair-2);border-radius:11px;font-size:15px;background:#fff;outline:none;}
  .field:focus{border-color:var(--brand);}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:72px;padding:9px 8px;border-radius:10px;font-size:13px;font-weight:700;background:#fff;border:1.5px solid var(--hair-2);color:var(--ink-2);}
  .seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .note{border-radius:11px;padding:10px 13px;font-size:12.5px;font-weight:600;line-height:1.5;}
  .note.g{background:var(--brand-softer);color:var(--brand-ink);}
  .note.gold{background:#FFF7E6;color:#8A6100;}
  .empty{text-align:center;color:var(--ink-3);font-size:13.5px;font-weight:600;padding:34px 16px;}
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center;}
  .sheet{width:100%;max-width:460px;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;}
  .sheet h3{font-size:19px;font-weight:800;margin-bottom:3px;}
  .sheet .tag{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:12px;}
  .tabbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--hair);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--ink-3);font-size:11px;font-weight:700;border-radius:12px;}
  .tab.on{color:var(--brand-ink);background:var(--brand-softer);}
  .tab .te{font-size:19px;}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#16211E;color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:60;}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-top:10px;}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useEffect } = React;
(function(){
const LS='kd_labor_v1';
const B=n=>'฿'+(Number(n)||0).toLocaleString('en-US');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const todayISO=()=>new Date().toISOString().slice(0,10);
const isoAdd=(iso,d)=>{const x=new Date(iso);x.setDate(x.getDate()+d);return x.toISOString().slice(0,10);};
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
const thDay=iso=>{const x=new Date(iso+'T00:00');const t=todayISO();if(iso===t)return'วันนี้';if(iso===isoAdd(t,1))return'พรุ่งนี้';return DOW[x.getDay()]+' '+x.getDate()+'/'+(x.getMonth()+1);};
const JOB_TYPES=[
  {id:'push',em:'🛒',name:'เข็นของ / ขนย้าย'},
  {id:'lift',em:'📦',name:'ยกของ / ขึ้นลงรถ'},
  {id:'clean',em:'🧹',name:'ทำความสะอาด'},
  {id:'setup',em:'🏗️',name:'จัดร้าน / กางเต็นท์'},
  {id:'watch',em:'👁️',name:'เฝ้าแผง / เฝ้าของ'},
  {id:'sell',em:'🧑‍🍳',name:'ช่วยขาย / หน้าร้าน'},
  {id:'other',em:'🧰',name:'งานทั่วไปอื่นๆ'},
];
const typeOf=id=>JOB_TYPES.find(t=>t.id===id)||JOB_TYPES[6];
const STATUS={open:['เปิดรับ','p-open'],assigned:['ได้คนแล้ว','p-assigned'],doing:['กำลังทำ','p-doing'],done:['เสร็จแล้ว','p-done']};

function seed(){
  const t=todayISO();
  const workers=[
    {id:'w1',name:'สมชาย ป.',phone:'081-234-5678',skills:['push','lift'],rating:4.8,jobs:47,verified:true},
    {id:'w2',name:'มานี ก.',phone:'089-555-1212',skills:['clean','watch'],rating:4.9,jobs:63,verified:true},
    {id:'w3',name:'ประยุทธ ท.',phone:'062-777-8080',skills:['lift','setup'],rating:4.6,jobs:28,verified:true},
    {id:'w4',name:'สุดา ร.',phone:'085-321-9000',skills:['sell','clean'],rating:5.0,jobs:15,verified:false},
  ];
  const jobs=[
    {id:'j1',type:'push',title:'เข็นของขึ้นแผงโซน B',place:'ตลาดสี่มุมเมือง · โซน B แผง 12',date:t,time:'05:00',hours:2,pay:300,need:1,note:'ผัก 20 เข่ง ขึ้นจากรถกระบะ',status:'open',takers:[],by:'ร้านผักป้าแดง',at:Date.now()-36e5},
    {id:'j2',type:'clean',title:'ทำความสะอาดหลังปิดตลาด',place:'ตลาดสี่มุมเมือง · โซนอาหาร',date:t,time:'21:00',hours:3,pay:450,need:2,note:'กวาด ถูพื้น เก็บขยะ',status:'assigned',takers:['w2'],by:'สำนักงานตลาด',at:Date.now()-72e5},
    {id:'j3',type:'lift',title:'ยกกระสอบข้าวสาร',place:'ตลาดสี่มุมเมือง · โกดังหลัง',date:isoAdd(t,1),time:'06:30',hours:2,pay:400,need:2,note:'กระสอบละ 25 กก. ~40 กระสอบ',status:'open',takers:[],by:'ร้านข้าวเจ๊หมวย',at:Date.now()-9e5},
    {id:'j4',type:'setup',title:'กางเต็นท์ + จัดโต๊ะตลาดนัด',place:'ตลาดนัดเปิดท้าย · ลานหน้า',date:isoAdd(t,2),time:'15:00',hours:2,pay:350,need:3,note:'งานอีเวนต์สุดสัปดาห์',status:'open',takers:[],by:'สำนักงานตลาด',at:Date.now()-3e5},
    {id:'j5',type:'watch',title:'เฝ้าแผงช่วงพักเที่ยง',place:'ตลาดสี่มุมเมือง · โซน A แผง 5',date:t,time:'12:00',hours:1,pay:120,need:1,note:'',status:'done',takers:['w2'],by:'ร้านเสื้อผ้าพี่นก',at:Date.now()-864e5},
  ];
  return {workers,jobs,me:'w1'};
}
const load=()=>{try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.jobs)return d;}catch(e){}const s=seed();localStorage.setItem(LS,JSON.stringify(s));return s;};
const save=d=>{try{localStorage.setItem(LS,JSON.stringify(d));}catch(e){}};

function Sheet({title,tag,onClose,children}){
  return (<div className="scrim" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
    <h3>{title}</h3>{tag&&<div className="tag">{tag}</div>}{children}</div></div>);
}
function StatusPill({s}){ const [l,c]=STATUS[s]||STATUS.open; return <span className={'pill '+c}>{l}</span>; }

/* ══ ผู้จ้าง (ตลาด/ร้าน) ══ */
function HirerView({d,setData,toast}){
  const [post,setPost]=useState(false);
  const jobs=[...d.jobs].sort((a,b)=>(a.date+a.time<b.date+b.time?-1:1));
  const open=jobs.filter(j=>j.status==='open'), active=jobs.filter(j=>['assigned','doing'].includes(j.status));
  const doneToday=jobs.filter(j=>j.status==='done'&&j.date===todayISO());
  const wOf=id=>d.workers.find(w=>w.id===id);
  const advance=(j)=>setData(dd=>{const x=dd.jobs.find(y=>y.id===j.id);x.status=x.status==='assigned'?'doing':'done';return{...dd};});
  const close=(j)=>setData(dd=>{const x=dd.jobs.find(y=>y.id===j.id);x.status='done';(x.takers||[]).forEach(tid=>{const w=dd.workers.find(z=>z.id===tid);if(w)w.jobs=(w.jobs||0)+1;});return{...dd};});
  const del=(j)=>{if(!window.confirm('ลบประกาศงานนี้?'))return;setData(dd=>({...dd,jobs:dd.jobs.filter(y=>y.id!==j.id)}));};
  return (<div>
    <div className="kpis">
      <div className="kpi"><div className="v" style={{color:'var(--blue)'}}>{open.length}</div><div className="l">เปิดรับอยู่</div></div>
      <div className="kpi"><div className="v" style={{color:'var(--gold)'}}>{active.length}</div><div className="l">มีคนรับ/กำลังทำ</div></div>
      <div className="kpi"><div className="v" style={{color:'var(--green)'}}>{doneToday.length}</div><div className="l">เสร็จวันนี้</div></div>
    </div>
    <button className="btn" style={{marginBottom:14}} onClick={()=>setPost(true)}>+ ลงประกาศรับงาน</button>
    <div className="note g" style={{marginBottom:14}}>ลงประกาศล่วงหน้าได้ — ระบุประเภทงาน · วันเวลา · สถานที่ · ค่าจ้าง → คนรับจ้างในตลาดเห็นและกดรับงานได้ทันที</div>
    {jobs.length===0&&<div className="empty">ยังไม่มีประกาศงาน — กด “ลงประกาศรับงาน” เพื่อเริ่ม</div>}
    {jobs.map(j=>{const ty=typeOf(j.type);return (<div className="card job" key={j.id}>
      <div className="jh"><div className="jem">{ty.em}</div>
        <div style={{flex:1,minWidth:0}}><div className="jt">{j.title}</div>
          <div className="jmeta">📅 {thDay(j.date)} {j.time} น. · {j.hours} ชม.<br/>📍 {j.place}</div></div>
        <div style={{textAlign:'right'}}><div className="jpay">{B(j.pay)}</div><div style={{marginTop:5}}><StatusPill s={j.status}/></div></div>
      </div>
      {j.note&&<div className="jmeta" style={{fontStyle:'italic'}}>“{j.note}”</div>}
      <div className="jmeta">รับ {(j.takers||[]).length}/{j.need} คน{(j.takers||[]).length?' · '+(j.takers||[]).map(id=>(wOf(id)||{}).name).join(', '):''}</div>
      <div style={{display:'flex',gap:8,marginTop:4}}>
        {j.status==='assigned'&&<button className="btn plum sm" style={{flex:1}} onClick={()=>advance(j)}>เริ่มงาน</button>}
        {j.status==='doing'&&<button className="btn sm" style={{flex:1}} onClick={()=>close(j)}>ปิดงาน · จ่ายเงิน</button>}
        {j.status==='open'&&<button className="btn gh sm" style={{flex:1}} onClick={()=>del(j)}>ลบประกาศ</button>}
        {j.status==='done'&&<div className="note g" style={{flex:1,textAlign:'center'}}>✓ จบงาน · จ่าย {B(j.pay*(j.takers||[]).length)}</div>}
      </div>
    </div>);})}
    {post&&<PostSheet d={d} setData={setData} toast={toast} onClose={()=>setPost(false)}/>}
  </div>);
}
function PostSheet({d,setData,toast,onClose}){
  const [f,setF]=useState({type:'push',title:'',place:'',date:todayISO(),time:'06:00',hours:2,pay:300,need:1,note:''});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const go=()=>{ if(!f.title.trim()){toast('ใส่ชื่องาน');return;} if(!f.place.trim()){toast('ใส่สถานที่');return;}
    setData(dd=>({...dd,jobs:[{id:uid('j'),type:f.type,title:f.title.trim(),place:f.place.trim(),date:f.date,time:f.time,hours:+f.hours,pay:+f.pay,need:+f.need,note:f.note.trim(),status:'open',takers:[],by:'ร้าน/ตลาดของฉัน',at:Date.now()},...dd.jobs]}));
    toast('ลงประกาศแล้ว'); onClose(); };
  return (<Sheet title="ลงประกาศรับงาน" tag="งานแรงงานในตลาด — คนรับจ้างเห็นทันที" onClose={onClose}>
    <label className="lb" style={{marginTop:0}}>ประเภทงาน</label>
    <div className="seg">{JOB_TYPES.map(t=><button key={t.id} className={f.type===t.id?'on':''} onClick={()=>{set('type',t.id);if(!f.title)set('title',t.name);}}>{t.em} {t.name.split(' ')[0]}</button>)}</div>
    <label className="lb">ชื่องาน / รายละเอียดสั้น</label><input className="field" value={f.title} onChange={e=>set('title',e.target.value)} placeholder="เช่น เข็นของขึ้นแผงโซน B"/>
    <label className="lb">สถานที่ (ตลาด · โซน · แผง)</label><input className="field" value={f.place} onChange={e=>set('place',e.target.value)} placeholder="เช่น ตลาดสี่มุมเมือง · โซน B แผง 12"/>
    <div style={{display:'flex',gap:10}}>
      <div style={{flex:1}}><label className="lb">วันที่</label><input className="field" type="date" value={f.date} onChange={e=>set('date',e.target.value)}/></div>
      <div style={{flex:1}}><label className="lb">เวลาเริ่ม</label><input className="field" type="time" value={f.time} onChange={e=>set('time',e.target.value)}/></div>
    </div>
    <div style={{display:'flex',gap:10}}>
      <div style={{flex:1}}><label className="lb">กี่ชั่วโมง</label><input className="field num" type="number" value={f.hours} onChange={e=>set('hours',e.target.value)}/></div>
      <div style={{flex:1}}><label className="lb">รับกี่คน</label><input className="field num" type="number" value={f.need} onChange={e=>set('need',e.target.value)}/></div>
    </div>
    <label className="lb">ค่าจ้าง (บาท/คน)</label><input className="field num" type="number" value={f.pay} onChange={e=>set('pay',e.target.value)}/>
    <label className="lb">โน้ตเพิ่มเติม (ถ้ามี)</label><input className="field" value={f.note} onChange={e=>set('note',e.target.value)} placeholder="รายละเอียดงาน / สิ่งที่ต้องเตรียม"/>
    <button className="btn" style={{marginTop:18}} onClick={go}>ลงประกาศ</button>
  </Sheet>);
}

/* ══ คนรับจ้าง ══ */
function WorkerView({d,setData,toast}){
  const me=d.workers.find(w=>w.id===d.me)||d.workers[0];
  const mine=d.jobs.filter(j=>(j.takers||[]).includes(me.id)&&j.status!=='done').sort((a,b)=>a.date+a.time<b.date+b.time?-1:1);
  const avail=d.jobs.filter(j=>j.status==='open'&&!(j.takers||[]).includes(me.id)&&(j.takers||[]).length<j.need).sort((a,b)=>a.date+a.time<b.date+b.time?-1:1);
  const earn=d.jobs.filter(j=>j.status==='done'&&(j.takers||[]).includes(me.id)).reduce((a,j)=>a+j.pay,0);
  const accept=(j)=>setData(dd=>{const x=dd.jobs.find(y=>y.id===j.id);if(!x.takers)x.takers=[];if(!x.takers.includes(me.id))x.takers.push(me.id);if(x.takers.length>=x.need)x.status='assigned';return{...dd};});
  const drop=(j)=>setData(dd=>{const x=dd.jobs.find(y=>y.id===j.id);x.takers=(x.takers||[]).filter(t=>t!==me.id);if(x.status==='assigned'&&x.takers.length<x.need)x.status='open';return{...dd};});
  const JobCard=({j,mineFlag})=>{const ty=typeOf(j.type);return (<div className="card job">
    <div className="jh"><div className="jem">{ty.em}</div>
      <div style={{flex:1,minWidth:0}}><div className="jt">{j.title}</div>
        <div className="jmeta">📅 {thDay(j.date)} {j.time} น. · {j.hours} ชม.<br/>📍 {j.place}<br/>👤 โดย {j.by}</div></div>
      <div style={{textAlign:'right'}}><div className="jpay">{B(j.pay)}</div><div className="jmeta" style={{marginTop:2}}>{j.hours} ชม.</div></div>
    </div>
    {j.note&&<div className="jmeta" style={{fontStyle:'italic'}}>“{j.note}”</div>}
    {mineFlag
      ? <div style={{display:'flex',gap:8,alignItems:'center',marginTop:4}}><StatusPill s={j.status}/><div style={{flex:1}}/><button className="btn gh sm" style={{flex:'0 0 auto',padding:'8px 14px'}} onClick={()=>drop(j)}>ยกเลิก</button></div>
      : <button className="btn plum sm" style={{marginTop:4}} onClick={()=>accept(j)}>รับงานนี้ · {B(j.pay)}</button>}
  </div>);};
  return (<div>
    <div className="card" style={{display:'flex',alignItems:'center',gap:12}}>
      <div className="av" style={{width:46,height:46,fontSize:18}}>{me.name[0]}</div>
      <div style={{flex:1}}><div style={{fontWeight:800,fontSize:16}}>{me.name} {me.verified&&<span className="pill p-done">✓ ยืนยันตัวตน</span>}</div>
        <div className="jmeta">⭐ {me.rating} · ทำงานสำเร็จ {me.jobs} งาน · {me.phone}</div></div>
    </div>
    <div className="kpis">
      <div className="kpi"><div className="v" style={{color:'var(--blue)'}}>{avail.length}</div><div className="l">งานเปิดรับ</div></div>
      <div className="kpi"><div className="v" style={{color:'var(--plum)'}}>{mine.length}</div><div className="l">งานของฉัน</div></div>
      <div className="kpi"><div className="v" style={{color:'var(--green)'}}>{B(earn)}</div><div className="l">รายได้สะสม</div></div>
    </div>
    {mine.length>0&&<><div className="secttl">งานที่รับไว้</div>{mine.map(j=><JobCard key={j.id} j={j} mineFlag/>)}</>}
    <div className="secttl">งานเปิดรับใกล้คุณ</div>
    {avail.length===0?<div className="empty">ยังไม่มีงานเปิดรับตอนนี้ — กลับมาเช็คใหม่นะ</div>:avail.map(j=><JobCard key={j.id} j={j}/>)}
  </div>);
}

function App(){
  const [d,setD0]=useState(load);
  const [lens,setLens]=useState('hirer');
  const [toastMsg,setToastMsg]=useState('');
  const setData=fn=>setD0(p=>{const n=typeof fn==='function'?fn(p):fn;save(n);return n;});
  const toast=m=>{setToastMsg(m);clearTimeout(window.__lt);window.__lt=setTimeout(()=>setToastMsg(''),1600);};
  const plum=lens==='worker';
  return (<div className="device">
    <div className={'appbar'+(plum?' plum':'')}>
      <div className="ab-top">
        <div className="ab-title"><span className="em">{plum?'🧑‍🔧':'📋'}</span>{plum?'คนรับจ้าง':'เรียกคนรับจ้าง'}</div>
        {plum
          ? <select className="ab-sel" value={d.me} onChange={e=>setData(dd=>({...dd,me:e.target.value}))}>{d.workers.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select>
          : <button className="ab-sel" onClick={()=>setLens('worker')}>🧑‍🔧 มุมคนรับจ้าง</button>}
      </div>
      <div className="ab-sub">{plum?'เลือกงานในตลาด · รับงาน · ติดตามสถานะ':'ตลาด/ร้าน ลงประกาศจ้างแรงงานรายครั้ง'}
        {plum&&<span onClick={()=>setLens('hirer')} style={{marginLeft:8,textDecoration:'underline',cursor:'pointer'}}>← กลับมุมผู้จ้าง</span>}</div>
    </div>
    <div className="scroll">{lens==='hirer'?<HirerView d={d} setData={setData} toast={toast}/>:<WorkerView d={d} setData={setData} toast={toast}/>}</div>
    {toastMsg&&<div className="toast">{toastMsg}</div>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script>
</body>
</html>
