name: Deploy Workers
# push แล้ว deploy Worker ให้เอง (ไม่ต้องเปิดหน้า Cloudflare)
# ต้องตั้ง secret ใน repo ก่อน: Settings → Secrets and variables → Actions
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  (เลข account id ที่หน้า Workers)
on:
  push:
    branches: [main]
    paths:
      - 'kaidee-pos-worker/**'
      - 'license-worker/**'
      - 'platform-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
jobs:
  pos:
    name: kaidee-pos (API หลัก + กระเป๋าเงิน)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: kaidee-pos-worker
  license:
    name: license-worker (trial / ใบอนุญาต)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        if: hashFiles('license-worker/wrangler.toml') != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: license-worker
