/* bottom role tabs — inside the phone screen */
.tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}

@media(max-width:520px){
  body{padding:0;display:block}

<body>
<div id="mount"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;
const LS='kd_laborwin_v1';
const B=(n)=>'฿'+Number(n||0).toLocaleString('en-US');
const COMMISSION=0.10;

const JOBS_DEF=[{id:'lift',e:'📦',th:'ยกของ',my:'ကုန်ချ',price:120},{id:'carry',e:'🛒',th:'แบกของ',my:'သယ်ပို့',price:100},{id:'pack',e:'📦',th:'แพ็กสินค้า',my:'ထုပ်ပိုး',price:90}];
const WINS=[{id:'red',th:'แดง',cls:'red',dot:'🔴'},{id:'blue',th:'น้ำเงิน',cls:'blue',dot:'🔵'},{id:'green',th:'เขียว',cls:'green',dot:'🟢'}];
const ME={name:'หม่อง',win:'red'};
const QP=new URLSearchParams(location.search);
const REGION=QP.get('region')||'pool';
const MARKET=QP.get('market')||null;
const DEMO_LOC={lat:13.9846,lng:100.6540}; // ตลาดกลางลาดสวาย (fallback ถ้า GPS ปิด)
function getGeo(){ return new Promise(res=>{ if(!navigator.geolocation) return res(DEMO_LOC); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),()=>res(DEMO_LOC),{timeout:6000,maximumAge:60000}); }); }

const T={
  th:{newjob:'งานใหม่',wage:'ค่าแรง',commission:'หักค่าคิว',accept:'รับงาน',reject:'ไม่รับ',answer:'ตอบใน 60 วิ',free:'ว่าง',waiting:'รองานเข้า…',going:'ไปที่ล็อก',working:'กำลังทำงาน',getcash:'รับเงินสด',queue:'คิว',lock:'ล็อก'},
  my:{newjob:'အလုပ်အသစ်',wage:'လုပ်ခ',commission:'ကော်မရှင်',accept:'လက်ခံ',reject:'ငြင်း',answer:'၆၀ စက္ကန့်',free:'အားနေ',waiting:'အလုပ်စောင့်…',going:'သွားပါ',working:'အလုပ်လုပ်နေ',getcash:'ငွေလက်ခံ',queue:'တန်းစီ',lock:'နေရာ'},
  kh:{newjob:'ការងារថ្មី',wage:'ប្រាក់ឈ្នួល',commission:'កាត់',accept:'ទទួល',reject:'បដិសេធ',answer:'៦០វិ',free:'ទំនេរ',waiting:'រង់ចាំ…',going:'ទៅ',working:'កំពុងធ្វើ',getcash:'ទទួលប្រាក់',queue:'ជួរ',lock:'ទីតាំង'},
};

function seed(){ return {jobs:[],winIncome:840,payMode:'cash',lock:'A-12'}; }
function load(){ try{return JSON.parse(localStorage.getItem(LS))||seed()}catch(e){return seed()} }

function Hd({bg,s1,s2,children}){return <div className="hd" style={{background:bg}}><div className="s1">{s1}</div><div className="s2">{s2}</div>{children}</div>;}

/* ── บทบาท 1: แม่ค้า / ร้าน ── */
function Shop({st,up,flash}){
  const [job,setJob]=useState('lift');
  const [win,setWin]=useState(null);
  const active=st.jobs.filter(j=>j.status!=='done');
  const jd=JOBS_DEF.find(j=>j.id===job);
  const call=()=>{ if(!win)return; const jid='j'+Date.now(); up(s=>{s.jobs.unshift({id:jid,type:job,win,price:jd.price,status:'queued',t:Date.now()})}); flash('ส่งงานเข้าคิววิน'+WINS.find(w=>w.id===win).th+'แล้ว');
    if(window.PLAT_API){ getGeo().then(loc=>PLAT_API.poolPostJob({id:jid,title:jd.th,type:job,pay:jd.price,win,shopName:'เจ๊แดง · แผง A-12',marketId:MARKET,lat:loc.lat,lng:loc.lng},REGION).catch(()=>{})); }
    setWin(null); };
  const finish=(jid)=>{ up(s=>{const j=s.jobs.find(x=>x.id===jid);if(j){j.status='done';s.winIncome+=Math.round(j.price*COMMISSION);}}); flash('จบงาน · จ่ายสด + ค่าคิวเข้าวิน'); };
  return <>
    <Hd bg="var(--brand)" s1="หน้าร้าน · เรียกแรงงาน" s2="เจ๊แดง · แผง A-12"/>
    <div className="body">
      <div className="lbl">เลือกประเภทงาน</div>
      <div className="row">{JOBS_DEF.map(j=><div key={j.id} className={'chip'+(job===j.id?' on':'')} onClick={()=>setJob(j.id)}>{j.e} {j.th}</div>)}</div>
      <div className="lbl">เลือกวิน (สีเสื้อ) — ค่าคิวเข้าหัวหน้าวินสีนี้</div>
      <div className="row">{WINS.map(w=><div key={w.id} className={'chip '+w.cls+(win===w.id?' on':'')} onClick={()=>setWin(w.id)}>{w.dot} {w.th}</div>)}</div>
      <div className="card price"><span style={{color:'var(--ink-3)',fontSize:14}}>ราคากลาง (จ่ายสด)</span><b>{B(jd.price)}</b></div>
      <button className="btn" disabled={!win} onClick={call}>เรียกแรงงาน →</button>
      <div className="lbl" style={{marginTop:6}}>งานที่กำลังดำเนินการ</div>
      {active.length===0&&<div className="empty">ยังไม่มีงานค้าง — เลือกงานแล้วกดเรียก</div>}
      {active.map(j=>{const d=JOBS_DEF.find(x=>x.id===j.type);const w=WINS.find(x=>x.id===j.win);
        return <div className="jobc" key={j.id}>
          <div className="jt"><span className="e">{d.e}</span><b>{d.th}</b><span style={{marginLeft:'auto'}}>{
            j.status==='queued'?<span className="tag q">รอแรงงานรับ</span>:
            j.status==='accepted'?<span className="tag work">กำลังมา 🛵</span>:
            <span className="tag work">ทำงานอยู่ 💪</span>}</span></div>
          <div className="rowb"><span style={{color:'var(--ink-3)'}}>{w.dot} วิน{w.th} · {B(j.price)}</span>{j.worker&&<b>👷 {j.worker}</b>}</div>
          {(j.status==='accepted'||j.status==='working')&&<button className="btn" onClick={()=>finish(j.id)}>จ่าย {B(j.price)} + จบงาน (สแกน QR)</button>}
          {j.status==='queued'&&<div style={{fontSize:12,color:'var(--ink-3)',textAlign:'center'}}>แตะแท็บ “แรงงาน” ล่างเพื่อกดรับงาน</div>}
        </div>;})}
    </div>
  </>;
}

/* ── งานใกล้ฉัน (worker pool กลาง + GPS · ผูก backend จริง) ── */
function NearJobs(){
  const [loc,setLoc]=useState(null),[jobs,setJobs]=useState(null),[reg,setReg]=useState(false),[busy,setBusy]=useState(false);
  const refresh=async(l)=>{ if(!window.PLAT_API)return; try{const r=await PLAT_API.jobsNear(l.lat,l.lng,{radius:15,status:'open',win:ME.win,region:REGION});setJobs(r.jobs||[]);}catch(e){setJobs([]);} };
  const share=async()=>{ setBusy(true); const l=await getGeo(); setLoc(l);
    if(window.PLAT_API){try{await PLAT_API.poolWorker({id:ME.name,name:ME.name,line:ME.name,skills:['lift','carry','pack'],lat:l.lat,lng:l.lng,available:true,marketId:MARKET,lang:'th'},REGION);}catch(e){}}
    setReg(true); await refresh(l); setBusy(false); };
  const take=async(j)=>{ if(window.PLAT_API){try{await PLAT_API.poolPatchJob(j.id,{status:'accepted',worker:ME.name},REGION);await PLAT_API.poolWorker({id:ME.name,name:ME.name,available:false,lat:loc.lat,lng:loc.lng},REGION);}catch(e){}} refresh(loc); };
  useEffect(()=>{ if(reg&&loc){const t=setInterval(()=>refresh(loc),5000);return ()=>clearInterval(t);} },[reg,loc]);
  if(!window.PLAT_API) return <div className="empty">ยังไม่ได้เชื่อม backend<br/>(ตั้ง endpoint ใน platform-api.jsx)</div>;
  if(!reg) return <div className="status" style={{flex:1}}><div className="big">📍</div><div className="t">งานใกล้ฉัน</div><div className="s">แชร์พิกัดเพื่อรับงานจากร้านทุกตลาดในรัศมี 15 กม.<br/>(worker pool กลาง)</div><button className="btn" onClick={share} disabled={busy}>{busy?'กำลังหาพิกัด…':'📍 ลงทะเบียนพร้อมทำงาน'}</button></div>;
  return <>
    <div className="rowb card"><b>🟢 พร้อมทำงาน</b><span className="tag free">📍 {loc.lat.toFixed(3)}, {loc.lng.toFixed(3)}</span></div>
    {jobs==null&&<div className="empty">กำลังโหลดงานใกล้คุณ…</div>}
    {jobs&&jobs.length===0&&<div className="empty">ยังไม่มีงานในรัศมี 15 กม.<br/>ให้ร้านกดเรียกงาน (แท็บแม่ค้า) จากเครื่องอื่น</div>}
    {jobs&&jobs.map(j=><div className="jobc" key={j.id} style={{border:'2px solid var(--gold)'}}>
      <div className="jt"><span className="e">📦</span><div><b>{j.title}</b><div className="my">{j.shopName||'ร้านในระบบ'}</div></div><span style={{marginLeft:'auto'}} className="tag q">{j.distKm!=null?j.distKm+' กม.':'—'}</span></div>
      <div className="rowb"><span style={{color:'var(--ink-3)'}}>ค่าแรง</span><b style={{fontSize:20,color:'var(--brand)'}}>{B(j.pay)}</b></div>
      <button className="btn" style={{background:'var(--green)'}} onClick={()=>take(j)}>🟢 รับงานนี้</button>
    </div>)}
  </>;
}

/* ── บทบาท 2: แรงงาน ── */
function Worker({st,up,flash}){
  const [lang,setLang]=useState('th');
  const [wtab,setWtab]=useState('win');
  const t=T[lang];
  const offers=st.jobs.filter(j=>j.status==='queued'&&j.win===ME.win);
  const mine=st.jobs.find(j=>j.worker===ME.name&&(j.status==='accepted'||j.status==='working'));
  const accept=(jid)=>{ up(s=>{const j=s.jobs.find(x=>x.id===jid);if(j){j.status='accepted';j.worker=ME.name;}}); flash('รับงานแล้ว'); };
  const reject=(jid)=>{ up(s=>{const j=s.jobs.find(x=>x.id===jid);if(j){j.status='queued';j.rejected=true;}}); flash('ส่งงานให้คิวถัดไป'); };
  const arrive=(jid)=>{ up(s=>{const j=s.jobs.find(x=>x.id===jid);if(j)j.status='working';}); };
  const langBar=<div className="lang">{['th','my','kh'].map(l=><b key={l} className={lang===l?'on':''} onClick={()=>setLang(l)}>{l.toUpperCase()}</b>)}</div>;
  if(mine){ const d=JOBS_DEF.find(x=>x.id===mine.type);
    return <><Hd bg="var(--green)" s1={'วิน'+WINS.find(w=>w.id===ME.win).th+' · '+ME.name} s2={mine.status==='accepted'?t.going+' '+st.lock:t.working}>{langBar}</Hd>
      <div className="body"><div className="status">
        <div className="big">{mine.status==='accepted'?'🗺️':'💪'}</div>
        <div className="t">{d.e} {d.th} · {B(mine.price)}</div>
        <div className="card" style={{width:'100%'}}>{t.lock} <b>{st.lock}</b> · แผนที่จำลอง</div>
        {mine.status==='accepted'
          ? <button className="btn" style={{background:'var(--green)'}} onClick={()=>arrive(mine.id)}>ถึงแล้ว · เริ่มงาน</button>
          : <div className="s">{t.getcash} {B(mine.price)} — รอแม่ค้ากดจบงาน</div>}
      </div></div></>;
  }
  return <><Hd bg="#1f2a24" s1={'วิน'+WINS.find(w=>w.id===ME.win).th+' · '+ME.name} s2={t.newjob+' / '+t.queue}>{langBar}</Hd>
    <div className="body">
      <div className="seg"><button className={wtab==='win'?'on':''} onClick={()=>setWtab('win')}>งานในวิน (เดโม)</button><button className={wtab==='near'?'on':''} onClick={()=>setWtab('near')}>🌍 งานใกล้ฉัน</button></div>
      {wtab==='near'?<NearJobs/>:<>
      <div className="rowb card"><b>สถานะ</b><span className="tag free">🟢 {t.free} · {t.queue} 1</span></div>
      {offers.length===0&&<div className="status" style={{flex:1}}><div className="big">⏳</div><div className="s">{t.waiting}<br/>แตะแท็บ “แม่ค้า” เพื่อเรียกงานเข้ามา</div></div>}
      {offers.map(j=>{const d=JOBS_DEF.find(x=>x.id===j.type);
        return <div className="jobc" key={j.id} style={{border:'2px solid var(--gold)'}}>
          <div className="jt"><span className="e">{d.e}</span><div><b>{d.th}</b><div className="my">{d.my}</div></div></div>
          <div className="rowb"><span style={{color:'var(--ink-3)'}}>{t.wage} / {d.my}</span><b style={{fontSize:20,color:'var(--brand)'}}>{B(j.price)}</b></div>
          <div className="rowb"><span style={{color:'var(--ink-3)'}}>{t.commission}</span><span style={{color:'var(--red)'}}>-{B(Math.round(j.price*COMMISSION))}</span></div>
          <div className="timer">⏱️ {t.answer}</div>
          <div className="btn2"><div className="b" style={{background:'var(--red)'}} onClick={()=>reject(j.id)}>🔴 {t.reject}</div><div className="b" style={{background:'var(--green)'}} onClick={()=>accept(j.id)}>🟢 {t.accept}</div></div>
        </div>;})}
      </>}
    </div></>;
}

/* ── บทบาท 3: หัวหน้าวิน ── */
function Win({st,up,flash}){
  const [tab,setTab]=useState('queue');
  const working=st.jobs.filter(j=>(j.status==='accepted'||j.status==='working')&&j.win==='red');
  const withdraw=()=>{ up(s=>{s.winIncome=0}); flash('ถอนเข้าบัญชีแล้ว'); };
  const PM=[{id:'cash',e:'💵',th:'เงินสด',s:'แรงงานจ่ายค่าคิวสด · แอปไม่แตะเงิน'},{id:'promptpay',e:'💳',th:'PromptPay ตรง',s:'ส่ง QR หัวหน้าวิน · แรงงานโอน+แนบสลิป'},{id:'wallet',e:'👛',th:'กระเป๋าล่วงหน้า',s:'หัก wallet แรงงานอัตโนมัติเข้าวิน 100%'}];
  return <><Hd bg="#1f2a24" s1="หัวหน้าวินแดง · คิวในสังกัด" s2="แดชบอร์ด"/>
    <div className="body">
      <div className="card" style={{background:'#1f2a24',color:'#fff'}}><div style={{fontSize:12,opacity:.8}}>รายได้ค่าหัวคิววันนี้</div><div className="big-in">{B(st.winIncome)}</div></div>
      <div className="seg"><button className={tab==='queue'?'on':''} onClick={()=>setTab('queue')}>คิว & แรงงาน</button><button className={tab==='pay'?'on':''} onClick={()=>setTab('pay')}>หน้ารับเงิน</button></div>
      {tab==='queue'?<>
        <div className="lbl">แรงงานในวิน</div>
        <div className="rowb card"><b>👷 หม่อง</b>{working.find(j=>j.worker==='หม่อง')?<span className="tag work">ทำงาน · {st.lock}</span>:<span className="tag free">🟢 ว่าง · คิว 1</span>}</div>
        <div className="rowb card"><b>👷 จอ</b><span className="tag free">🟢 ว่าง · คิว 2</span></div>
        <div className="rowb card"><b>👷 อาทิตย์</b><span className="tag free">🟢 ว่าง · คิว 3</span></div>
        <button className="btn dark" disabled={st.winIncome===0} onClick={withdraw}>💳 ถอน {B(st.winIncome)} เข้าบัญชี</button>
        <div style={{fontSize:12,color:'var(--ink-3)',textAlign:'center'}}>ค่าคิวเข้าอัตโนมัติทุกครั้งที่แม่ค้ากดจบงาน</div>
      </>:<>
        <div className="lbl">เลือกวิธีรับค่าหัวคิว (หัวหน้าวินตั้งเอง)</div>
        <div className="paysel">{PM.map(p=><div key={p.id} className={'p'+(st.payMode===p.id?' on':'')} onClick={()=>up(s=>{s.payMode=p.id})}><span style={{fontSize:20}}>{p.e}</span><div><b style={{fontSize:13.5}}>{p.th}</b><div style={{fontSize:11.5,color:'var(--ink-3)'}}>{p.s}</div></div><span className="r"></span></div>)}</div>
        <div className="paybox"><div className="h">ตอนนี้ใช้: {PM.find(p=>p.id===st.payMode).th}</div><div style={{fontSize:12.5,marginTop:4}}>{PM.find(p=>p.id===st.payMode).s}</div></div>
      </>}
      <button className="reset" onClick={()=>{if(confirm('ล้างงานทั้งหมด + รายได้กลับค่าเริ่มต้น?')){localStorage.removeItem(LS);location.reload();}}}>↻ รีเซ็ตเดโม</button>
    </div></>;
}

function Root(){
  const [role,setRole]=useState('shop');
  const [st,setSt]=useState(load);
  const [toast,setToast]=useState('');
  const first=React.useRef(true);
  useEffect(()=>{ if(first.current){first.current=false;return;} try{st.updatedAt=Date.now();localStorage.setItem(LS,JSON.stringify(st))}catch(e){} if(window.__laborSync)window.__laborSync.push(); },[st]);
  useEffect(()=>{ if(!window.PLAT_API) return;
    const p=new URLSearchParams(location.search); const biz=p.get('biz')||'demo-labor';
    const sync=window.PLAT_API.attach({ biz, type:'laborwin', key:'laborwin',
      read:()=>load(), write:(b)=>{try{localStorage.setItem(LS,JSON.stringify(b))}catch(e){}}, onRemote:(b)=>setSt(b), stamp:(b)=>(b&&b.updatedAt)||0 });
    window.__laborSync=sync; return ()=>{ try{sync.stop()}catch(e){} window.__laborSync=null; };
  },[]);
  const flash=(m)=>{setToast(m);setTimeout(()=>setToast(''),1600);};
  const up=(fn)=>setSt(s=>{const n=JSON.parse(JSON.stringify(s));fn(n);return n;});
  const R=[{id:'shop',e:'🏪',l:'แม่ค้า',c:'shop'},{id:'worker',e:'👷',l:'แรงงาน',c:'worker'},{id:'win',e:'🎽',l:'หัวหน้าวิน',c:'win'}];
  // badge counts
  const nOffer=st.jobs.filter(j=>j.status==='queued'&&j.win===ME.win).length;
  return (<>
    <div className="head">
      <span className="kick">🎽 Labor Win · แอปจริง</span>
      <h1>ระบบวินแรงงาน 3 บทบาท</h1>
      <p>แตะแท็บล่างเพื่อสลับบทบาท — เรียกงาน · รับงาน · เก็บค่าคิว เชื่อมกันจริงในเครื่องเดียว</p>
    </div>
    <div className="phone"><div className="screen">
      {role==='shop'&&<Shop st={st} up={up} flash={flash}/>}
      {role==='worker'&&<Worker st={st} up={up} flash={flash}/>}
      {role==='win'&&<Win st={st} up={up} flash={flash}/>}
      {toast&&<div className="toast">{toast}</div>}
      <div className="tabbar">{R.map(r=><button key={r.id} className={(role===r.id?'on '+r.c:'')} onClick={()=>setRole(r.id)}>
        <span className="e" style={{position:'relative'}}>{r.e}{r.id==='worker'&&nOffer>0&&<span style={{position:'absolute',top:-4,right:-9,background:'var(--red)',color:'#fff',fontSize:10,fontWeight:800,minWidth:16,height:16,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px'}}>{nOffer}</span>}</span>
        {r.l}</button>)}</div>
    </div></div>
  </>);
}
ReactDOM.createRoot(document.getElementById('mount')).render(<Root/>);
</script>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0E7C4E"/><text x="50" y="46" font-size="30" text-anchor="middle">🎽</text><text x="50" y="74" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#fff">Labor Win</text></svg>
</template>
</body>
</html>
