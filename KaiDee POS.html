<style>
  :root{
    --brand:#0E9C88;        /* teal — green-blue */
    --brand-ink:#0A6E60;
    --brand-soft:#E3F5F1;
    --brand-softer:#EFFAF7;
    --accent:#2E6FB0;       /* blue (accent) */
    --hero:linear-gradient(152deg,#14A886 0%,#1E73B0 100%); /* green→blue */
    --accent-soft:#E6EFF9;
    --accent-ink:#1F5C99;
    --blue:#2E6FB0;
    --danger:#E0533D;
    --line-green:#06C755;   /* LINE */
    --ink:#1B2420;
    --ink-2:#57635C;
    --ink-3:#8A948E;
    --bg:#F5F7F5;
    --card:#FFFFFF;
    --hair:#EAEFEA;
    --hair-2:#DDE5DF;
    --shadow:0 1px 2px rgba(20,40,30,.05), 0 6px 20px rgba(20,40,30,.06);
    --shadow-lg:0 12px 40px rgba(20,40,30,.14);
    --r:18px;
    --font:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:#E6EAE7;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #stage{
    display:flex;align-items:center;justify-content:center;
    padding:24px;min-height:100vh;width:100%;
  }
  a{color:var(--brand-ink);}
  a:hover{color:var(--brand);}

  /* full-screen app shell on real phones (no device bezel) */
  .kd-fill{ position:fixed; inset:0; background:var(--bg); overflow:hidden;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }

  /* ---- shared app primitives (inside device) ---- */
  .kd-screen{ position:absolute; inset:0; display:flex; flex-direction:column;
    background:var(--bg); overflow:hidden; }
  .kd-body{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
  .kd-body::-webkit-scrollbar{ display:none; }
  .kd-body{ scrollbar-width:none; }

  .kd-btn{ font-family:var(--font); font-weight:600; border:none; cursor:pointer;
    border-radius:14px; padding:14px 18px; font-size:16px; transition:transform .12s, filter .15s, background .15s;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .kd-btn:active{ transform:scale(.97); }
  .kd-btn-primary{ background:var(--brand); color:#fff; }
  .kd-btn-primary:hover{ filter:brightness(1.05); }
  .kd-btn-ghost{ background:var(--brand-soft); color:var(--brand-ink); }
  .kd-btn-dark{ background:var(--ink); color:#fff; }
  .kd-btn-line{ background:var(--line-green); color:#fff; }
  .kd-btn-block{ width:100%; }

  .kd-card{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); }

  .kd-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:4px 10px; border-radius:999px; background:var(--brand-soft); color:var(--brand-ink); white-space:nowrap; }

  .kd-fadein{ animation:kdFade .35s ease both; }
  @keyframes kdFade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .kd-pop{ animation:kdPop .3s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes kdPop{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:none;} }
  .kd-slideup{ animation:kdSlide .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes kdSlide{ from{transform:translateY(100%);} to{transform:none;} }

  input,textarea,select{ font-family:var(--font); }
  .kd-input{ width:100%; border:1.5px solid var(--hair-2); border-radius:12px; padding:12px 14px;
    font-size:15px; background:#fff; color:var(--ink); outline:none; transition:border .15s; }
  .kd-input:focus{ border-color:var(--brand); }
  .num{ font-variant-numeric:tabular-nums; }

  /* horizontal chip row — compact, no scrollbar */
  .kd-chiprow{ display:flex; align-items:center; gap:8px; overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .kd-chiprow::-webkit-scrollbar{ display:none; }
  .kd-chip-btn{ flex:0 0 auto; border:none; cursor:pointer; white-space:nowrap; font-family:var(--font);
    font-weight:600; font-size:14px; padding:9px 15px; border-radius:12px; height:40px;
    display:inline-flex; align-items:center; gap:6px; background:#fff; color:var(--ink-2);
    box-shadow:var(--shadow); transition:background .15s, color .15s; }
  .kd-chip-btn.on{ background:var(--brand); color:#fff; box-shadow:none; }
  .kd-chip-add{ flex:0 0 auto; width:40px; height:40px; border-radius:12px; border:1.5px dashed var(--hair-2);
    background:var(--brand-softer); color:var(--brand); cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center; }
</style>
</head>
